plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.careai.guardian'
    compileSdk 35

    defaultConfig {
        applicationId "ir.careai.guardian"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0-EYE"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
