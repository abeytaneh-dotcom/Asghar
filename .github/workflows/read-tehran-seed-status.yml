name: Read Tehran Seed Status
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/read-tehran-seed-status'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test Digikala Jet public search API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,ssl
          names=['کره بادام زمینی جیف','آدامس تریدنت آناناس','نوشیدنی انرژی زا مانستر','روغن ذرت رویال','چای دلفین معطر']
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36'
          base='https://api.digikalajet.ir/v2/search/'
          for name in names:
              params={'q':name,'page':1,'latitude':'35.757453','longitude':'51.409882'}
              u=base+'?'+urllib.parse.urlencode(params)
              try:
                  rq=urllib.request.Request(u,headers={
                      'User-Agent':ua,'Accept':'application/json','Accept-Language':'fa-IR,fa;q=0.9,en;q=0.5',
                      'Origin':'https://www.digikalajet.com','Referer':'https://www.digikalajet.com/'
                  })
                  with urllib.request.urlopen(rq,timeout=25,context=ctx) as r:
                      raw=r.read(4_000_000); code=r.status; ct=r.headers.get('content-type','')
                  txt=raw.decode('utf-8','replace')
                  print('\nQUERY',name,'HTTP',code,'TYPE',ct,'BYTES',len(raw))
                  try:
                      d=json.loads(txt)
                      print('TOP_KEYS',list(d)[:20])
                      print(json.dumps(d,ensure_ascii=False)[:10000])
                  except Exception:
                      print(txt[:5000])
              except Exception as e:
                  print('\nQUERY',name,'ERROR',type(e).__name__,e)
          PY
