name: Read Tehran Seed Status
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/read-tehran-seed-status'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Snapp product barcode fields
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,ssl,re
          name='آدامس تریدنت آناناس'
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          q=urllib.parse.urlencode({'query':name,'latitude':'35.757453','longitude':'51.409882','page':0,'page_size':20,'size':20,'fetch_filters':1,'firstPage':'true','origin':'search'})
          u='https://svc.snapp.market/mobile/v3/search?'+q
          rq=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/141 Safari/537.36','Accept':'application/json','Origin':'https://snapp.market','Referer':'https://snapp.market/'})
          with urllib.request.urlopen(rq,timeout=25,context=ctx) as r:d=json.loads(r.read(4_000_000))
          ps=[]
          for v in d.get('data',{}).get('vendor_product_variations',{}).get('items',[]) or []:
            for p in v.get('products',[]) or []:
              ps.append(p)
          print('PRODUCTS',len(ps))
          for p in ps[:5]:
            print('TITLE',p.get('title'))
            print('KEYS',sorted(p.keys()))
            print('BARLIKE',{k:v for k,v in p.items() if any(x in k.lower() for x in ['bar','ean','upc','serial','sku','code'])})
            print('IMAGE',((p.get('images') or [{}])[0] or {}).get('main'))
          PY
