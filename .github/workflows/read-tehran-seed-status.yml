name: Read Tehran Seed Status
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/read-tehran-seed-status'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace Digikala Jet search API method
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re,urllib.request,ssl
          u='https://www.digikalajet.com/assets/x-app.DgWmlWEz.js'
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/141 Safari/537.36','Referer':'https://www.digikalajet.com/'})
          with urllib.request.urlopen(q,timeout=30,context=ctx) as r:t=r.read(8_000_000).decode('utf-8','replace')
          print('BYTES',len(t))
          # Endpoint-like strings most likely used by search/product APIs.
          vals=[]
          for m in re.finditer(r'["\'`]([^"\'`]{2,240})["\'`]',t):
            s=m.group(1).replace('\\/','/')
            l=s.lower()
            if any(k in l for k in ['search','product-list','searchia','products/search','v2/search','v3/search','shop/search']) and '/' in s:vals.append(s)
          for s in list(dict.fromkeys(vals))[:500]:print('PATH',s)
          # The result-v2 bundle imports Cs as the API method; find export mapping and nearby definition.
          for pat in [r'\bCs\b',r'\bas Cs\b',r'Cs:',r'Cs=']:
            print('PATTERN',pat)
            for m in list(re.finditer(pat,t))[-12:]:print(re.sub(r'\s+',' ',t[max(0,m.start()-900):m.start()+1400]))
          PY
