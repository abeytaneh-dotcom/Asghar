name: Read Tehran Seed Status
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/read-tehran-seed-status'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Digikala Fresh image search
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet curl_cffi
          python3 - <<'PY'
          import json
          from curl_cffi import requests
          names=['کره بادام زمینی جیف 454','آدامس آناناس تریدنت 14 عددی','نوشیدنی انرژی زا مانستر 500','چای دلفین معطر','روغن ذرت رویال']
          h={'Accept':'application/json','Accept-Language':'fa-IR,fa;q=0.9,en;q=0.8','Origin':'https://www.digikala.com','Referer':'https://www.digikala.com/','x-web-client':'desktop','x-web-client-id':'web'}
          s=requests.Session(impersonate='chrome')
          for name in names:
            try:
              r=s.get('https://api.digikala.com/fresh/v1/search/',params={'q':name,'page':1,'sort':22,'has_selling_stock':1},headers=h,timeout=25)
              print('HTTP',r.status_code,'QUERY',name)
              d=r.json(); ps=((d.get('data') or {}).get('products') or [])[:5]
              out=[]
              for p in ps:
                imgs=((p.get('images') or {}).get('main') or {}).get('url') or []
                out.append({'id':p.get('id'),'title_fa':p.get('title_fa'),'title_en':p.get('title_en'),'image':next((u for u in imgs if isinstance(u,str) and u.startswith('https://')),None)})
              print(json.dumps(out,ensure_ascii=False))
            except Exception as e:print('ERROR',name,type(e).__name__,e)
          PY
