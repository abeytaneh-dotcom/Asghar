name: Read Tehran Seed Status
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/read-tehran-seed-status'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Identify Digikala Jet search function
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re,urllib.request,ssl
          u='https://www.digikalajet.com/assets/x-app.DgWmlWEz.js'
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/141 Safari/537.36','Referer':'https://www.digikalajet.com/'})
          with urllib.request.urlopen(q,timeout=30,context=ctx) as r:t=r.read(8_000_000).decode('utf-8','replace')
          for pat in [r'function\s+Kg\s*\(',r'\bKg\s*=\s*',r'[,;]Kg\s*=\s*',r'\bKg\(']:
            print('\nPATTERN',pat)
            ms=list(re.finditer(pat,t))
            print('COUNT',len(ms))
            for m in ms[:20]: print(re.sub(r'\s+',' ',t[max(0,m.start()-1800):m.start()+4200]))
          # Print exact endpoint strings with surrounding definitions too.
          for ep in ['/v2/search/','/search/v2/result/','/search/v2/','/products/search/','/search/']:
            print('\nENDPOINT',ep)
            for m in list(re.finditer(re.escape(ep),t))[:20]: print(re.sub(r'\s+',' ',t[max(0,m.start()-1400):m.start()+2600]))
          PY
