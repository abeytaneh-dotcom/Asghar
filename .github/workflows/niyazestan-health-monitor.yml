name: Niyazestan Health Monitor

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 https://websaza.ir/nz-health.php | tee health.json | jq -e '.ok == true and (.integrity == "ok" or .integrity == "unknown") and (.disk_free_mb == null or .disk_free_mb > 256)' >/dev/null
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 https://websaza.ir/nz | grep -F 'نیازستان' >/dev/null
          curl -fsS --retry 3 --retry-delay 5 --max-time 20 'https://websaza.ir/nz-models.php?subcategory=%D8%AE%D9%88%D8%AF%D8%B1%D9%88' | jq -e '.ok == true and (.brands|length) > 5' >/dev/null

      - name: Keep diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niyazestan-health-${{ github.run_id }}
          path: health.json
          retention-days: 3
          if-no-files-found: ignore
