name: Cleanup Tehran Obsolete Files
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/cleanup-tehran-obsolete.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Remove obsolete Tehran files
        run: |
          rm -f \
            .github/workflows/diagnose-tehran-map-live.yml \
            .github/workflows/test-tehran-map-tile.yml \
            .github/workflows/publish-camera-v6.yml \
            .github/workflows/seed-tehran-catalog-v1.yml \
            .github/workflows/seed-tehran-catalog-v2.yml \
            .github/workflows/seed-tehran-static-v1.yml \
            .github/workflows/seed-tehran-static-v2.yml \
            TehranSupermarket/location_resolve.php \
            .github/workflows/cleanup-tehran-obsolete.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove obsolete Tehran one-off workflows and resolver"
          git push origin HEAD:websaza-hosting
