name: Finalize Tehran Production
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/finalize-tehran-production.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Final production cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          s=s.replace('id="confirmLocation">تأیید این لوکیشن</button>','id="confirmLocation" disabled>تأیید این لوکیشن</button>')
          s=s.replace("let map=null,tiles=null,lastAcc=null,locating=false,programmaticMove=false;","let map=null,tiles=null,lastAcc=null,locating=false,programmaticMove=false,pickerHistory=false,hasSelection=false;")
          s=s.replace("if(d&&d.lat&&d.lng){la.value=d.lat;ln.value=d.lng;ac.value=d.acc||'';picked.hidden=false;title.textContent='لوکیشن تحویل ثبت شد';sub.textContent='برای تغییر دوباره بزنید';}","if(d&&d.lat&&d.lng){la.value=d.lat;ln.value=d.lng;ac.value=d.acc||'';hasSelection=true;confirmBtn.disabled=false;picked.hidden=false;title.textContent='لوکیشن تحویل ثبت شد';sub.textContent='برای تغییر دوباره بزنید';}")
          s=s.replace("if(!programmaticMove){lastAcc=null;ac.value='';status.textContent='نقشه را حرکت دهید تا سنجاق روی محل دقیق تحویل باشد.';}","if(!programmaticMove){lastAcc=null;ac.value='';hasSelection=true;confirmBtn.disabled=false;status.textContent='نقشه را حرکت دهید تا سنجاق روی محل دقیق تحویل باشد.';}")
          old="function openPicker(){sheet.hidden=false;document.body.classList.add('location-sheet-open');ensureMap();if(la.value&&ln.value){setView(Number(la.value),Number(ln.value),17);status.textContent='لوکیشن انتخاب‌شده نمایش داده شد.';return;}setView(home[0],home[1],15);status.textContent='نقشه را جابه‌جا کنید یا برای نزدیک شدن، دکمه موقعیت من را بزنید.';}function closePicker(){sheet.hidden=true;document.body.classList.remove('location-sheet-open');}"
          new="function openPicker(){if(sheet.hidden){history.pushState({tehranLocationPicker:true},document.title,location.href);pickerHistory=true;}sheet.hidden=false;document.body.classList.add('location-sheet-open');ensureMap();if(la.value&&ln.value){hasSelection=true;confirmBtn.disabled=false;setView(Number(la.value),Number(ln.value),17);status.textContent='لوکیشن انتخاب‌شده نمایش داده شد.';return;}hasSelection=false;confirmBtn.disabled=true;setView(home[0],home[1],15);status.textContent='نقشه را جابه‌جا کنید یا برای نزدیک شدن، دکمه موقعیت من را بزنید.';}function closePicker(fromPop=false){sheet.hidden=true;document.body.classList.remove('location-sheet-open');if(pickerHistory&&!fromPop){pickerHistory=false;history.back();}else pickerHistory=false;}"
          if old not in s: raise SystemExit('open/close picker anchor not found')
          s=s.replace(old,new)
          s=s.replace("lastAcc=acc;setView(lat,lng,acc<=100?18:acc<=500?16:14);","lastAcc=acc;hasSelection=true;confirmBtn.disabled=false;setView(lat,lng,acc<=100?18:acc<=500?16:14);")
          s=s.replace("function confirm(){ensureMap();const c=map.getCenter();","function confirm(){if(!hasSelection||confirmBtn.disabled){status.textContent='اول محل تحویل را روی نقشه مشخص کنید.';return;}ensureMap();const c=map.getCenter();")
          anchor="confirmBtn.addEventListener('click',confirm);})();</script>"
          repl="confirmBtn.addEventListener('click',confirm);window.addEventListener('popstate',()=>{if(!sheet.hidden)closePicker(true);});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closePicker();});})();</script>"
          if anchor not in s: raise SystemExit('event anchor not found')
          s=s.replace(anchor,repl)
          p.write_text(s)

          p=Path('TehranSupermarket/track.php')
          s=p.read_text()
          marker='</body></html>'
          cleanup="<script>try{sessionStorage.removeItem('tehran_delivery_location_v1');}catch(e){}</script></body></html>"
          if cleanup not in s:
              if marker not in s: raise SystemExit('track body anchor not found')
              s=s.replace(marker,cleanup)
          p.write_text(s)

          p=Path('TehranSupermarket/map_tile.php')
          s=p.read_text()
          needle="$ttl = 2592000; // 30 days\n"
          extra="""$ttl = 2592000; // 30 days\n\n// Prevent the tile cache from growing forever. Cleanup is intentionally rare\n// so normal map requests stay fast. Tiles unused for 90 days are removed.\ntry {\n    if (random_int(1, 500) === 1 && is_dir($cacheRoot)) {\n        $cutoff = time() - 7776000;\n        $it = new RecursiveIteratorIterator(\n            new RecursiveDirectoryIterator($cacheRoot, FilesystemIterator::SKIP_DOTS),\n            RecursiveIteratorIterator::CHILD_FIRST\n        );\n        foreach ($it as $node) {\n            if ($node->isFile() && $node->getExtension() === 'png' && $node->getMTime() < $cutoff) @unlink($node->getPathname());\n            elseif ($node->isDir()) @rmdir($node->getPathname());\n        }\n    }\n} catch (Throwable $e) { /* cache cleanup must never break the map */ }\n"""
          if needle not in s: raise SystemExit('tile ttl anchor not found')
          s=s.replace(needle,extra)
          p.write_text(s)
          PY

          php -l TehranSupermarket/shop.php
          php -l TehranSupermarket/track.php
          php -l TehranSupermarket/map_tile.php

          # Remove obsolete one-off Tehran patch workflows. Keep deploy-tehran,
          # test-tehran-map-tile and tehran-ops-pack as the maintained workflows.
          rm -f \
            .github/workflows/cleanup-tehran-location-final.yml \
            .github/workflows/patch-order-barcodes.yml \
            .github/workflows/patch-pyramid-nav.yml \
            .github/workflows/patch-tehran-account-link.yml \
            .github/workflows/patch-tehran-camera-ui.yml \
            .github/workflows/patch-tehran-coupons.yml \
            .github/workflows/patch-tehran-current-location-blue.yml \
            .github/workflows/patch-tehran-final-wiring.yml \
            .github/workflows/patch-tehran-geolocation-simple.yml \
            .github/workflows/patch-tehran-gps-accuracy.yml \
            .github/workflows/patch-tehran-gps-move-pin.yml \
            .github/workflows/patch-tehran-gps-reject-coarse.yml \
            .github/workflows/patch-tehran-location-fullscreen.yml \
            .github/workflows/patch-tehran-location.yml \
            .github/workflows/patch-tehran-map-link-picker.yml \
            .github/workflows/patch-tehran-map-picker.yml \
            .github/workflows/patch-tehran-map-proxy.yml \
            .github/workflows/patch-tehran-one-tap-location-v2.yml \
            .github/workflows/patch-tehran-one-tap-location.yml \
            .github/workflows/patch-tehran-ops2.yml \
            .github/workflows/patch-tehran-security-pwa.yml \
            .github/workflows/finalize-tehran-production.yml
      - name: Commit final cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Tehran storefront and remove obsolete patch workflows"
          git push origin HEAD:websaza-hosting
