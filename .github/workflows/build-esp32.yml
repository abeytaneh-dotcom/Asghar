name: Build ESP32 Smart OBD

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build-esp32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Configure ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build firmware/KhanehRemap_SmartOBD
          ls -lh build
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-SmartOBD-ESP32
          path: build/*.bin
          retention-days: 1

# trigger
