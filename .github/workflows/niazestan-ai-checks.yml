name: Niazestan AI and notifications checks
on:
  pull_request:
    branches: [websaza-hosting]
    paths: ['WebSaza/nz-*', 'tests/niazestan-ai-*', '.github/workflows/niazestan-ai-checks.yml']
  push:
    branches: ['feature/niazestan-ai-concierge']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and JavaScript syntax
        run: |
          find WebSaza -maxdepth 1 -name 'nz-*.php' -print0 | xargs -0 -n1 php -l
          for file in WebSaza/nz-*.js; do node --check "$file"; done
      - name: Verify AI domain, contact privacy and VAPID
        run: php tests/niazestan-ai-test.php
      - name: Verify native Persian assistant and supervised learning
        run: php tests/niazestan-native-test.php
      - name: Verify personal recommendations and consent
        run: php tests/niazestan-ai-personal-test.php
      - name: Verify progressive inventory-driven search
        run: php tests/niazestan-ai-browse-test.php
      - name: Verify guided assistant interface and resume
        run: |
          npm install --prefix "$RUNNER_TEMP/nz-ai-dom" --no-audit --no-fund --ignore-scripts happy-dom@21.0.4
          HAPPY_DOM_MODULE="$RUNNER_TEMP/nz-ai-dom/node_modules/happy-dom/lib/index.js" node tests/niazestan-ai-guidance-dom.mjs
          HAPPY_DOM_MODULE="$RUNNER_TEMP/nz-ai-dom/node_modules/happy-dom/lib/index.js" node tests/niazestan-ai-browse-dom.mjs
      - name: Verify media compression and full video duration
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          node tests/niazestan-ai-media-test.mjs
      - name: Verify HTTP authorization and subscription ownership
        env:
          NZ_AI_API_KEY: ''
          NZ_AI_ENGINE: native
        run: node tests/niazestan-ai-http.mjs
