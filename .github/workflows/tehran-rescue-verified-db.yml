name: Rescue and encrypt verified source database snapshots
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/tehran-rescue-verified-db.yml']
permissions:
  contents: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CP_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Download and verify existing DB backups without source disk writes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/verified-snapshots"
          python3 - <<'PY'
          import os,urllib.request,urllib.parse,json,gzip,hashlib,subprocess
          token=os.environ['CP_TOKEN']; d=os.path.join(os.environ['RUNNER_TEMP'],'verified-snapshots')
          def get_file(directory,name,encoding='ISO-8859-1'):
            qs=urllib.parse.urlencode({'dir':directory,'file':name,'from_charset':encoding,'to_charset':'UTF-8'})
            request=urllib.request.Request('https://mch4444.dnsuserver.com:2083/execute/Fileman/get_file_content?'+qs,headers={'Authorization':'cpanel vt6qdx8:'+token})
            import ssl
            with urllib.request.urlopen(request,context=ssl._create_unverified_context(),timeout=90) as r:
              payload=json.loads(r.read())
            if payload.get('status')!=1: raise RuntimeError('cPanel file read failed: '+name)
            data=payload.get('data') or payload.get('result',{}).get('data') or {}
            content=data.get('content')
            if not isinstance(content,str): raise RuntimeError('Backup empty or unreadable: '+name)
            return content.encode('latin-1')
          manifest=[]
          for name in ('db-2026-10-26_135731.sql.gz','db-2026-10-30_094112.sql.gz'):
            blob=get_file('tehran_backups',name)
            sql=gzip.decompress(blob)
            if len(sql)<100000 or b'CREATE TABLE' not in sql: raise RuntimeError('Invalid SQL backup')
            path=os.path.join(d,name);open(path,'wb').write(blob)
            manifest.append({'file':name,'compressed_bytes':len(blob),'sql_bytes':len(sql),'sha256':hashlib.sha256(blob).hexdigest(),'tables':sql.count(b'CREATE TABLE')})
          config=get_file('public_html/tehran','config.php')
          if b'<?php' not in config: raise RuntimeError('Config not PHP')
          open(os.path.join(d,'source-config.php'),'wb').write(config)
          manifest.append({'file':'source-config.php','bytes':len(config),'sha256':hashlib.sha256(config).hexdigest()})
          open(os.path.join(d,'manifest.json'),'w').write(json.dumps(manifest,indent=2))
          print('Verified and rescued historical SQL files: '+str(len(manifest)-1))
          for x in manifest:
            print({k:v for k,v in x.items() if k not in ('sha256',)})
          PY
      - name: Encrypt backup with dedicated destination public key
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf "$RUNNER_TEMP/verified-source-backups.tar.gz" -C "$RUNNER_TEMP/verified-snapshots" .
          openssl rand -hex 32 > "$RUNNER_TEMP/passphrase"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:"$RUNNER_TEMP/passphrase" \
            -in "$RUNNER_TEMP/verified-source-backups.tar.gz" -out "$RUNNER_TEMP/verified-source-backups.enc"
          openssl pkeyutl -encrypt -pubin -inkey ops/tehran-migration-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/passphrase" -out "$RUNNER_TEMP/verified-source-backups.key.enc"
          rm -rf "$RUNNER_TEMP/verified-snapshots" "$RUNNER_TEMP/verified-source-backups.tar.gz" "$RUNNER_TEMP/passphrase"
          test -s "$RUNNER_TEMP/verified-source-backups.enc"
          test -s "$RUNNER_TEMP/verified-source-backups.key.enc"
      - name: Store encrypted recovery backup only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-tehran-verified-db-rescue
          path: |
            ${{ runner.temp }}/verified-source-backups.enc
            ${{ runner.temp }}/verified-source-backups.key.enc
          retention-days: 30
