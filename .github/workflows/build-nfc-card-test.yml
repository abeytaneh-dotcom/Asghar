name: Khaneh Remap NFC APK
on:
  push:
    branches: [nfc-card-test]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: nfc-business-card
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-NFC-Test-APK
          path: nfc-business-card/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
