name: Inspect Niazestan registry delegation

on:
  push:
    branches: [niazestan-cloud]
    paths:
      - '.github/workflows/inspect-niazestan-registry.yml'
  workflow_dispatch:

concurrency:
  group: inspect-niazestan-registry
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query public DNS-over-HTTPS
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Google NS ==='
          curl -fsS --max-time 15 'https://dns.google/resolve?name=niazestan.ir&type=NS' | jq '.' || true
          echo '=== Cloudflare NS ==='
          curl -fsS --max-time 15 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=niazestan.ir&type=NS' | jq '.' || true
          echo '=== Google A ==='
          curl -fsS --max-time 15 'https://dns.google/resolve?name=niazestan.ir&type=A' | jq '.' || true
          echo '=== Target NS addresses ==='
          curl -fsS --max-time 15 'https://dns.google/resolve?name=ns44.dnsuserver.com&type=A' | jq '.' || true
          curl -fsS --max-time 15 'https://dns.google/resolve?name=ns45.dnsuserver.com&type=A' | jq '.' || true
