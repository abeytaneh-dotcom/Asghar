name: Patch Tehran Current Location Blue
on:
  push:
    paths:
      - '.github/workflows/patch-tehran-current-location-blue.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Separate current GPS from delivery pin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          old_tiles="L.tileLayer('map_tile.php?z={z}&x={x}&y={y}',{maxZoom:19,minZoom:3,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);"
          new_tiles="const baseTiles=L.tileLayer('map_tile.php?z={z}&x={x}&y={y}',{maxZoom:19,minZoom:3,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);function reloadMapTiles(){setTimeout(()=>{map.invalidateSize(true);baseTiles.redraw();},120);}"
          if old_tiles not in s:
              raise SystemExit('tile layer block not found')
          s=s.replace(old_tiles,new_tiles,1)
          start=s.find("let accuracyCircle=null;function stopAccuracyCircle")
          end=s.find("setTimeout(()=>map.invalidateSize(),100);",start)
          if start<0 or end<0:
              raise SystemExit('simple geolocation block not found')
          end += len("setTimeout(()=>map.invalidateSize(),100);")
          new="""let accuracyCircle=null,currentMarker=null;function clearCurrentLocationOverlay(){if(accuracyCircle){map.removeLayer(accuracyCircle);accuracyCircle=null;}if(currentMarker){map.removeLayer(currentMarker);currentMarker=null;}}function drawCurrentLocation(lat,lng,acc){clearCurrentLocationOverlay();accuracyCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:2,fillColor:'#64b5f6',fillOpacity:.15}).addTo(map);currentMarker=L.circleMarker([lat,lng],{radius:8,color:'#ffffff',weight:3,fillColor:'#1976d2',fillOpacity:1}).addTo(map);reloadMapTiles();}function showCurrentPosition(pos){const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.max(1,Math.round(Number(pos.coords.accuracy||99999)));drawCurrentLocation(lat,lng,acc);geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';if(acc<=120){choose(lat,lng,acc,true);st.className='locstatus ok';st.textContent='✅ موقعیت فعلی گوشی پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر. سنجاق قرمز روی همین نقطه قرار گرفت؛ اگر درست است «ثبت این نقطه» را بزنید.';}else{try{map.fitBounds(accuracyCircle.getBounds(),{padding:[18,18],maxZoom:15});}catch(e){map.setView([lat,lng],14);}reloadMapTiles();st.className='locstatus warn';st.textContent='⚠️ مرورگر فقط موقعیت تقریبی با دقت حدود '+acc.toLocaleString('fa-IR')+' متر داده است. نقطه آبی محدوده تقریبی گوشی است؛ سنجاق قرمزِ محل تحویل دست‌نخورده ماند. برای آدرس دقیق، سنجاق قرمز را دستی روی محل درست بگذارید یا «موقعیت دقیق» Chrome را فعال کنید.';}}function showGeoError(err){geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';st.className='locstatus warn';if(err&&err.code===1)st.textContent='اجازه Location برای Chrome/این سایت داده نشده است. مجوز را فعال کنید یا سنجاق قرمز را دستی روی محل تحویل بگذارید.';else if(err&&err.code===2)st.textContent='گوشی نتوانست موقعیت فعلی را پیدا کند. Location/GPS را روشن کنید یا سنجاق قرمز را دستی انتخاب کنید.';else if(err&&err.code===3)st.textContent='دریافت موقعیت به پایان زمان مجاز رسید. دوباره امتحان کنید یا سنجاق قرمز را دستی انتخاب کنید.';else st.textContent='موقعیت فعلی دریافت نشد؛ سنجاق قرمز را دستی روی محل تحویل قرار دهید.';}geoBtn.addEventListener('click',()=>{if(!navigator.geolocation){showGeoError({code:0});return;}geoBtn.disabled=true;geoBtn.textContent='در حال پیدا کردن موقعیت…';st.className='locstatus';st.textContent='در حال دریافت موقعیت گوشی…';navigator.geolocation.getCurrentPosition(showCurrentPosition,showGeoError,{enableHighAccuracy:true,timeout:15000,maximumAge:0});});setTimeout(()=>{map.invalidateSize(true);baseTiles.redraw();},100);"""
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          git commit -m 'Separate approximate GPS from delivery pin on Tehran map' || exit 0
          git push origin HEAD:websaza-hosting
