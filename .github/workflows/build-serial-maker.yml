name: Build Serial Maker EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'SerialMaker/**'
      - '.github/workflows/build-serial-maker.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial qrcode pillow esptool

      - name: Build EXE
        shell: pwsh
        run: |
          cd SerialMaker
          pyinstaller --noconfirm --onefile --windowed --name KhanehRemap-SerialMaker serial_maker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-SerialMaker
          path: SerialMaker/dist/KhanehRemap-SerialMaker.exe
