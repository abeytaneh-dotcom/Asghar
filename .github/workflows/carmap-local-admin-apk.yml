name: Build CARMAP2 Local Admin APK
on:
  push:
    branches: ["build/carmap-local-admin-20261108"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Recreate CarMap source
        shell: bash
        env:
          ARCHIVE_B64: ''
        run: |
          printf '%s' "$ARCHIVE_B64" | base64 --decode > source.tar.xz
          echo "dc79f2b0d741d7b97555ba3df25cae412ad5160206e3df87a17530382253ab4d  source.tar.xz" | sha256sum --check
          tar -xJf source.tar.xz
      - name: Compile Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CARMAP2-LocalAdmin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
