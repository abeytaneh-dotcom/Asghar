name: Patch Tehran Fullscreen Location Picker
on:
  push:
    paths:
      - '.github/workflows/patch-tehran-location-fullscreen.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Replace location UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()

          # Replace the entire checkout location block with one compact button + fullscreen picker.
          pattern=r'<div class="locbox wide">.*?</div><label>محدوده ارسال'
          replacement='''<div class="delivery-location wide"><input type="hidden" name="delivery_lat" id="delivery_lat"><input type="hidden" name="delivery_lng" id="delivery_lng"><input type="hidden" name="delivery_accuracy" id="delivery_accuracy"><button type="button" class="location-main-btn" id="openLocationPicker"><span class="location-main-icon">📍</span><span class="location-main-text"><b id="locationMainTitle">انتخاب لوکیشن تحویل</b><small id="locationMainSub">با یک لمس روی نقشه مشخص کنید</small></span><span class="location-main-arrow">‹</span></button><div class="location-picked" id="locationPicked" hidden><span>✅ لوکیشن تحویل انتخاب شد</span><button type="button" id="changeLocation">تغییر</button></div></div><div class="location-sheet" id="locationSheet" hidden><div class="location-sheet-card"><div class="location-sheet-head"><button type="button" class="location-close" id="closeLocationPicker">×</button><div><b>محل تحویل را انتخاب کنید</b><small>نقشه را حرکت دهید تا سنجاق دقیقاً روی محل تحویل باشد.</small></div></div><div class="location-map-wrap"><div id="deliveryMap" class="delivery-map-full"></div><div class="location-center-pin" aria-hidden="true">📍</div><button type="button" class="location-me" id="locationMe" aria-label="موقعیت فعلی من">◎</button></div><div class="location-sheet-status" id="locationPickerStatus">در حال آماده‌سازی نقشه…</div><button type="button" class="btn location-confirm" id="confirmLocation">تأیید این لوکیشن</button></div></div><label>محدوده ارسال'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'location html block replace count={n}')
          s=s2

          # Add new fullscreen-picker styles before </style>.
          css='''.delivery-location{display:block}.location-main-btn{width:100%;border:1px solid #dce9df;background:#f7faf7;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:right;font:inherit;color:#173b28;cursor:pointer}.location-main-icon{font-size:25px}.location-main-text{display:flex;flex-direction:column;gap:3px;flex:1}.location-main-text b{font-size:15px}.location-main-text small{font-size:11px;color:#718079}.location-main-arrow{font-size:28px;color:#11823b;line-height:1}.location-picked{margin-top:8px;padding:10px 12px;border-radius:12px;background:#e8f7eb;color:#17602e;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px}.location-picked button{border:0;background:#fff;color:#11823b;border-radius:9px;padding:7px 10px;font:inherit;font-weight:700}.location-sheet[hidden]{display:none!important}.location-sheet{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column}.location-sheet-card{height:100%;display:flex;flex-direction:column;background:#fff}.location-sheet-head{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid #e6ece8;background:#fff;z-index:3}.location-sheet-head>div{display:flex;flex-direction:column;gap:3px}.location-sheet-head b{font-size:16px}.location-sheet-head small{font-size:11px;color:#718079}.location-close{width:40px;height:40px;border:0;border-radius:12px;background:#f1f5f2;color:#294b37;font-size:26px;line-height:1}.location-map-wrap{position:relative;flex:1;min-height:360px;background:#eef3ef;overflow:hidden}.delivery-map-full{position:absolute;inset:0}.location-center-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:42px;line-height:1;z-index:600;pointer-events:none;filter:drop-shadow(0 3px 4px #0004)}.location-me{position:absolute;right:14px;bottom:16px;width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#11823b;font-size:28px;font-weight:800;box-shadow:0 4px 16px #0003;z-index:650}.location-sheet-status{padding:10px 14px;background:#f7faf7;color:#5d6d63;font-size:12px;line-height:1.7;text-align:center;border-top:1px solid #e6ece8}.location-confirm{margin:10px 14px calc(10px + env(safe-area-inset-bottom));width:calc(100% - 28px);padding:14px;font-size:16px}.location-sheet-open{overflow:hidden!important}@media(min-width:700px){.location-sheet{background:#0007;align-items:center;justify-content:center;padding:24px}.location-sheet-card{width:min(680px,100%);height:min(760px,92vh);border-radius:20px;overflow:hidden}.location-map-wrap{min-height:450px}}'''
          s=s.replace('</style>',css+'</style>',1)

          # Replace old Leaflet location JS wholesale, leaving service-worker script untouched.
          start=s.find('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>')
          if start<0:
              raise SystemExit('leaflet script start not found')
          sw=s.find("<script>(()=>{if('serviceWorker' in navigator)",start)
          if sw<0:
              raise SystemExit('service worker marker not found')
          new_js='''<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>(()=>{const openBtn=document.getElementById('openLocationPicker'),changeBtn=document.getElementById('changeLocation'),sheet=document.getElementById('locationSheet'),closeBtn=document.getElementById('closeLocationPicker'),meBtn=document.getElementById('locationMe'),confirmBtn=document.getElementById('confirmLocation'),status=document.getElementById('locationPickerStatus'),picked=document.getElementById('locationPicked'),title=document.getElementById('locationMainTitle'),sub=document.getElementById('locationMainSub'),la=document.getElementById('delivery_lat'),ln=document.getElementById('delivery_lng'),ac=document.getElementById('delivery_accuracy');if(!openBtn||!sheet||typeof L==='undefined')return;const home=[32.48814,51.773119];let map=null,tiles=null,lastAcc=null,locating=false;function ensureMap(){if(map)return;map=L.map('deliveryMap',{zoomControl:true,attributionControl:true}).setView(home,15);tiles=L.tileLayer('map_tile.php?z={z}&x={x}&y={y}',{maxZoom:19,minZoom:3,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);tiles.on('tileerror',()=>{status.textContent='نقشه در حال بارگذاری مجدد است…';setTimeout(()=>tiles.redraw(),700);});map.on('movestart',()=>{status.textContent='نقشه را حرکت دهید تا سنجاق روی محل دقیق تحویل قرار بگیرد.';});map.on('moveend',()=>{if(!locating)status.textContent='اگر سنجاق روی محل درست است، «تأیید این لوکیشن» را بزنید.';});}function refreshMap(){setTimeout(()=>{if(map){map.invalidateSize(true);if(tiles)tiles.redraw();}},120);}function openPicker(){sheet.hidden=false;document.body.classList.add('location-sheet-open');ensureMap();if(la.value&&ln.value){map.setView([Number(la.value),Number(ln.value)],17);status.textContent='لوکیشن قبلی نمایش داده شد؛ در صورت نیاز نقشه را جابه‌جا کنید.';refreshMap();return;}refreshMap();findMe(true);}function closePicker(){sheet.hidden=true;document.body.classList.remove('location-sheet-open');}function findMe(auto=false){if(!navigator.geolocation){status.textContent='موقعیت خودکار در این مرورگر در دسترس نیست؛ نقشه را دستی جابه‌جا کنید.';return;}if(locating)return;locating=true;meBtn.disabled=true;status.textContent='در حال پیدا کردن موقعیت شما…';navigator.geolocation.getCurrentPosition(pos=>{locating=false;meBtn.disabled=false;const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.max(1,Math.round(Number(pos.coords.accuracy||0)));lastAcc=acc;map.setView([lat,lng],acc<=100?18:acc<=500?16:14);refreshMap();status.textContent=acc<=120?'موقعیت شما پیدا شد؛ در صورت نیاز نقشه را کمی جابه‌جا کنید.':'موقعیت تقریبی پیدا شد؛ نقشه را با دست روی محل دقیق تحویل تنظیم کنید.';},err=>{locating=false;meBtn.disabled=false;lastAcc=null;status.textContent='موقعیت خودکار پیدا نشد؛ فقط نقشه را با دست روی محل تحویل ببرید.';},{enableHighAccuracy:true,timeout:10000,maximumAge:15000});}function confirm(){ensureMap();const c=map.getCenter();la.value=Number(c.lat).toFixed(7);ln.value=Number(c.lng).toFixed(7);ac.value=lastAcc&&lastAcc<=120?String(lastAcc):'';picked.hidden=false;title.textContent='لوکیشن تحویل ثبت شد';sub.textContent='برای تغییر دوباره بزنید';closePicker();}openBtn.addEventListener('click',openPicker);if(changeBtn)changeBtn.addEventListener('click',openPicker);closeBtn.addEventListener('click',closePicker);meBtn.addEventListener('click',()=>findMe(false));confirmBtn.addEventListener('click',confirm);})();</script>'''
          s=s[:start]+new_js+s[sw:]

          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TehranSupermarket/shop.php
          git commit -m "Simplify delivery location to fullscreen center-pin map" || exit 0
          git push origin HEAD:websaza-hosting
