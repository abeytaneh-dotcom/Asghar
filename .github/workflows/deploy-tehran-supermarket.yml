name: Deploy Tehran Supermarket

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'TehranSupermarket/**'
      - '.github/workflows/deploy-tehran-supermarket.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tehran-supermarket
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: websaza-hosting

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CPANEL_TOKEN:-}" || { echo 'WEBSAZA_CPANEL_TOKEN is missing'; exit 1; }
          find TehranSupermarket -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check TehranSupermarket/assets/admin.js
          test -s TehranSupermarket/assets/style.css

      - name: Create target directories
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          mkdir_api2(){
            local parent="$1" name="$2" out="$RUNNER_TEMP/mkdir-${name//\//_}.json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 \
              -H "$AUTH" --get \
              --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
              --data-urlencode 'cpanel_jsonapi_apiversion=2' \
              --data-urlencode 'cpanel_jsonapi_module=Fileman' \
              --data-urlencode 'cpanel_jsonapi_func=mkdir' \
              --data-urlencode "path=${parent}" \
              --data-urlencode "name=${name}" \
              --data-urlencode 'permissions=0755' \
              "${BASE}/json-api/cpanel" -o "$out" || true
          }
          # Target was preflighted as absent; creation is intentionally scoped to /tehran only.
          mkdir_api2 public_html tehran
          mkdir_api2 public_html/tehran assets
          mkdir_api2 public_html/tehran storage
          mkdir_api2 public_html/tehran uploads
          mkdir_api2 public_html/tehran/uploads products
          # Verify the directory exists before any write.
          OUT="$RUNNER_TEMP/list-target.json"
          curl -sS --fail-with-body -H "$AUTH" --get \
            --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'show_hidden=1' \
            "${BASE}/execute/Fileman/list_files" -o "$OUT"
          test "$(jq -r '.result.status // .status // 0' "$OUT")" = '1'

      - name: Upload application files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          save_file(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save-$(echo "$dir-$file" | tr '/.' '__').json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 \
              -H "$AUTH" -H 'Accept: application/json' --request POST \
              --data-urlencode "dir=${dir}" \
              --data-urlencode "file=${file}" \
              --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          while IFS= read -r -d '' src; do
            rel="${src#TehranSupermarket/}"
            sub="$(dirname "$rel")"
            file="$(basename "$rel")"
            dir="$TARGET_DIR"
            [ "$sub" = '.' ] || dir="$TARGET_DIR/$sub"
            echo "Deploying $rel"
            save_file "$src" "$dir" "$file"
          done < <(find TehranSupermarket -type f -print0)
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release.txt"
          save_file "$RUNNER_TEMP/release.txt" "$TARGET_DIR/storage" release.txt

      - name: Create MySQL database and initialize app when needed
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          HOME_HTML="$RUNNER_TEMP/home-before.html"
          CODE=$(curl -sS -L --max-time 30 -o "$HOME_HTML" -w '%{http_code}' "${PUBLIC_URL}/")
          test "$CODE" = '200'
          if ! grep -Fq 'نصب سوپرمارکت طهران' "$HOME_HTML"; then
            echo 'Application already initialized; database creation skipped.'
            exit 0
          fi

          DB_NAME="${CPANEL_USER}_tehran"
          DB_USER="${CPANEL_USER}_thrusr"
          DB_PASS="$(openssl rand -hex 20)"
          ADMIN_USER='admin'
          ADMIN_PASS="Ts!$(openssl rand -hex 12)"
          echo "::add-mask::$DB_PASS"
          echo "::add-mask::$ADMIN_PASS"

          api_get(){
            local endpoint="$1" out="$2"; shift 2
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 \
              -H "$AUTH" --get "$@" "${BASE}/execute/${endpoint}" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          api_get Mysql/create_database "$RUNNER_TEMP/db.json" --data-urlencode "name=$DB_NAME"
          api_get Mysql/create_user "$RUNNER_TEMP/user.json" --data-urlencode "name=$DB_USER" --data-urlencode "password=$DB_PASS"
          api_get Mysql/set_privileges_on_database "$RUNNER_TEMP/priv.json" \
            --data-urlencode "user=$DB_USER" --data-urlencode "database=$DB_NAME" --data-urlencode 'privileges=ALL PRIVILEGES'

          INSTALL_HTML="$RUNNER_TEMP/install-result.html"
          ICODE=$(curl -sS --fail-with-body --max-time 60 -o "$INSTALL_HTML" -w '%{http_code}' \
            --data-urlencode 'db_host=localhost' \
            --data-urlencode "db_name=$DB_NAME" \
            --data-urlencode "db_user=$DB_USER" \
            --data-urlencode "db_pass=$DB_PASS" \
            --data-urlencode "admin_user=$ADMIN_USER" \
            --data-urlencode "admin_pass=$ADMIN_PASS" \
            --data-urlencode 'delivery_fee=0' \
            "${PUBLIC_URL}/install.php")
          test "$ICODE" = '200'
          grep -Fq 'پیکربندی اولیه انجام شده' "$INSTALL_HTML"

          # Disable the web installer after successful initialization.
          printf '%s\n' "<?php http_response_code(403); exit('Installer disabled');" > "$RUNNER_TEMP/install-disabled.php"
          RESPONSE="$RUNNER_TEMP/disable-installer.json"
          curl -sS --fail-with-body -H "$AUTH" --request POST \
            --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'file=install.php' \
            --data-urlencode "content@$RUNNER_TEMP/install-disabled.php" \
            "${BASE}/execute/Fileman/save_file_content" -o "$RESPONSE"
          test "$(jq -r '.result.status // .status // 0' "$RESPONSE")" = '1'

          cat > "$RUNNER_TEMP/admin-access.txt" <<EOF
          Tehran Supermarket Admin
          URL: ${PUBLIC_URL}/admin.php
          Username: ${ADMIN_USER}
          Password: ${ADMIN_PASS}
          EOF

      - name: Verify live supermarket
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          HOME="$RUNNER_TEMP/live-home.html"
          ADMIN="$RUNNER_TEMP/live-admin.html"
          HCODE=$(curl -sS -L --max-time 30 -o "$HOME" -w '%{http_code}' "${PUBLIC_URL}/")
          ACODE=$(curl -sS -L --max-time 30 -o "$ADMIN" -w '%{http_code}' "${PUBLIC_URL}/admin.php")
          test "$HCODE" = '200'
          test "$ACODE" = '200'
          grep -Fq 'سوپرمارکت طهران' "$HOME"
          grep -Fq 'پنل مدیریت سوپرمارکت طهران' "$ADMIN"
          ICODE=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/install.php")
          test "$ICODE" = '403'
          echo "TEHRAN_SUPERMARKET_DEPLOYED home=$HCODE admin=$ACODE installer=$ICODE"

      - name: Upload admin access credential
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tehran-supermarket-admin-${{ github.run_number }}
          path: ${{ runner.temp }}/admin-access.txt
          if-no-files-found: ignore
          retention-days: 1
