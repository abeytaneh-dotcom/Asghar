name: Niyazestan Lifecycle

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run Niyazestan lifecycle maintenance
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --retry 3 --retry-delay 5 --max-time 30 https://websaza.ir/nz-lifecycle-cron.php)
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
