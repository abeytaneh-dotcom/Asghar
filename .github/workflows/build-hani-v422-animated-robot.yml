name: Build Hani v422 Animated Robot
on:
  push:
    paths:
      - '.github/workflows/build-hani-v422-animated-robot.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create helper sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src/ir/htaelec/haniassistant out

          cat > src/ir/htaelec/haniassistant/OverlayPermission.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          public final class OverlayPermission {
              private OverlayPermission(){}
              public static boolean has(Activity a){
                  return a != null && (Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(a));
              }
              public static void ensure(Activity a){
                  if(a==null || Build.VERSION.SDK_INT<23 || Settings.canDrawOverlays(a)) return;
                  try{
                      Intent i=new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:"+a.getPackageName()));
                      a.startActivity(i);
                  }catch(Throwable ignored){}
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/HaniVoiceFeedback.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.content.Context;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.os.Handler;
          import android.os.Looper;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Method;

          public final class HaniVoiceFeedback {
              private static MediaPlayer active;
              private static AudioManager am;
              private HaniVoiceFeedback(){}

              public static boolean play(Context c,String text){
                  if(c==null||text==null) return false;
                  String n=text.replace('ي','ی').replace('ك','ک').replace("\u200c"," ").trim();
                  String clip=null;
                  if(n.contains("در خدمتم")||n.contains("بفرمایید")||n.contains("جانم")||n.contains("منتظر دستور")) clip="ready.wav";
                  else if(n.contains("چراغ")&&n.contains("روشن")) clip="flash_on.wav";
                  else if(n.contains("چراغ")&&n.contains("خاموش")) clip="flash_off.wav";
                  else if(n.contains("تایمر")||n.contains("زمان سنج")) clip="timer.wav";
                  else if(n.contains("زنگ زدم")||n.contains("تماس گرفتم")||n.contains("دارم زنگ")) clip="call.wav";
                  else if((n.contains("پیام")||n.contains("واتساپ"))&&(n.contains("ارسال")||n.contains("فرست"))) clip="message.wav";
                  else if(n.contains("باز شد")||n.contains("باز کردم")||n.contains("اجرا شد")) clip="opened.wav";
                  else if(n.contains("نفهم")||n.contains("متوجه نشدم")) clip="retry.wav";
                  else if(n.contains("انجام شد")||n.equals("باشه")||n.equals("حتما")||n.equals("حتماً")) clip="done.wav";
                  if(clip==null) return false;
                  return playClip(c.getApplicationContext(),clip);
              }

              private static boolean playClip(final Context c,String clip){
                  try{
                      File dir=new File(c.getCacheDir(),"hani_voice");
                      if(!dir.exists()) dir.mkdirs();
                      File out=new File(dir,clip);
                      if(!out.exists()||out.length()<100){
                          InputStream in=c.getAssets().open("hani_voice/"+clip);
                          FileOutputStream fos=new FileOutputStream(out);
                          byte[] b=new byte[8192]; int n;
                          while((n=in.read(b))>0) fos.write(b,0,n);
                          fos.close(); in.close();
                      }
                      try{ if(active!=null){active.stop();active.release();} }catch(Throwable ignored){}
                      am=(AudioManager)c.getSystemService(Context.AUDIO_SERVICE);
                      try{ if(am!=null) am.requestAudioFocus(null,AudioManager.STREAM_MUSIC,AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK); }catch(Throwable ignored){}
                      MediaPlayer mp=new MediaPlayer();
                      mp.setAudioStreamType(AudioManager.STREAM_MUSIC);
                      mp.setDataSource(out.getAbsolutePath());
                      mp.setVolume(1f,1f);
                      mp.setOnCompletionListener(new MediaPlayer.OnCompletionListener(){
                          @Override public void onCompletion(MediaPlayer m){
                              try{m.release();}catch(Throwable ignored){}
                              active=null; releaseFocus(); after(c);
                          }
                      });
                      mp.setOnErrorListener(new MediaPlayer.OnErrorListener(){
                          @Override public boolean onError(MediaPlayer m,int w,int e){
                              try{m.release();}catch(Throwable ignored){}
                              active=null; releaseFocus(); after(c); return true;
                          }
                      });
                      mp.prepare(); active=mp; mp.start(); return true;
                  }catch(Throwable e){ releaseFocus(); return false; }
              }

              private static void releaseFocus(){
                  try{if(am!=null)am.abandonAudioFocus(null);}catch(Throwable ignored){}
                  am=null;
              }

              private static void after(final Context c){
                  new Handler(Looper.getMainLooper()).post(new Runnable(){
                      @Override public void run(){
                          try{
                              Class<?> cls=Class.forName("ir.htaelec.haniassistant.HaniVoiceService");
                              Method m=cls.getDeclaredMethod("afterSpeech");
                              m.setAccessible(true);
                              m.invoke(c);
                          }catch(Throwable ignored){}
                      }
                  });
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/RobotOverlay.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.accessibilityservice.AccessibilityService;
          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import java.lang.reflect.Field;

          public final class RobotOverlay {
              public static final int IDLE=0, LISTENING=1, SPEAKING=2, WORKING=3;

              private static WindowManager wm;
              private static FrameLayout root;
              private static AnimatedRobot robot;
              private static TextView label;
              private static WindowManager.LayoutParams lp;
              private static Context owner;
              private static int windowType;
              private static float downX,downY;
              private static int startX,startY;

              private RobotOverlay(){}

              public static void show(final Context c,final int state,final String text){
                  if(c==null)return;
                  new Handler(Looper.getMainLooper()).post(new Runnable(){
                      @Override public void run(){
                          try{
                              Context next=resolveOwner(c);
                              if(next==null)return;
                              int type=resolveType(c,next);
                              if(root!=null&&(owner!=next||windowType!=type)) removeNow();
                              owner=next; windowType=type;
                              if(wm==null)wm=(WindowManager)owner.getSystemService(Context.WINDOW_SERVICE);
                              if(wm==null)return;
                              if(root==null)create(owner,type);
                              update(state,text);
                          }catch(Throwable ignored){}
                      }
                  });
              }

              public static void hide(){
                  new Handler(Looper.getMainLooper()).post(new Runnable(){
                      @Override public void run(){removeNow();}
                  });
              }

              private static Context resolveOwner(Context c){
                  try{
                      if(Build.VERSION.SDK_INT>=23&&Settings.canDrawOverlays(c)){
                          Context app=c.getApplicationContext();
                          return app!=null?app:c;
                      }
                  }catch(Throwable ignored){}
                  return accessibilityService();
              }

              private static int resolveType(Context original,Context resolved){
                  if(resolved instanceof AccessibilityService)return 2032;
                  return Build.VERSION.SDK_INT>=26?2038:2003;
              }

              private static AccessibilityService accessibilityService(){
                  try{
                      Class<?> k=Class.forName("ir.htaelec.haniassistant.HaniAccessibilityService");
                      Field f=k.getDeclaredField("instance");
                      f.setAccessible(true);
                      Object o=f.get(null);
                      return o instanceof AccessibilityService?(AccessibilityService)o:null;
                  }catch(Throwable e){return null;}
              }

              private static int dp(Context c,int v){
                  return (int)(v*c.getResources().getDisplayMetrics().density+.5f);
              }

              private static void removeNow(){
                  try{if(robot!=null)robot.stop();}catch(Throwable ignored){}
                  try{if(wm!=null&&root!=null)wm.removeView(root);}catch(Throwable ignored){}
                  wm=null;root=null;robot=null;label=null;lp=null;owner=null;windowType=0;
              }

              private static void create(final Context c,int type){
                  root=new FrameLayout(c);
                  root.setPadding(dp(c,4),dp(c,4),dp(c,4),dp(c,4));
                  GradientDrawable bg=new GradientDrawable();
                  bg.setColor(Color.argb(225,5,22,30));
                  bg.setCornerRadius(dp(c,32));
                  bg.setStroke(dp(c,1),Color.argb(220,47,235,194));
                  root.setBackground(bg);
                  if(Build.VERSION.SDK_INT>=21)root.setElevation(dp(c,10));

                  robot=new AnimatedRobot(c);
                  FrameLayout.LayoutParams rp=new FrameLayout.LayoutParams(dp(c,70),dp(c,70));
                  rp.gravity=Gravity.START|Gravity.CENTER_VERTICAL;
                  root.addView(robot,rp);

                  label=new TextView(c);
                  label.setTextColor(Color.WHITE);
                  label.setTextSize(14);
                  label.setGravity(Gravity.CENTER);
                  label.setMaxLines(2);
                  label.setPadding(dp(c,7),0,dp(c,8),0);
                  FrameLayout.LayoutParams tp=new FrameLayout.LayoutParams(dp(c,138),dp(c,68));
                  tp.gravity=Gravity.END|Gravity.CENTER_VERTICAL;
                  tp.leftMargin=dp(c,70);
                  root.addView(label,tp);

                  lp=new WindowManager.LayoutParams(
                      dp(c,78),dp(c,78),type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL|
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      android.graphics.PixelFormat.TRANSLUCENT);
                  lp.gravity=Gravity.TOP|Gravity.END;
                  lp.x=dp(c,8); lp.y=dp(c,115);

                  root.setOnTouchListener(new View.OnTouchListener(){
                      @Override public boolean onTouch(View v,MotionEvent e){
                          if(lp==null||wm==null)return false;
                          switch(e.getActionMasked()){
                              case MotionEvent.ACTION_DOWN:
                                  downX=e.getRawX();downY=e.getRawY();startX=lp.x;startY=lp.y;return true;
                              case MotionEvent.ACTION_MOVE:
                                  lp.x=startX-(int)(e.getRawX()-downX);
                                  lp.y=startY+(int)(e.getRawY()-downY);
                                  try{wm.updateViewLayout(root,lp);}catch(Throwable ignored){}
                                  return true;
                              case MotionEvent.ACTION_UP:return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(root,lp);
                  robot.start();
              }

              private static void update(int state,String text){
                  if(root==null||robot==null||label==null||lp==null||wm==null)return;
                  robot.setState(state);

                  if(state==IDLE){
                      label.setVisibility(View.GONE);
                      lp.width=dp(root.getContext(),78);
                  }else{
                      label.setVisibility(View.VISIBLE);
                      lp.width=dp(root.getContext(),220);
                      if(text!=null&&!text.trim().isEmpty())label.setText(text.trim());
                      else if(state==LISTENING)label.setText("گوش می‌کنم...");
                      else if(state==SPEAKING)label.setText("در خدمتم");
                      else label.setText("در حال انجام...");
                  }
                  try{wm.updateViewLayout(root,lp);}catch(Throwable ignored){}
              }

              public static final class AnimatedRobot extends View implements ValueAnimator.AnimatorUpdateListener{
                  private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF r=new RectF();
                  private ValueAnimator animator;
                  private float phase;
                  private int state=IDLE;

                  public AnimatedRobot(Context c){
                      super(c);
                      setLayerType(View.LAYER_TYPE_SOFTWARE,null);
                  }

                  public void setState(int s){
                      state=s;
                      invalidate();
                  }

                  public void start(){
                      if(animator!=null&&animator.isRunning())return;
                      animator=ValueAnimator.ofFloat(0f,1f);
                      animator.setDuration(900);
                      animator.setRepeatCount(ValueAnimator.INFINITE);
                      animator.addUpdateListener(this);
                      animator.start();
                  }

                  public void stop(){
                      if(animator!=null){
                          try{animator.cancel();}catch(Throwable ignored){}
                          animator=null;
                      }
                  }

                  @Override public void onAnimationUpdate(ValueAnimator a){
                      phase=((Float)a.getAnimatedValue()).floatValue();
                      invalidate();
                  }

                  @Override protected void onDetachedFromWindow(){
                      stop();
                      super.onDetachedFromWindow();
                  }

                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);
                      float w=getWidth(),h=getHeight();
                      if(w<=0||h<=0)return;

                      double ang=phase*Math.PI*2.0;
                      float bob=(float)Math.sin(ang)*(state==IDLE?h*.02f:h*.055f);
                      float swing=(float)Math.sin(ang);
                      float swing2=(float)Math.sin(ang+Math.PI);
                      float blink=(float)Math.sin(ang*2.0)>0.91f?0.12f:1f;

                      int accent=state==LISTENING?Color.rgb(45,245,193):
                                 state==SPEAKING?Color.rgb(87,190,255):
                                 state==WORKING?Color.rgb(255,195,67):
                                 Color.rgb(95,224,198);
                      int metal=Color.rgb(25,48,59);
                      int metal2=Color.rgb(40,69,80);

                      float cx=w*.5f;
                      float headY=h*.27f+bob;
                      float bodyY=h*.59f+bob;

                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeCap(Paint.Cap.ROUND);
                      p.setStrokeJoin(Paint.Join.ROUND);
                      p.setStrokeWidth(w*.055f);
                      p.setColor(accent);
                      p.setShadowLayer(w*.10f,0,0,accent);

                      // antenna with moving tip
                      c.drawLine(cx,headY-h*.16f,cx+swing*w*.035f,headY-h*.28f,p);
                      p.setStyle(Paint.Style.FILL);
                      c.drawCircle(cx+swing*w*.035f,headY-h*.29f,w*.05f,p);

                      // head
                      p.clearShadowLayer();
                      p.setColor(metal);
                      r.set(w*.20f,headY-h*.13f,w*.80f,headY+h*.13f);
                      c.drawRoundRect(r,w*.12f,w*.12f,p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(accent);
                      p.setStrokeWidth(w*.045f);
                      c.drawRoundRect(r,w*.12f,w*.12f,p);

                      // ears pulse when listening
                      float ear=state==LISTENING ? (1f+0.28f*(float)Math.sin(ang*2.0)) : 1f;
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(accent);
                      c.drawCircle(w*.15f,headY,w*.045f*ear,p);
                      c.drawCircle(w*.85f,headY,w*.045f*ear,p);

                      // eyes blink; pupils move slightly
                      p.setColor(Color.rgb(222,255,250));
                      r.set(w*.31f,headY-h*.035f*blink,w*.41f,headY+h*.035f*blink);
                      c.drawOval(r,p);
                      r.set(w*.59f,headY-h*.035f*blink,w*.69f,headY+h*.035f*blink);
                      c.drawOval(r,p);
                      p.setColor(accent);
                      float look=swing*w*.012f;
                      c.drawCircle(w*.36f+look,headY,w*.018f*blink,p);
                      c.drawCircle(w*.64f+look,headY,w*.018f*blink,p);

                      // mouth moves while speaking
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(w*.035f);
                      p.setColor(accent);
                      float mouthOpen=state==SPEAKING?(h*.025f+h*.035f*Math.abs(swing)):h*.01f;
                      r.set(w*.38f,headY+h*.065f,w*.62f,headY+h*.065f+mouthOpen);
                      c.drawArc(r,0,180,false,p);

                      // neck
                      c.drawLine(cx,headY+h*.14f,cx,bodyY-h*.12f,p);

                      // body
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(metal2);
                      r.set(w*.29f,bodyY-h*.12f,w*.71f,bodyY+h*.12f);
                      c.drawRoundRect(r,w*.10f,w*.10f,p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(accent);
                      p.setStrokeWidth(w*.045f);
                      c.drawRoundRect(r,w*.10f,w*.10f,p);

                      // animated chest light
                      p.setStyle(Paint.Style.FILL);
                      float chest=1f+.25f*(float)Math.sin(ang*2.0);
                      c.drawCircle(cx,bodyY,w*.035f*chest,p);

                      // shoulders + arms: real movement per state
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(w*.055f);
                      float leftShoulderX=w*.29f,rightShoulderX=w*.71f;
                      float shoulderY=bodyY-h*.05f;
                      float leftAngle,rightAngle;
                      if(state==LISTENING){
                          leftAngle=-1.25f+.22f*swing;
                          rightAngle=1.25f-.22f*swing;
                      }else if(state==SPEAKING){
                          leftAngle=-.45f+.65f*swing;
                          rightAngle=.45f-.65f*swing;
                      }else if(state==WORKING){
                          leftAngle=-.9f+1.1f*swing;
                          rightAngle=.9f+1.1f*swing2;
                      }else{
                          leftAngle=-.30f+.12f*swing;
                          rightAngle=.30f-.12f*swing;
                      }
                      drawArm(c,leftShoulderX,shoulderY,leftAngle,w,h,accent);
                      drawArm(c,rightShoulderX,shoulderY,rightAngle,w,h,accent);

                      // hips and walking/dancing legs
                      float hipY=bodyY+h*.13f;
                      float hipLX=w*.40f,hipRX=w*.60f;
                      float legSwing=(state==IDLE?.12f:.45f)*swing;
                      drawLeg(c,hipLX,hipY,-.15f+legSwing,w,h,accent);
                      drawLeg(c,hipRX,hipY,.15f-legSwing,w,h,accent);

                      // little motion lines so animation is visually obvious
                      if(state!=IDLE){
                          p.setStrokeWidth(w*.025f);
                          p.setColor(Color.argb(150,Color.red(accent),Color.green(accent),Color.blue(accent)));
                          float dy=swing*h*.02f;
                          c.drawLine(w*.06f,h*.34f+dy,w*.13f,h*.31f+dy,p);
                          c.drawLine(w*.87f,h*.31f-dy,w*.94f,h*.34f-dy,p);
                      }
                  }

                  private void drawArm(Canvas c,float sx,float sy,float angle,float w,float h,int accent){
                      float len=w*.23f;
                      float ex=sx+(float)Math.sin(angle)*len;
                      float ey=sy+(float)Math.cos(angle)*len;
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(accent);
                      p.setStrokeWidth(w*.055f);
                      c.drawLine(sx,sy,ex,ey,p);
                      p.setStyle(Paint.Style.FILL);
                      c.drawCircle(ex,ey,w*.045f,p);
                  }

                  private void drawLeg(Canvas c,float sx,float sy,float angle,float w,float h,int accent){
                      float len=h*.18f;
                      float ex=sx+(float)Math.sin(angle)*len*.7f;
                      float ey=sy+(float)Math.cos(angle)*len;
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(accent);
                      p.setStrokeWidth(w*.06f);
                      c.drawLine(sx,sy,ex,ey,p);
                      c.drawLine(ex-w*.035f,ey,ex+w*.055f,ey,p);
                  }
              }
          }
          JAVA

      - name: Compile helper dex
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d classes $(find src -name '*.java')
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 26 --output out $(find classes -name '*.class')
          mv out/classes.dex out/hani-v422-animated-robot.dex
          ls -lh out/hani-v422-animated-robot.dex

      - uses: actions/upload-artifact@v4
        with:
          name: hani-v422-animated-robot
          path: out/hani-v422-animated-robot.dex
          retention-days: 1
