name: Patch Tehran Operations Phase 2

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-tehran-ops2.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'marker not found: {path}: {old[:100]}')
                  return False
              p.write_text(s.replace(old,new,1))
              return True

          shop='TehranSupermarket/shop.php'
          rep(shop, "require_once __DIR__.'/store_lib.php';require_once __DIR__.'/backup_lib.php';", "require_once __DIR__.'/store_lib.php';require_once __DIR__.'/sms_lib.php';require_once __DIR__.'/backup_lib.php';")
          old="""$fee=(int)$zone['fee'];$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$sub+$fee,$zoneId?:null,$zone['name'],$zone['eta']?:null]);$oid=(int)$pdo->lastInsertId();$ins=$pdo->prepare('INSERT INTO order_items(order_id,product_id,barcode,product_name,unit_price,quantity,picked) VALUES(?,?,?,?,?,?,0)');$up=$pdo->prepare('UPDATE products SET stock=stock-?,updated_at=NOW() WHERE id=?');foreach($items as $it){$ins->execute([$oid,$it['id'],$it['barcode'],$it['name'],$it['price'],$it['qty']]);$up->execute([$it['qty'],$it['id']]);}$pdo->commit();unset($_SESSION['cart']);$_SESSION['last_order_id']=$oid;$_SESSION['last_phone']=$phone;$_SESSION['checkout_name']=$name;$_SESSION['checkout_phone']=$phone;$_SESSION['checkout_address']=$address;header('Location:track.php?order='.$oid);exit;"""
          new="""$fee=(int)$zone['fee'];$publicToken=bin2hex(random_bytes(24));$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,public_token,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$sub+$fee,$zoneId?:null,$zone['name'],$zone['eta']?:null,$publicToken]);$oid=(int)$pdo->lastInsertId();$ins=$pdo->prepare('INSERT INTO order_items(order_id,product_id,barcode,product_name,unit_price,quantity,picked,original_product_id,original_product_name) VALUES(?,?,?,?,?,?,0,?,?)');$up=$pdo->prepare('UPDATE products SET stock=stock-?,updated_at=NOW() WHERE id=?');foreach($items as $it){$ins->execute([$oid,$it['id'],$it['barcode'],$it['name'],$it['price'],$it['qty'],$it['id'],$it['name']]);$up->execute([$it['qty'],$it['id']]);}$pdo->commit();ts_sms_order_event($pdo,$oid,'created');ts_process_sms_queue($pdo,2);unset($_SESSION['cart']);$_SESSION['last_order_id']=$oid;$_SESSION['last_phone']=$phone;$_SESSION['checkout_name']=$name;$_SESSION['checkout_phone']=$phone;$_SESSION['checkout_address']=$address;header('Location:track.php?t='.rawurlencode($publicToken));exit;"""
          rep(shop,old,new)
          old="$sql.=' ORDER BY (original_price IS NOT NULL AND original_price>price) DESC,id DESC LIMIT 160';$st=$pdo->prepare($sql);$st->execute($pa);$products=$st->fetchAll();"
          new="$countSql=str_replace('SELECT *','SELECT COUNT(*)',$sql);$cst=$pdo->prepare($countSql);$cst->execute($pa);$totalProducts=(int)$cst->fetchColumn();$page=max(1,(int)($_GET['page']??1));$perPage=48;$pages=max(1,(int)ceil($totalProducts/$perPage));$page=min($page,$pages);$offset=($page-1)*$perPage;$sql.=' ORDER BY (original_price IS NOT NULL AND original_price>price) DESC,id DESC LIMIT '.$perPage.' OFFSET '.$offset;$st=$pdo->prepare($sql);$st->execute($pa);$products=$st->fetchAll();"
          rep(shop,old,new)
          rep(shop, "@media(max-width:800px)", ".pager{display:flex;justify-content:center;gap:8px;margin:18px 0}.pager a{background:#fff;border:1px solid #dfe8e1;border-radius:10px;padding:9px 14px;font-weight:700}@media(max-width:800px)")
          rep(shop, '<section id="cart"', "<?php if($pages>1):?><div class=\"pager\"><?php if($page>1):?><a href=\"?<?=e(http_build_query(['q'=>$q,'cat'=>$cat,'page'=>$page-1]))?>#products\">قبلی</a><?php endif;?><span class=\"muted\">صفحه <?=$page?> از <?=$pages?></span><?php if($page<$pages):?><a href=\"?<?=e(http_build_query(['q'=>$q,'cat'=>$cat,'page'=>$page+1]))?>#products\">بعدی</a><?php endif;?></div><?php endif;?><section id=\"cart\"")

          orders='TehranSupermarket/admin_orders.php'
          rep(orders, "require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);", "require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);require_once __DIR__.'/sms_lib.php';")
          old="""if((int)$cnt['total']>0&&(int)$cnt['total']===(int)$cnt['picked']){$pdo->prepare(\"UPDATE orders SET status='ready',status_updated_at=NOW() WHERE id=? AND status IN ('new','confirmed','preparing','ready')\")->execute([$orderId]);}else"""
          new="""if((int)$cnt['total']>0&&(int)$cnt['total']===(int)$cnt['picked']){$pdo->prepare(\"UPDATE orders SET status='ready',status_updated_at=NOW() WHERE id=? AND status IN ('new','confirmed','preparing','ready')\")->execute([$orderId]);ts_sms_order_event($pdo,$orderId,'ready');ts_process_sms_queue($pdo,2);}else"""
          rep(orders,old,new)
          rep(orders, "$pdo->commit();$msg='وضعیت سفارش ذخیره شد.';", "$pdo->commit();if(in_array($new,['ready','out','delivered','cancelled'],true)){ts_sms_order_event($pdo,$orderId,$new);ts_process_sms_queue($pdo,2);}$msg='وضعیت سفارش ذخیره شد.';")
          rep(orders, '<div class="status-row"><?php foreach', '<div class="status-row"><?php if(in_array(($currentAdmin[\'role\']??\'\'),[\'owner\',\'manager\'],true)&&!in_array($o[\'status\'],[\'cancelled\',\'delivered\'],true)):?><a class="btn pale" href="admin_order_edit.php?order_id=<?=(int)$o[\'id\']?>">✏️ اصلاح اقلام</a><?php endif;?><?php foreach')
          rep(orders, '<?php else:?><a class="btn pale" href="admin.php">مدیریت اصلی</a><?php endif;?>', '<?php else:?><div style="display:flex;gap:6px"><a class="btn pale" href="admin_couriers.php">🛵 پیک‌ها</a><a class="btn pale" href="admin.php">مدیریت اصلی</a></div><?php endif;?>')

          admin='TehranSupermarket/admin.php'
          rep(admin, '<a href="#products-list">کالاها</a>', '<a href="admin_products.php">📦 کالاها</a>')
          rep(admin, '<a href="admin_discounts.php">💸 تخفیف‌ها</a>', '<a href="admin_discounts.php">💸 تخفیف‌ها</a><a href="admin_couriers.php">🛵 پیک‌ها</a>')
          rep(admin, '<a href="pyramid.php">🔄 پیرامید</a><a href="admin_users.php">🔐 امنیت و کاربران</a>', '<a href="pyramid.php">🔄 پیرامید</a><a href="admin_integrations.php">🔌 اتصال سرویس‌ها</a><a href="admin_users.php">🔐 امنیت و کاربران</a>')
          PY
          find TehranSupermarket -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check TehranSupermarket/sw.js
          node --check TehranSupermarket/assets/admin.js
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket
          git diff --cached --quiet && exit 0
          git commit -m 'Complete Tehran operations privacy courier catalog and messaging'
          git push origin HEAD:websaza-hosting
