name: PI FieldLab Rev F Android APK
on:
  push:
    branches:
      - pi-fieldlab-revf-20261122
    paths:
      - .github/workflows/build-pi-fieldlab-revf.yml
      - pi-fieldlab-revF-src.zip
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on runner
        run: |
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract isolated Android source
        run: |
          mkdir -p PIFieldLab
          unzip -q pi-fieldlab-revF-src.zip -d PIFieldLab
          test -s PIFieldLab/app/src/main/assets/metal-id-engine.js
          test -s PIFieldLab/app/src/main/java/com/pifieldlab/mobile/MainActivity.java
      - name: Test metal discrimination logic
        run: node PIFieldLab/tests/test_metal_id.js
      - name: Compile Android debug APK
        working-directory: PIFieldLab
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify output
        run: |
          test -s PIFieldLab/app/build/outputs/apk/debug/app-debug.apk
          cp PIFieldLab/app/build/outputs/apk/debug/app-debug.apk PI-FieldLab-3D-RevF-MetalID.apk
          sha256sum PI-FieldLab-3D-RevF-MetalID.apk
          ls -lh PI-FieldLab-3D-RevF-MetalID.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PI-FieldLab-3D-RevF-MetalID-APK
          path: PI-FieldLab-3D-RevF-MetalID.apk
          if-no-files-found: error
          retention-days: 30
