name: Inspect Tehran Supermarket Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/inspect-tehran-supermarket-temp'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      BASE: https://mch4444.dnsuserver.com:2083
      USER: vt6qdx8
      DIR: public_html/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Clear restricted nicotine image mappings and verify image coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH="Authorization: cpanel ${USER}:${CPANEL_TOKEN}"
          php -r "define('TS_INTERNAL_SEED',true); echo require 'TehranSupermarket/pyramid_seed_1400_data.php';" | base64 -d | gzip -dc > "$RUNNER_TEMP/products.jsonl"
          python3 - "$RUNNER_TEMP/products.jsonl" "$RUNNER_TEMP/cleanup.jsonl" <<'PY'
          import sys,json,re
          src,out=sys.argv[1:3]
          # Restricted nicotine/tobacco brands and explicit tobacco terms only.
          pats=[
            r'سیگار',r'سيگار',r'تنباکو',r'توتون',r'کنت',r'پال\s*مال',r'مونتانا',r'منتانا',
            r'وینستون',r'وينستون',r'مارلبرو',r'مارلبورو',r'کاوالو',r'داویدوف',r'دیویدوف',
            r'پارلیمنت',r'پارليمنت',r'دانهیل',r'دانهيل',r'کمل',r'چسترفیلد',r'چسترفيلد'
          ]
          rx=re.compile('|'.join(pats),re.I)
          rows=[]
          with open(src,encoding='utf-8') as f:
            for line in f:
              try:r=json.loads(line)
              except:continue
              name=str(r.get('name') or '')
              code=str(r.get('code2') or '')
              if code and rx.search(name):rows.append({'code2':code})
          with open(out,'w',encoding='utf-8') as f:
            for r in rows:f.write(json.dumps(r,ensure_ascii=False)+'\n')
          print('RESTRICTED_CODES',len(rows))
          PY
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${DIR}/storage" --data-urlencode 'file=product_image_cleanup_restricted.jsonl' --data-urlencode "content@$RUNNER_TEMP/cleanup.jsonl" "${BASE}/execute/Fileman/save_file_content" >/dev/null
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${DIR}" --data-urlencode 'file=product_image_seed.php' --data-urlencode 'content@TehranSupermarket/product_image_seed.php' "${BASE}/execute/Fileman/save_file_content" >/dev/null
          for i in 1 2 3 4; do curl -sS -L --max-time 180 'https://websaza.ir/tehran/' >/dev/null; sleep 1; done
          for f in product_image_cleanup_status.json product_image_manifest_status.json pyramid_seed_status.json; do
            R="$RUNNER_TEMP/$f.json"
            curl -sS -H "$AUTH" -H 'Accept: application/json' --get --data-urlencode "dir=${DIR}/storage" --data-urlencode "file=$f" "${BASE}/execute/Fileman/get_file_content" -o "$R" || true
            echo "--- $f ---"
            jq -r '.result.data.content // .data.content // "MISSING"' "$R" | head -c 5000; echo
          done
