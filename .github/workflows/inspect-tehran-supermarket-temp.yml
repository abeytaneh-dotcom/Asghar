name: Inspect Tehran Supermarket Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/inspect-tehran-supermarket-temp'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      BASE: https://mch4444.dnsuserver.com:2083
      USER: vt6qdx8
      DIR: public_html/tehran
    steps:
      - name: Refresh and read aggregate catalog status
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH="Authorization: cpanel ${USER}:${CPANEL_TOKEN}"
          curl -sS -L --max-time 120 'https://websaza.ir/tehran/' >/dev/null
          sleep 1
          curl -sS -L --max-time 120 'https://websaza.ir/tehran/' >/dev/null
          R="$RUNNER_TEMP/status.json"
          curl -sS --fail-with-body -H "$AUTH" -H 'Accept: application/json' --get --data-urlencode "dir=${DIR}/storage" --data-urlencode 'file=pyramid_seed_status.json' "${BASE}/execute/Fileman/get_file_content" -o "$R"
          C=$(jq -r '.result.data.content // .data.content // empty' "$R")
          test -n "$C"
          printf '%s\n' "$C" | jq '{ok,products,seed_done,checked_at}'
