name: Deploy SMS Bootstrap

"on":
  push:
    branches:
      - websaza-hosting
    paths:
      - ".github/workflows/deploy-sms-bootstrap.yml"
      - "WebSaza/namayandegi/bootstrap-sms.php"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bootstrap
        run: php -l WebSaza/namayandegi/bootstrap-sms.php

      - name: Upload bootstrap
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          response=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode "dir=public_html/namayandegi" \
            --data-urlencode "file=bootstrap-sms.php" \
            --data-urlencode "content@WebSaza/namayandegi/bootstrap-sms.php" \
            "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
          echo "$response" | jq -e '.status == 1' >/dev/null

      - name: Verify bootstrap
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://websaza.ir/namayandegi/bootstrap-sms.php)
          test "$code" = "404" || test "$code" = "410"
