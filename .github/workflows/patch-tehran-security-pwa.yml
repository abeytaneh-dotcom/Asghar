name: Patch Tehran Security PWA
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/patch-tehran-security-pwa.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'MISSING {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,count))
          secure="ini_set('session.cookie_httponly','1');ini_set('session.cookie_samesite','Strict');if(!empty($_SERVER['HTTPS'])&&$_SERVER['HTTPS']!=='off')ini_set('session.cookie_secure','1');session_start();"

          p='TehranSupermarket/admin.php'
          patch(p,"session_start();date_default_timezone_set('Asia/Tehran');",secure+"date_default_timezone_set('Asia/Tehran');")
          patch(p,"require_once __DIR__.'/schema.php';ensure_product_schema($pdo);}","require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/admin_auth.php';ts_admin_schema($pdo);require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);}")
          old="  $st=$pdo->prepare('SELECT id,password_hash FROM admins WHERE username=?');$st->execute([trim($_POST['username']??'')]);$a=$st->fetch();\n  if($a&&password_verify($_POST['password']??'',$a['password_hash'])){session_regenerate_id(true);$_SESSION['admin_id']=$a['id'];header('Location: admin.php');exit;}else{$err='نام کاربری یا رمز عبور نادرست است.';}"
          new="  [$ok,$loginErr,$role]=ts_login($pdo,trim((string)($_POST['username']??'')),(string)($_POST['password']??''));\n  if($ok){header('Location: '.($role==='staff'?'admin_orders.php':'admin.php'));exit;}else{$err=$loginErr;}"
          patch(p,old,new)
          marker="if(isset($_POST['logout'])){session_destroy();header('Location: admin.php');exit;}\nif($_SERVER['REQUEST_METHOD']==='POST'){"
          repl="if(isset($_POST['logout'])){ts_audit($pdo,'logout');session_destroy();header('Location: admin.php');exit;}\n$currentAdmin=null;if(admin()){$currentAdmin=ts_admin_current($pdo);if(!$currentAdmin){header('Location: admin.php');exit;}if(($currentAdmin['role']??'')==='staff'){if($_SERVER['REQUEST_METHOD']==='POST'){http_response_code(403);exit('دسترسی این حساب فقط به سفارش‌ها محدود است.');}header('Location: admin_orders.php');exit;}}\nif($_SERVER['REQUEST_METHOD']==='POST'){"
          patch(p,marker,repl)
          patch(p,'<a href="pyramid.php">🔄 پیرامید</a></nav>','<?php if(($currentAdmin[\'role\']??\'\')===\'owner\'):?><a href="pyramid.php">🔄 پیرامید</a><a href="admin_users.php">🔐 امنیت و کاربران</a><?php endif;?></nav>')

          p='TehranSupermarket/admin_orders.php'
          patch(p,"declare(strict_types=1);session_start();date_default_timezone_set('Asia/Tehran');","declare(strict_types=1);"+secure+"date_default_timezone_set('Asia/Tehran');")
          patch(p,"require_once __DIR__.'/schema.php';ensure_product_schema($pdo);}","require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/admin_auth.php';ts_admin_schema($pdo);require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);}")
          patch(p,"if(empty($_SESSION['admin_id'])){header('Location:admin.php');exit;}function e", "$currentAdmin=ts_require_roles($pdo,['owner','manager','staff']);function e")
          patch(p,'<a class="btn pale" href="admin.php">مدیریت اصلی</a></header>','<?php if(($currentAdmin[\'role\']??\'\')===\'staff\'):?><a class="btn pale" href="admin_logout.php">خروج</a><?php else:?><a class="btn pale" href="admin.php">مدیریت اصلی</a><?php endif;?></header>')

          for p in ['TehranSupermarket/admin_store.php','TehranSupermarket/admin_discounts.php']:
              patch(p,"declare(strict_types=1);session_start();date_default_timezone_set('Asia/Tehran');","declare(strict_types=1);"+secure+"date_default_timezone_set('Asia/Tehran');")
              patch(p,"require_once __DIR__.'/schema.php';ensure_product_schema($pdo);","require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/admin_auth.php';ts_admin_schema($pdo);require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);")
              patch(p,"if(empty($_SESSION['admin_id'])){header('Location:admin.php');exit;}","$currentAdmin=ts_require_roles($pdo,['owner','manager']);")

          p='TehranSupermarket/pyramid.php'
          patch(p,"session_start();date_default_timezone_set('Asia/Tehran');",secure+"date_default_timezone_set('Asia/Tehran');")
          patch(p,"require_once __DIR__.'/schema.php';ensure_product_schema($pdo);}","require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/admin_auth.php';ts_admin_schema($pdo);require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);}")
          patch(p,"if(empty($_SESSION['admin_id'])){header('Location: admin.php');exit;}","$currentAdmin=ts_require_roles($pdo,['owner']);")

          p='TehranSupermarket/image_upload.php'
          patch(p,"session_start();\ndate_default_timezone_set('Asia/Tehran');",secure+"\ndate_default_timezone_set('Asia/Tehran');")
          patch(p,"if(empty($_SESSION['admin_id'])) respond(['ok'=>false,'error'=>'ابتدا وارد پنل مدیریت شوید.'],401);","if(empty($_SESSION['admin_id'])) respond(['ok'=>false,'error'=>'ابتدا وارد پنل مدیریت شوید.'],401);\nif(!in_array((string)($_SESSION['admin_role']??''),['owner','manager'],true)) respond(['ok'=>false,'error'=>'این حساب اجازه مدیریت تصاویر محصول را ندارد.'],403);")

          p='TehranSupermarket/admin_alert.php'
          patch(p,"declare(strict_types=1);session_start();date_default_timezone_set('Asia/Tehran');","declare(strict_types=1);"+secure+"date_default_timezone_set('Asia/Tehran');")
          patch(p,"require_once __DIR__.'/schema.php';ensure_product_schema($pdo);$row=", "require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/admin_auth.php';ts_admin_schema($pdo);$currentAdmin=ts_admin_current($pdo);if(!$currentAdmin){http_response_code(401);echo json_encode(['ok'=>false]);exit;}$row=")

          p='TehranSupermarket/shop.php'
          patch(p,"require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/store_lib.php';","require_once __DIR__.'/schema.php';ensure_product_schema($pdo);require_once __DIR__.'/store_lib.php';require_once __DIR__.'/backup_lib.php';ts_schedule_auto_backup($pdo);")
          patch(p,'<meta name="theme-color" content="#11823b"><title>','<meta name="theme-color" content="#11823b"><link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="pwa-icon.php?size=192"><title>')
          patch(p,'<span class="location">📍 بهارستان اصفهان</span></div></header>','<span class="location">📍 بهارستان اصفهان</span> <button id="pwaInstall" class="btn pale" type="button" hidden>📲 نصب اپ</button></div></header>')
          script="""<script>(()=>{if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'/tehran/'}).catch(()=>{}));let p=null;const b=document.getElementById('pwaInstall');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e;if(b)b.hidden=false;});if(b)b.addEventListener('click',async()=>{if(!p)return;p.prompt();await p.userChoice;p=null;b.hidden=true;});window.addEventListener('appinstalled',()=>{if(b)b.hidden=true;});})();</script>"""
          patch(p,'</body></html>',script+'</body></html>')

          p='TehranSupermarket/.htaccess';s=Path(p).read_text()
          if 'Permissions-Policy' not in s:s=s.replace(' Header always set X-Frame-Options "SAMEORIGIN"',' Header always set X-Frame-Options "SAMEORIGIN"\n Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"\n Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"')
          if 'admin_auth\\.php' not in s:s=s.replace('config\\.php|install\\.lock\\.php|README\\.txt','config\\.php|install\\.lock\\.php|admin_auth\\.php|backup_cli\\.php|backup_lib\\.php|README\\.txt')
          Path(p).write_text(s)
          PY
          for f in TehranSupermarket/admin.php TehranSupermarket/admin_orders.php TehranSupermarket/admin_store.php TehranSupermarket/admin_discounts.php TehranSupermarket/pyramid.php TehranSupermarket/image_upload.php TehranSupermarket/admin_alert.php TehranSupermarket/admin_users.php TehranSupermarket/admin_auth.php TehranSupermarket/backup_cli.php TehranSupermarket/backup_lib.php TehranSupermarket/pwa-icon.php TehranSupermarket/shop.php; do php -l "$f"; done
          node --check TehranSupermarket/sw.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket
          git diff --cached --quiet && exit 0
          git commit -m 'Harden admin roles add PWA and automatic backups'
          git push origin websaza-hosting
