name: Reset Admin SMS Throttle

"on":
  push:
    branches:
      - websaza-hosting
    paths:
      - ".github/workflows/reset-admin-sms-throttle.yml"
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Clear recovery throttle counters only
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          r=$(curl --fail-with-body --silent --show-error -G -H "$auth" \
            --data-urlencode "dir=public_html/namayandegi/_data" \
            --data-urlencode "file=_login_security.json" \
            "https://mch4444.dnsuserver.com:2083/execute/Fileman/get_file_content")
          content=$(echo "$r" | jq -r '.data.content // "{}"')
          printf '%s' "$content" | jq '.resets = {}' > /tmp/security.json
          response=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode "dir=public_html/namayandegi/_data" \
            --data-urlencode "file=_login_security.json" \
            --data-urlencode "content@/tmp/security.json" \
            "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
          echo "$response" | jq -e '.status == 1' >/dev/null
# rerun-for-pattern-diagnostic
# rerun-with-validation-details
