name: Deploy Tehran Market V14

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/deploy-tehran-v10.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Inject final mobile composition v14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')

          # Remove older inline critical blocks and permanently remove the redundant hero paragraph.
          s=re.sub(r'<style id="tmx-mobile-critical-v\d+">.*?</style>','',s,flags=re.S)
          s=s.replace('<p>محصول را جستجو کن، بارکدش را اسکن کن یا از دستیار هوشمند کمک بگیر؛ خرید روزانه سریع‌تر و ساده‌تر.</p>','')

          critical=r'''<style id="tmx-mobile-critical-v14">
          @media(max-width:800px){
            html body .tmx-header{padding:7px 9px 8px!important;gap:6px!important;background:#080a0c!important}
            html body .tmx-head-search{height:39px!important;border-radius:11px!important}
            html body .tmx-head-search input{font-size:10px!important;padding:7px 10px!important}
            html body .tmx-head-search button{width:31px!important;height:31px!important;flex-basis:31px!important}

            html body .tmx-hero{height:325px!important;min-height:325px!important;padding:0!important;border-radius:0 0 18px 18px!important;display:block!important;position:relative!important;overflow:hidden!important;background:#07090b!important;isolation:isolate!important}
            html body .tmx-hero .tmx-hero-picture-v10{position:absolute!important;left:0!important;right:0!important;top:0!important;bottom:auto!important;height:215px!important;width:100%!important;display:block!important;z-index:0!important;overflow:hidden!important;background:#07090b!important}
            html body .tmx-hero .tmx-hero-picture-v10 img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 11%!important;display:block!important;visibility:visible!important;opacity:1!important;filter:saturate(1.05) contrast(1.04) brightness(1.18)!important}
            html body .tmx-hero>span[aria-hidden="true"]{position:absolute!important;left:0!important;right:0!important;top:142px!important;bottom:0!important;height:auto!important;background:linear-gradient(180deg,rgba(7,9,11,0) 0%,rgba(7,9,11,.72) 25%,#07090b 53%,#07090b 100%)!important;z-index:1!important;pointer-events:none!important}
            html body .tmx-hero:before{content:none!important}
            html body .tmx-hero .tmx-hero-copy{position:absolute!important;left:12px!important;right:12px!important;bottom:8px!important;top:auto!important;width:auto!important;max-width:none!important;z-index:3!important;text-align:center!important;padding:0!important;display:block!important;visibility:visible!important;opacity:1!important}
            html body .tmx-hero .tmx-eyebrow{display:inline-flex!important;font-size:7px!important;padding:3px 8px!important;background:rgba(12,14,17,.84)!important;border:1px solid rgba(244,201,77,.30)!important;border-radius:999px!important;margin:0 auto 4px!important;color:#f4c94d!important}
            html body .tmx-hero h1{font-size:17px!important;line-height:1.16!important;margin:1px auto 6px!important;max-width:100%!important;width:100%!important;text-align:center!important;white-space:normal!important;overflow:visible!important;text-shadow:0 2px 10px #000!important;color:#fff!important}
            html body .tmx-hero h1 strong{display:block!important;font-size:19px!important;line-height:1.18!important;color:#f4c94d!important;margin-top:2px!important;white-space:normal!important}
            html body .tmx-hero p{display:none!important}
            html body .tmx-hero-actions{display:flex!important;justify-content:center!important;align-items:center!important;gap:6px!important;flex-wrap:nowrap!important;width:100%!important;margin:0 auto!important}
            html body .tmx-primary,html body .tmx-secondary{min-height:32px!important;padding:5px 9px!important;font-size:7.8px!important;border-radius:9px!important;white-space:nowrap!important;flex:0 1 auto!important}
            html body .tmx-primary{background:#f1c445!important;color:#141414!important;box-shadow:0 5px 16px rgba(241,196,69,.18)!important}
            html body .tmx-secondary{background:rgba(11,14,17,.90)!important;color:#fff!important;border:1px solid rgba(255,255,255,.16)!important}

            html body .tmx-smart-row{margin:6px auto 0!important;padding:0 9px!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;position:relative!important;z-index:20!important}
            html body .tmx-smart-card{min-height:62px!important;padding:5px 3px!important;border-radius:13px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;text-align:center!important;gap:3px!important;box-shadow:0 7px 18px rgba(0,0,0,.06)!important}
            html body .tmx-smart-ico{width:28px!important;height:28px!important;flex-basis:28px!important;border-radius:8px!important;font-size:13px!important}
            html body .tmx-smart-card b{font-size:8px!important;margin:0!important}
            html body .tmx-smart-card small{display:none!important}

            html body main{padding-top:8px!important;padding-bottom:100px!important}
            html body .state{margin:5px 10px 8px!important;font-size:8.2px!important;padding:6px 8px!important;border-radius:10px!important}
            html body #products{scroll-margin-top:82px!important}
            html body #products .sectionhead{margin-top:2px!important;margin-bottom:7px!important}
            html body #products .sectionhead h2{font-size:18px!important;margin:0!important}
            html body #products .sectionhead p{font-size:8.5px!important;margin-top:2px!important}
            html body #tmx-mobile-nav{height:58px!important;padding:4px 8px calc(4px + env(safe-area-inset-bottom))!important;box-shadow:0 -6px 18px rgba(0,0,0,.08)!important}
            html body #tmx-mobile-nav button,html body #tmx-mobile-nav a{font-size:8.2px!important;gap:1px!important}
            html body #tmx-mobile-nav .tmx-nav-ico{font-size:15px!important}
            html body #tmx-mobile-nav .tmx-scan{width:48px!important;height:48px!important;transform:translateY(-6px)!important}
            html body .sticky{bottom:62px!important;left:8px!important;right:8px!important}
          }
          @media(max-width:390px){
            html body .tmx-hero{height:310px!important;min-height:310px!important}
            html body .tmx-hero .tmx-hero-picture-v10{height:205px!important}
            html body .tmx-hero>span[aria-hidden="true"]{top:136px!important}
            html body .tmx-hero h1{font-size:16.5px!important}
            html body .tmx-hero h1 strong{font-size:18.5px!important}
            html body .tmx-smart-card{min-height:60px!important}
          }
          </style>'''
          s=s.replace('</head>',critical+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/shop.php
          grep -Fq 'tmx-mobile-critical-v14' TehranSupermarket/shop.php
          grep -Fq 'height:325px!important' TehranSupermarket/shop.php
          ! grep -Fq 'محصول را جستجو کن، بارکدش را اسکن کن یا از دستیار هوشمند کمک بگیر؛ خرید روزانه سریع‌تر و ساده‌تر.' TehranSupermarket/shop.php

      - name: Persist storefront v14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize compact Tehran mobile hero v14'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload v14 storefront
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save.json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST \
              --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          upload TehranSupermarket/shop.php "$TARGET_DIR" shop.php

      - name: Verify live v14
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-14" -o "$RUNNER_TEMP/home.html"
          grep -Fq 'tmx-mobile-critical-v14' "$RUNNER_TEMP/home.html"
          grep -Fq 'height:325px!important' "$RUNNER_TEMP/home.html"
          grep -Fq 'min-height:62px!important' "$RUNNER_TEMP/home.html"
          ! grep -Fq 'محصول را جستجو کن، بارکدش را اسکن کن یا از دستیار هوشمند کمک بگیر؛ خرید روزانه سریع‌تر و ساده‌تر.' "$RUNNER_TEMP/home.html"
          echo 'TEHRAN_V14_LIVE_OK hero_paragraph=removed compact_hero=ok compact_cards=ok products_higher=ok'
