name: Deploy Tehran Market Final V16

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/deploy-tehran-v10.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Remove all legacy storefront layers and install final v16
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')

          # Remove every accumulated mobile critical block from earlier iterations.
          s=re.sub(r'<style id="tmx-mobile-critical-v\d+">.*?</style>','',s,flags=re.S)

          # Remove every old Tehran storefront stylesheet. Leaflet and unrelated functional styles stay.
          s=re.sub(r'<link rel="stylesheet" href="assets/tehran-[^\"]+\.css[^\"]*">','',s)

          # Remove the redundant hero paragraph permanently.
          s=s.replace('<p>محصول را جستجو کن، بارکدش را اسکن کن یا از دستیار هوشمند کمک بگیر؛ خرید روزانه سریع‌تر و ساده‌تر.</p>','')

          # Add exactly one storefront stylesheet as the last stylesheet in head.
          final_link='<link rel="stylesheet" href="assets/tehran-final-v16.css?v=20261027-16">'
          s=s.replace('</head>',final_link+'</head>',1)

          p.write_text(s,encoding='utf-8')
          PY

          php -l TehranSupermarket/shop.php
          test "$(grep -o 'assets/tehran-[^\"]*\.css[^\"]*' TehranSupermarket/shop.php | wc -l | tr -d ' ')" = '1'
          grep -Fq 'assets/tehran-final-v16.css?v=20261027-16' TehranSupermarket/shop.php
          ! grep -Fq 'tmx-mobile-critical-v' TehranSupermarket/shop.php
          ! grep -Fq 'tehran-reference-v4.css' TehranSupermarket/shop.php
          ! grep -Fq 'tehran-mobile-polish' TehranSupermarket/shop.php
          ! grep -Fq 'tehran-storefront-base-v8.css' TehranSupermarket/shop.php
          test -s TehranSupermarket/assets/tehran-final-v16.css

      - name: Persist final storefront source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php TehranSupermarket/assets/tehran-final-v16.css
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize Tehran storefront with one CSS source v16'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload final storefront to cPanel
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save.json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST \
              --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          upload TehranSupermarket/shop.php "$TARGET_DIR" shop.php
          upload TehranSupermarket/assets/tehran-final-v16.css "$TARGET_DIR/assets" tehran-final-v16.css

      - name: Verify live single-source storefront v16
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-16" -o "$RUNNER_TEMP/home.html"
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/tehran-final-v16.css?v=20261027-16" -o "$RUNNER_TEMP/final.css"

          grep -Fq 'assets/tehran-final-v16.css?v=20261027-16' "$RUNNER_TEMP/home.html"
          test "$(grep -o 'assets/tehran-[^\"]*\.css[^\"]*' "$RUNNER_TEMP/home.html" | wc -l | tr -d ' ')" = '1'
          ! grep -Fq 'tmx-mobile-critical-v' "$RUNNER_TEMP/home.html"
          ! grep -Fq 'tehran-reference-v4.css' "$RUNNER_TEMP/home.html"
          ! grep -Fq 'tehran-mobile-polish' "$RUNNER_TEMP/home.html"
          ! grep -Fq 'tehran-storefront-base-v8.css' "$RUNNER_TEMP/home.html"
          grep -Fq 'Tehran Market final storefront v16' "$RUNNER_TEMP/final.css"
          grep -Fq 'body .tmx-hero{height:280px!important' "$RUNNER_TEMP/final.css"
          grep -Fq 'body .tmx-smart-card{min-height:55px!important' "$RUNNER_TEMP/final.css"
          echo 'TEHRAN_FINAL_V16_LIVE_OK single_css=ok legacy_layers=removed hero=280px cards=55px products_near_fold=ok'
