name: Deploy Tehran Market V15

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/deploy-tehran-v10.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Inject compact overlay hero v15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="tmx-mobile-critical-v\d+">.*?</style>','',s,flags=re.S)
          s=s.replace('<p>محصول را جستجو کن، بارکدش را اسکن کن یا از دستیار هوشمند کمک بگیر؛ خرید روزانه سریع‌تر و ساده‌تر.</p>','')
          critical=r'''<style id="tmx-mobile-critical-v15">
          @media(max-width:800px){
            html body .tmx-header{padding:6px 9px 7px!important;gap:5px!important;background:#080a0c!important}
            html body .tmx-head-search{height:38px!important;border-radius:11px!important}
            html body .tmx-head-search input{font-size:10px!important;padding:6px 10px!important}
            html body .tmx-head-search button{width:30px!important;height:30px!important;flex-basis:30px!important}

            html body .tmx-hero{height:285px!important;min-height:285px!important;padding:0!important;border-radius:0 0 18px 18px!important;display:block!important;position:relative!important;overflow:hidden!important;background:#07090b!important;isolation:isolate!important}
            html body .tmx-hero .tmx-hero-picture-v10{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;z-index:0!important;overflow:hidden!important;background:#07090b!important}
            html body .tmx-hero .tmx-hero-picture-v10 img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 10%!important;display:block!important;visibility:visible!important;opacity:1!important;filter:saturate(1.04) contrast(1.04) brightness(1.12)!important}
            html body .tmx-hero>span[aria-hidden="true"]{position:absolute!important;inset:0!important;background:linear-gradient(180deg,rgba(5,7,9,.02) 0%,rgba(5,7,9,.05) 38%,rgba(5,7,9,.62) 62%,rgba(5,7,9,.94) 100%)!important;z-index:1!important;pointer-events:none!important}
            html body .tmx-hero:before{content:none!important}
            html body .tmx-hero .tmx-hero-copy{position:absolute!important;left:10px!important;right:10px!important;bottom:9px!important;top:auto!important;width:auto!important;max-width:none!important;z-index:3!important;text-align:center!important;padding:0!important;display:block!important;visibility:visible!important;opacity:1!important}
            html body .tmx-hero .tmx-eyebrow{display:inline-flex!important;font-size:6.6px!important;padding:3px 7px!important;background:rgba(10,12,15,.72)!important;border:1px solid rgba(244,201,77,.28)!important;border-radius:999px!important;margin:0 auto 3px!important;color:#f4c94d!important}
            html body .tmx-hero h1{font-size:16px!important;line-height:1.12!important;margin:0 auto 5px!important;max-width:100%!important;width:100%!important;text-align:center!important;white-space:normal!important;overflow:visible!important;text-shadow:0 2px 9px #000!important;color:#fff!important}
            html body .tmx-hero h1 strong{display:block!important;font-size:18px!important;line-height:1.16!important;color:#f4c94d!important;margin-top:1px!important;white-space:normal!important}
            html body .tmx-hero p{display:none!important}
            html body .tmx-hero-actions{display:flex!important;justify-content:center!important;align-items:center!important;gap:5px!important;flex-wrap:nowrap!important;width:100%!important;margin:0 auto!important}
            html body .tmx-primary,html body .tmx-secondary{min-height:29px!important;padding:4px 8px!important;font-size:7.2px!important;border-radius:8px!important;white-space:nowrap!important;flex:0 1 auto!important}
            html body .tmx-primary{background:#f1c445!important;color:#141414!important;box-shadow:0 4px 13px rgba(241,196,69,.16)!important}
            html body .tmx-secondary{background:rgba(9,12,15,.82)!important;color:#fff!important;border:1px solid rgba(255,255,255,.15)!important}

            html body .tmx-smart-row{margin:-5px auto 0!important;padding:0 9px!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;position:relative!important;z-index:20!important}
            html body .tmx-smart-card{min-height:56px!important;padding:4px 3px!important;border-radius:12px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;text-align:center!important;gap:2px!important;box-shadow:0 6px 16px rgba(0,0,0,.06)!important}
            html body .tmx-smart-ico{width:26px!important;height:26px!important;flex-basis:26px!important;border-radius:8px!important;font-size:12px!important}
            html body .tmx-smart-card b{font-size:7.6px!important;margin:0!important}
            html body .tmx-smart-card small{display:none!important}

            html body main{padding-top:6px!important;padding-bottom:96px!important}
            html body .state{margin:4px 10px 6px!important;font-size:7.8px!important;padding:5px 7px!important;border-radius:9px!important}
            html body #products{scroll-margin-top:78px!important}
            html body #products .sectionhead{margin-top:0!important;margin-bottom:5px!important}
            html body #products .sectionhead h2{font-size:17px!important;margin:0!important}
            html body #products .sectionhead p{font-size:8px!important;margin-top:1px!important}
            html body .cats{padding-bottom:7px!important;gap:5px!important}
            html body .cats a{padding:6px 9px!important;font-size:8px!important}
            html body #tmx-mobile-nav{height:56px!important;padding:3px 8px calc(3px + env(safe-area-inset-bottom))!important;box-shadow:0 -5px 16px rgba(0,0,0,.08)!important}
            html body #tmx-mobile-nav button,html body #tmx-mobile-nav a{font-size:7.8px!important;gap:1px!important}
            html body #tmx-mobile-nav .tmx-nav-ico{font-size:14px!important}
            html body #tmx-mobile-nav .tmx-scan{width:46px!important;height:46px!important;transform:translateY(-5px)!important}
            html body .sticky{bottom:60px!important;left:8px!important;right:8px!important}
          }
          @media(max-width:390px){
            html body .tmx-hero{height:272px!important;min-height:272px!important}
            html body .tmx-hero h1{font-size:15px!important}
            html body .tmx-hero h1 strong{font-size:17px!important}
            html body .tmx-smart-card{min-height:54px!important}
          }
          </style>'''
          s=s.replace('</head>',critical+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/shop.php
          grep -Fq 'tmx-mobile-critical-v15' TehranSupermarket/shop.php
          grep -Fq 'height:285px!important' TehranSupermarket/shop.php
          grep -Fq 'min-height:56px!important' TehranSupermarket/shop.php

      - name: Persist storefront v15
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          if ! git diff --cached --quiet; then
            git commit -m 'Compact Tehran mobile hero overlay v15'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload v15 storefront
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          out="$RUNNER_TEMP/save.json"
          curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST \
            --data-urlencode "dir=${TARGET_DIR}" --data-urlencode "file=shop.php" --data-urlencode "content@TehranSupermarket/shop.php" \
            "${BASE}/execute/Fileman/save_file_content" -o "$out"
          test "$(jq -r '.result.status // .status // 0' "$out")" = '1'

      - name: Verify live v15
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-15" -o "$RUNNER_TEMP/home.html"
          grep -Fq 'tmx-mobile-critical-v15' "$RUNNER_TEMP/home.html"
          grep -Fq 'height:285px!important' "$RUNNER_TEMP/home.html"
          grep -Fq 'min-height:56px!important' "$RUNNER_TEMP/home.html"
          echo 'TEHRAN_V15_LIVE_OK overlay_hero=ok compact_cards=ok products_near_fold=ok'
