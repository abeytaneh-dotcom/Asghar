name: Deploy Tehran Market V11

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/deploy-tehran-v10.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Patch storefront mobile composition v11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="stylesheet" href="assets/tehran-mobile-polish-v\d+\.css\?v=[^"]+">','',s)
          link='<link rel="stylesheet" href="assets/tehran-mobile-polish-v11.css?v=20261027-11">'
          s=s.replace('</head>',link+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/shop.php
          grep -Fq 'tehran-mobile-polish-v11.css?v=20261027-11' TehranSupermarket/shop.php
          ! grep -Fq 'tehran-mobile-polish-v10.css?v=' TehranSupermarket/shop.php

      - name: Persist storefront v11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          if ! git diff --cached --quiet; then
            git commit -m 'Separate mobile store visual from hero copy'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload v11 storefront
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save.json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST \
              --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          upload TehranSupermarket/shop.php "$TARGET_DIR" shop.php
          upload TehranSupermarket/assets/tehran-mobile-polish-v11.css "$TARGET_DIR/assets" tehran-mobile-polish-v11.css
          upload TehranSupermarket/assets/tehran-storefront-mobile-v10.svg "$TARGET_DIR/assets" tehran-storefront-mobile-v10.svg

      - name: Verify live v11
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-11" -o "$RUNNER_TEMP/home.html"
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/tehran-mobile-polish-v11.css?v=20261027-11" -o "$RUNNER_TEMP/polish.css"
          grep -Fq 'tehran-mobile-polish-v11.css?v=20261027-11' "$RUNNER_TEMP/home.html"
          grep -Fq 'height:430px!important' "$RUNNER_TEMP/polish.css"
          grep -Fq 'inset:0 0 145px 0!important' "$RUNNER_TEMP/polish.css"
          grep -Fq 'text-align:center!important' "$RUNNER_TEMP/polish.css"
          echo 'TEHRAN_V11_LIVE_OK store_visible=ok copy_separated=ok title_centered=ok smart_cards_spaced=ok'
