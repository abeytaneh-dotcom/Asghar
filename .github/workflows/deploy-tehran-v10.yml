name: Deploy Tehran Market Reference V18

on:
  push:
    branches:
      - websaza-hosting
    paths:
      - .github/workflows/deploy-tehran-v10.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Build inline storefront
        run: |
          set -e
          python3 .github/scripts/inline_tehran_v18.py
          php -l TehranSupermarket/shop.php
          grep -Fq 'tm-ref-inline-v18' TehranSupermarket/shop.php
          grep -Fq 'assets/tehran-storefront-v3.svg?v=20261027-ref18' TehranSupermarket/shop.php

      - name: Persist generated storefront
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          if ! git diff --cached --quiet; then
            git commit -m 'Generate inline Tehran reference storefront v18'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload storefront
        run: |
          set -e
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          curl -sS --fail-with-body -H "$AUTH" --request POST \
            --data-urlencode "dir=${TARGET_DIR}" \
            --data-urlencode "file=shop.php" \
            --data-urlencode "content@TehranSupermarket/shop.php" \
            "${BASE}/execute/Fileman/save_file_content" > "$RUNNER_TEMP/shop.json"
          test "$(jq -r '.result.status // .status // 0' "$RUNNER_TEMP/shop.json")" = '1'
          curl -sS --fail-with-body -H "$AUTH" --request POST \
            --data-urlencode "dir=${TARGET_DIR}/assets" \
            --data-urlencode "file=tehran-storefront-v3.svg" \
            --data-urlencode "content@TehranSupermarket/assets/tehran-storefront-v3.svg" \
            "${BASE}/execute/Fileman/save_file_content" > "$RUNNER_TEMP/hero.json"
          test "$(jq -r '.result.status // .status // 0' "$RUNNER_TEMP/hero.json")" = '1'

      - name: Verify live inline storefront
        run: |
          set -e
          curl -sS -L --fail -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-18" -o "$RUNNER_TEMP/home.html"
          curl -sS -L --fail -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/tehran-storefront-v3.svg?v=20261027-ref18" -o "$RUNNER_TEMP/hero.svg"
          grep -Fq 'tm-ref-inline-v18' "$RUNNER_TEMP/home.html"
          grep -Fq '.tm-ref-header{background:#080a0d' "$RUNNER_TEMP/home.html"
          grep -Fq '.tm-ref-hero{' "$RUNNER_TEMP/home.html"
          grep -Fq 'assets/tehran-storefront-v3.svg?v=20261027-ref18' "$RUNNER_TEMP/home.html"
          grep -Fq '#barcode-scan-fab,#tehran-ai-fab-v2' "$RUNNER_TEMP/home.html"
          test -s "$RUNNER_TEMP/hero.svg"
          echo 'TEHRAN_REFERENCE_V18_LIVE_OK'
