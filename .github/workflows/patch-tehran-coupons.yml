name: Patch Tehran Coupons
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-tehran-coupons.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch coupon flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path);s=p.read_text()
              if old not in s: raise SystemExit('marker missing '+path+' '+old[:80])
              p.write_text(s.replace(old,new,1))
          shop='TehranSupermarket/shop.php'
          rep(shop, "require_once __DIR__.'/sms_lib.php';require_once __DIR__.'/backup_lib.php';", "require_once __DIR__.'/sms_lib.php';require_once __DIR__.'/coupon_lib.php';ts_coupon_schema($pdo);require_once __DIR__.'/backup_lib.php';")
          rep(shop, "$name=trim((string)($_POST['name']??''));$phone=trim((string)($_POST['phone']??''));$address=trim((string)($_POST['address']??''));$slot=trim((string)($_POST['slot']??'اولین زمان ممکن'));$zoneId=max(0,(int)($_POST['zone_id']??0));", "$name=trim((string)($_POST['name']??''));$phone=trim((string)($_POST['phone']??''));$address=trim((string)($_POST['address']??''));$slot=trim((string)($_POST['slot']??'اولین زمان ممکن'));$zoneId=max(0,(int)($_POST['zone_id']??0));$couponCode=trim((string)($_POST['coupon_code']??''));")
          rep(shop, "if($sub<(int)$zone['min_order'])throw new RuntimeException('حداقل خرید برای '.$zone['name'].' '.toman($zone['min_order']).' است.');", "if($sub<(int)$zone['min_order'])throw new RuntimeException('حداقل خرید برای '.$zone['name'].' '.toman($zone['min_order']).' است.');$coupon=ts_coupon_apply($pdo,$couponCode,$sub,(int)$zone['fee'],true);if(!($coupon['ok']??false))throw new RuntimeException((string)($coupon['error']??'کد تخفیف معتبر نیست.'));")
          old="$fee=(int)$zone['fee'];$publicToken=bin2hex(random_bytes(24));$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,public_token,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$sub+$fee,$zoneId?:null,$zone['name'],$zone['eta']?:null,$publicToken]);$oid=(int)$pdo->lastInsertId();"
          new="$fee=(int)$coupon['delivery_fee'];$discount=(int)$coupon['discount'];$publicToken=bin2hex(random_bytes(24));$total=max(0,$sub-$discount)+$fee;$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,public_token,coupon_code,discount_total,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$total,$zoneId?:null,$zone['name'],$zone['eta']?:null,$publicToken,$coupon['code']?:null,$discount]);$oid=(int)$pdo->lastInsertId();ts_coupon_use($pdo,(int)$coupon['coupon_id']);"
          rep(shop,old,new)
          rep(shop, '<label>زمان تحویل<select name="slot">', '<label class="wide">کد تخفیف (اختیاری)<input name="coupon_code" autocomplete="off" placeholder="مثلاً WELCOME"></label><label>زمان تحویل<select name="slot">')
          admin='TehranSupermarket/admin.php'
          rep(admin, '<a href="admin_discounts.php">💸 تخفیف‌ها</a><a href="admin_couriers.php">🛵 پیک‌ها</a>', '<a href="admin_discounts.php">💸 تخفیف‌ها</a><a href="admin_coupons.php">🎁 کد تخفیف</a><a href="admin_couriers.php">🛵 پیک‌ها</a>')
          track='TehranSupermarket/track.php'
          rep(track, '<p><b>تحویل:</b> <?=e($order[\'delivery_slot\'])?></p>', '<?php if(!empty($order[\'discount_total\'])):?><p><b>تخفیف:</b> <?=toman($order[\'discount_total\'])?><?=!empty($order[\'coupon_code\'])?\' · کد \'.e($order[\'coupon_code\']):\'\'?></p><?php endif;?><p><b>تحویل:</b> <?=e($order[\'delivery_slot\'])?></p>')
          PY
          find TehranSupermarket -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket
          git diff --cached --quiet && exit 0
          git commit -m 'Add coupon codes to Tehran checkout'
          git push origin HEAD:websaza-hosting
