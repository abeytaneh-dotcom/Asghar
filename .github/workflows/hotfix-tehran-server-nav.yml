name: Rebuild Tehran Reference Storefront

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/hotfix-tehran-server-nav.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0
      - name: Build direct PHP storefront
        run: |
          python3 scripts/rebuild_tehran_reference.py
          php -l TehranSupermarket/shop.php
          php -l TehranSupermarket/index.php
          grep -Fq 'tmx-header' TehranSupermarket/shop.php
          grep -Fq 'tmx-hero' TehranSupermarket/shop.php
      - name: Persist rebuilt storefront
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php TehranSupermarket/index.php
          if ! git diff --cached --quiet; then git commit -m 'Rebuild Tehran storefront to approved reference'; git push origin HEAD:websaza-hosting; fi
      - name: Upload reference storefront
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){ local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save.json"; curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" "${BASE}/execute/Fileman/save_file_content" -o "$out"; test "$(jq -r '.result.status // .status // 0' "$out")" = '1'; }
          upload TehranSupermarket/shop.php "$TARGET_DIR" shop.php
          upload TehranSupermarket/index.php "$TARGET_DIR" index.php
          upload TehranSupermarket/assets/tehran-reference-v3.css "$TARGET_DIR/assets" tehran-reference-v3.css
          upload TehranSupermarket/assets/tehran-reference-v3.js "$TARGET_DIR/assets" tehran-reference-v3.js
          upload TehranSupermarket/assets/ai_entry_flow.js "$TARGET_DIR/assets" ai_entry_flow.js
      - name: Verify live reference storefront
        run: |
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-3" -o "$RUNNER_TEMP/home.html"
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/tehran-reference-v3.css?v=20261027-3" -o "$RUNNER_TEMP/ref.css"
          grep -Fq 'tmx-header' "$RUNNER_TEMP/home.html"
          grep -Fq 'tmx-hero' "$RUNNER_TEMP/home.html"
          grep -Fq 'اولین فروشگاه' "$RUNNER_TEMP/home.html"
          grep -Fq 'tehran-storefront-v2.svg' "$RUNNER_TEMP/ref.css"
          grep -Fq 'tmx-mobile-nav' "$RUNNER_TEMP/home.html"
          echo 'REFERENCE_LIVE_OK direct_php=ok hero=ok storefront=ok mobile_nav=ok'
