name: Hotfix Tehran Server Nav

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/hotfix-tehran-server-nav.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Force fresh storefront asset versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/index.php')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/server_storefront_critical_v1\.css\?v=[^"\']+', 'assets/server_storefront_critical_v1.css?v=20261027-30', s)
          s=re.sub(r'assets/server_mobile_nav_v1\.css\?v=[^"\']+', 'assets/server_mobile_nav_v1.css?v=20261027-30', s)
          s=re.sub(r'assets/server_mobile_nav_v1\.js\?v=[^"\']+', 'assets/server_mobile_nav_v1.js?v=20261027-30', s)
          s=re.sub(r'assets/ai_entry_flow\.js\?v=[^"\']+', 'assets/ai_entry_flow.js?v=20261027-106', s)
          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/index.php
          grep -Fq 'server_storefront_critical_v1.css?v=20261027-30' TehranSupermarket/index.php
          grep -Fq 'server_mobile_nav_v1.css?v=20261027-30' TehranSupermarket/index.php
          grep -Fq 'ai_entry_flow.js?v=20261027-106' TehranSupermarket/index.php
          grep -Fq 'black/gold' TehranSupermarket/assets/server_storefront_critical_v1.css

      - name: Persist version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/index.php
          if ! git diff --cached --quiet; then
            git commit -m 'Bust cache for black gold Tehran storefront'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload fresh storefront immediately
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save.json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST \
              --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          upload TehranSupermarket/index.php "$TARGET_DIR" index.php
          upload TehranSupermarket/assets/server_storefront_critical_v1.css "$TARGET_DIR/assets" server_storefront_critical_v1.css
          upload TehranSupermarket/assets/server_mobile_nav_v1.css "$TARGET_DIR/assets" server_mobile_nav_v1.css
          upload TehranSupermarket/assets/server_mobile_nav_v1.js "$TARGET_DIR/assets" server_mobile_nav_v1.js
          upload TehranSupermarket/assets/ai_entry_flow.js "$TARGET_DIR/assets" ai_entry_flow.js

      - name: Verify fresh black gold production skin
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?skin=20261027-30" -o "$RUNNER_TEMP/home.html"
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/server_storefront_critical_v1.css?v=20261027-30" -o "$RUNNER_TEMP/skin.css"
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/server_mobile_nav_v1.css?v=20261027-30" -o "$RUNNER_TEMP/nav.css"
          grep -Fq 'server_storefront_critical_v1.css?v=20261027-30' "$RUNNER_TEMP/home.html"
          grep -Fq 'server_mobile_nav_v1.css?v=20261027-30' "$RUNNER_TEMP/home.html"
          grep -Fq 'Tehran Market hard server skin v3' "$RUNNER_TEMP/skin.css"
          grep -Fq 'radial-gradient' "$RUNNER_TEMP/skin.css"
          grep -Fq 'rgba(7,9,11,.97)' "$RUNNER_TEMP/nav.css"
          echo 'BLACK_GOLD_LIVE_OK cache_busted=ok skin=ok mobile_nav=ok'
