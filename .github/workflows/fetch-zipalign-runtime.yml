name: Fetch Zipalign Runtime
on:
  push:
    paths:
      - '.github/workflows/fetch-zipalign-runtime.yml'
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Collect zipalign and exact runtime
        run: |
          set -euxo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p out/lib
          cp "$BT/zipalign" out/zipalign
          cp "$BT/apksigner" out/apksigner
          cp "$BT/lib/apksigner.jar" out/lib/apksigner.jar
          LDD="$(ldd "$BT/zipalign")"
          printf '%s\n' "$LDD"
          CXX="$(printf '%s\n' "$LDD" | awk '/libc\+\+\.so/ {print $3; exit}')"
          test -n "$CXX"
          cp "$CXX" out/libc++.so
          chmod +x out/zipalign out/apksigner
          ldd out/zipalign || true
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-runtime
          path: out/
          retention-days: 1
