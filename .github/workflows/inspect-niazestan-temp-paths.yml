name: Inspect Niazestan temporary paths

on:
  push:
    branches: [niazestan-cloud]
    paths:
      - '.github/workflows/inspect-niazestan-temp-paths.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
    steps:
      - name: Inspect only failed-deploy paths
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        shell: bash
        run: |
          auth="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          for p in 'public_html/niazestan.ir' 'public_html/public_html' 'public_html/public_html/niazestan.ir'; do
            echo "--- $p ---"
            curl --silent --show-error -H "$auth" --get \
              --data-urlencode "path=$p" \
              "https://${CPANEL_HOST}:2083/execute/Fileman/get_file_information" | jq '.' || true
          done
