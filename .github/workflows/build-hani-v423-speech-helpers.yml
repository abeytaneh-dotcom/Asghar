name: Build Hani v423 Speech Helpers
on:
  push:
    paths:
      - '.github/workflows/build-hani-v423-speech-helpers.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create helper sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src/ir/htaelec/haniassistant stubs/ir/htaelec/haniassistant classes helperclasses/ir/htaelec/haniassistant out

          cat > stubs/ir/htaelec/haniassistant/CommandRouter.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.content.Context;
          public final class CommandRouter {
              public interface Speaker { void say(String text); }
              public static int estimateScore(Context c, String s){ return 0; }
          }
          JAVA

          cat > stubs/ir/htaelec/haniassistant/ContactHelper.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.content.Context;
          public final class ContactHelper {
              public static final class Contact {
                  public final String name;
                  public final String number;
                  Contact(String n,String p){name=n;number=p;}
              }
              public static String normalize(String s){ return s; }
              public static Contact findPhone(Context c,String s){ return null; }
          }
          JAVA

          cat > stubs/ir/htaelec/haniassistant/DebugStore.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.content.Context;
          public final class DebugStore {
              public static void heard(Context c,String s){}
              public static void error(Context c,String s){}
          }
          JAVA

          cat > stubs/ir/htaelec/haniassistant/RobotOverlay.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.content.Context;
          public final class RobotOverlay {
              public static final int IDLE=0, LISTENING=1, SPEAKING=2, WORKING=3;
              public static void show(Context c,int s,String t){}
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/WakePhrase.java <<'JAVA'
          package ir.htaelec.haniassistant;

          public final class WakePhrase {
              private WakePhrase(){}

              public static boolean matches(String raw){
                  String n=ContactHelper.normalize(raw);
                  if(n==null||n.isEmpty()) return false;

                  if(n.equals("درود هانی") || n.startsWith("درود هانی ")) return true;
                  if(n.equals("درود هنی") || n.startsWith("درود هنی ")) return true;
                  if(n.equals("درود حانی") || n.startsWith("درود حانی ")) return true;
                  if(n.equals("درود آنی") || n.startsWith("درود آنی ")) return true;
                  if(n.equals("درود هانیه") || n.startsWith("درود هانیه ")) return true;

                  String c=n.replace(" ","");
                  if(!c.startsWith("درود")) return false;
                  return distance(c,"درودهانی")<=2;
              }

              private static int distance(String a,String b){
                  int[] prev=new int[b.length()+1];
                  for(int j=0;j<=b.length();j++) prev[j]=j;
                  for(int i=1;i<=a.length();i++){
                      int[] cur=new int[b.length()+1];
                      cur[0]=i;
                      for(int j=1;j<=b.length();j++){
                          int cost=a.charAt(i-1)==b.charAt(j-1)?0:1;
                          cur[j]=Math.min(Math.min(cur[j-1]+1,prev[j]+1),prev[j-1]+cost);
                      }
                      prev=cur;
                  }
                  return prev[b.length()];
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/NaturalConversation.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.content.Context;

          public final class NaturalConversation {
              private NaturalConversation(){}

              public static boolean handle(Context c,String raw,CommandRouter.Speaker speaker){
                  if(speaker==null) return false;
                  String n=ContactHelper.normalize(raw);
                  if(n==null) n="";
                  n=n.replace("شرو کن","شروع کن")
                     .replace("شروعه کن","شروع کن")
                     .replace("شروعش کن","شروع کن")
                     .replace("شروع بکن","شروع کن")
                     .trim();

                  if(n.equals("شروع")||n.equals("شروع کن")||n.equals("شروع کنیم")){
                      speaker.say("شروع کردم، بگو چه کاری انجام بدم");
                      return true;
                  }
                  if(n.equals("گوش کن")||n.equals("گوش بده")||n.equals("حواست به من باشه")){
                      speaker.say("گوش می‌کنم");
                      return true;
                  }
                  if(n.equals("هستی")||n.equals("هانی هستی")||n.equals("هستی هانی")||n.equals("آماده ای")||n.equals("آماده‌ای")){
                      speaker.say("جانم، در خدمتم");
                      return true;
                  }
                  if(n.equals("سلام")||n.equals("سلام هانی")||n.equals("درود")){
                      speaker.say("سلام، در خدمتم");
                      return true;
                  }
                  return false;
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/ContactMatcher.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.content.ContentResolver;
          import android.content.Context;
          import android.database.Cursor;
          import android.provider.ContactsContract;

          public final class ContactMatcher {
              private ContactMatcher(){}

              public static ContactHelper.Contact findPhone(Context c,String requested){
                  if(c==null||requested==null) return null;

                  ContactHelper.Contact exact=ContactHelper.findPhone(c,requested);
                  if(exact!=null) return exact;

                  String target=ContactHelper.normalize(requested);
                  if(target==null||target.isEmpty()) return null;

                  Cursor cur=null;
                  ContactHelper.Contact best=null;
                  int bestDist=Integer.MAX_VALUE;
                  int bestCount=0;

                  try{
                      ContentResolver cr=c.getContentResolver();
                      cur=cr.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          new String[]{
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          },
                          null,null,null
                      );
                      if(cur==null) return null;

                      while(cur.moveToNext()){
                          String name=cur.getString(0);
                          String number=cur.getString(1);
                          String nn=ContactHelper.normalize(name);
                          if(nn==null||nn.isEmpty()) continue;

                          int d=distance(target,nn);
                          int targetLen=Math.max(1,target.length());
                          int nameLen=Math.max(1,nn.length());
                          int maxLen=Math.max(targetLen,nameLen);

                          boolean sameEdges = target.charAt(0)==nn.charAt(0) &&
                                              target.charAt(target.length()-1)==nn.charAt(nn.length()-1);
                          int allowed = maxLen<=4 ? 2 : (maxLen<=7 ? 2 : 3);

                          if(!sameEdges && d>1) continue;
                          if(d>allowed) continue;

                          if(d<bestDist){
                              bestDist=d;
                              bestCount=1;
                              best=new ContactHelper.Contact(name,number);
                          }else if(d==bestDist){
                              if(best==null || !samePerson(best.name,name)){
                                  bestCount++;
                              }
                          }
                      }
                  }catch(Throwable ignored){
                      return null;
                  }finally{
                      if(cur!=null) try{cur.close();}catch(Throwable ignored){}
                  }

                  // Never guess between equally-close contacts.
                  return bestCount==1 ? best : null;
              }

              private static boolean samePerson(String a,String b){
                  String x=ContactHelper.normalize(a), y=ContactHelper.normalize(b);
                  return x!=null && x.equals(y);
              }

              private static int distance(String a,String b){
                  int[] prev=new int[b.length()+1];
                  for(int j=0;j<=b.length();j++) prev[j]=j;
                  for(int i=1;i<=a.length();i++){
                      int[] cur=new int[b.length()+1];
                      cur[0]=i;
                      for(int j=1;j<=b.length();j++){
                          int cost=a.charAt(i-1)==b.charAt(j-1)?0:1;
                          cur[j]=Math.min(Math.min(cur[j-1]+1,prev[j]+1),prev[j-1]+cost);
                      }
                      prev=cur;
                  }
                  return prev[b.length()];
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/AccurateSpeechBridge.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import java.lang.reflect.Method;
          import java.util.ArrayList;

          public final class AccurateSpeechBridge {
              private static SpeechRecognizer recognizer;
              private static Context owner;
              private static boolean active;
              private static boolean stopping;

              private AccurateSpeechBridge(){}

              public static boolean start(final Context c){
                  if(c==null) return false;
                  if(Looper.myLooper()!=Looper.getMainLooper()){
                      new Handler(Looper.getMainLooper()).post(new Runnable(){
                          @Override public void run(){ start(c); }
                      });
                      return true;
                  }

                  try{
                      if(!SpeechRecognizer.isRecognitionAvailable(c)) return false;
                      stopInternal(false);

                      owner=c;
                      recognizer=SpeechRecognizer.createSpeechRecognizer(c);
                      if(recognizer==null) return false;

                      recognizer.setRecognitionListener(new RecognitionListener(){
                          @Override public void onReadyForSpeech(Bundle p){
                              active=true;
                              RobotOverlay.show(c,RobotOverlay.LISTENING,"گوش می‌کنم...");
                          }
                          @Override public void onBeginningOfSpeech(){
                              RobotOverlay.show(c,RobotOverlay.LISTENING,"دارم می‌شنوم...");
                          }
                          @Override public void onRmsChanged(float rmsdB){}
                          @Override public void onBufferReceived(byte[] buffer){}
                          @Override public void onEndOfSpeech(){
                              RobotOverlay.show(c,RobotOverlay.WORKING,"دارم بررسی می‌کنم...");
                          }
                          @Override public void onError(int error){
                              if(stopping) return;
                              DebugStore.error(c,"تشخیص دقیق صدا فعال نشد؛ برگشت به حالت آفلاین ("+error+")");
                              stopInternal(false);
                              fallback(c);
                          }
                          @Override public void onResults(Bundle results){
                              String best=pickBest(c,results);
                              stopInternal(false);
                              if(best.isEmpty()){
                                  fallback(c);
                                  return;
                              }
                              DebugStore.heard(c,best);
                              dispatchResult(c,best);
                          }
                          @Override public void onPartialResults(Bundle partialResults){
                              String p=pickBest(c,partialResults);
                              if(!p.isEmpty()){
                                  DebugStore.heard(c,p);
                                  RobotOverlay.show(c,RobotOverlay.LISTENING,"شنیدم: "+p);
                              }
                          }
                          @Override public void onEvent(int eventType,Bundle params){}
                      });

                      Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE,"fa-IR");
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE,"fa-IR");
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS,true);
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS,5);
                      i.putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE,false);
                      i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS,850L);
                      i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS,600L);
                      i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS,250L);
                      recognizer.startListening(i);
                      active=true;
                      return true;
                  }catch(Throwable e){
                      stopInternal(false);
                      return false;
                  }
              }

              public static void stop(Context ignored){
                  if(Looper.myLooper()!=Looper.getMainLooper()){
                      new Handler(Looper.getMainLooper()).post(new Runnable(){
                          @Override public void run(){ stopInternal(true); }
                      });
                  }else{
                      stopInternal(true);
                  }
              }

              private static void stopInternal(boolean userStop){
                  stopping=userStop;
                  SpeechRecognizer r=recognizer;
                  recognizer=null;
                  active=false;
                  owner=null;
                  if(r!=null){
                      try{r.cancel();}catch(Throwable ignored){}
                      try{r.destroy();}catch(Throwable ignored){}
                  }
                  stopping=false;
              }

              private static String pickBest(Context c,Bundle b){
                  if(b==null) return "";
                  ArrayList<String> list=b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                  if(list==null||list.isEmpty()) return "";

                  String best="";
                  int bestScore=Integer.MIN_VALUE;
                  for(String raw:list){
                      String t=clean(raw);
                      if(t.isEmpty()) continue;
                      int score=0;
                      try{score=CommandRouter.estimateScore(c,t);}catch(Throwable ignored){}
                      if(t.contains(" کن")||t.contains(" بزن")||t.contains(" بگیر")||t.contains(" بذار")||t.contains(" باز")) score+=6;
                      if(t.contains("شروع")) score+=5;
                      if(score>bestScore){
                          bestScore=score;
                          best=t;
                      }
                  }
                  if(best.isEmpty()) best=clean(list.get(0));
                  return best;
              }

              private static String clean(String s){
                  if(s==null) return "";
                  String x=s.replace('ي','ی').replace('ك','ک').replace("\u200c"," ").replaceAll("\\s+"," ").trim();
                  x=x.replace("شرو کن","شروع کن")
                     .replace("شروعه کن","شروع کن")
                     .replace("شروع بکن","شروع کن")
                     .replace("درود خانی","درود هانی")
                     .replace("درود هنی","درود هانی")
                     .replace("درود حانی","درود هانی");
                  return x;
              }

              private static void dispatchResult(Context c,String text){
                  try{
                      org.json.JSONObject o=new org.json.JSONObject();
                      o.put("text",text);
                      Method m=c.getClass().getMethod("onResult",String.class);
                      m.invoke(c,o.toString());
                  }catch(Throwable e){
                      fallback(c);
                  }
              }

              private static void fallback(Context c){
                  try{
                      Method m=c.getClass().getDeclaredMethod("startVoskSessionListening");
                      m.setAccessible(true);
                      m.invoke(c);
                  }catch(Throwable ignored){}
              }
          }
          JAVA

      - name: Compile helpers to dex
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d classes $(find stubs src -name '*.java')

          cp classes/ir/htaelec/haniassistant/WakePhrase*.class helperclasses/ir/htaelec/haniassistant/
          cp classes/ir/htaelec/haniassistant/NaturalConversation*.class helperclasses/ir/htaelec/haniassistant/
          cp classes/ir/htaelec/haniassistant/ContactMatcher*.class helperclasses/ir/htaelec/haniassistant/
          cp classes/ir/htaelec/haniassistant/AccurateSpeechBridge*.class helperclasses/ir/htaelec/haniassistant/

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 26 --output out helperclasses
          mv out/classes.dex out/hani-v423-speech-helpers.dex
          ls -lh out/hani-v423-speech-helpers.dex

      - uses: actions/upload-artifact@v4
        with:
          name: hani-v423-speech-helpers
          path: out/hani-v423-speech-helpers.dex
          retention-days: 1
