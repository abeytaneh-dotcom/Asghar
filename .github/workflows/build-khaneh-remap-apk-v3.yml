name: Build Khaneh Remap APK v3.0.6 Auto Update

on:
  push:
    branches:
      - apk-build-v3-20260925
    paths:
      - apk-v3-src.zip.b64
      - .github/workflows/build-khaneh-remap-apk-v3.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Download v3.0.5 signing identity
        uses: actions/download-artifact@v4
        with:
          name: KhanehRemap-SmartOBD-v3.0.5-CLEAN-signing
          path: signing
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abeytaneh-dotcom/Asghar
          run-id: 36186243145

      - name: Unpack clean source and create v3.0.6
        run: |
          rm -rf apk-v306
          mkdir -p apk-v306
          base64 -d apk-v3-src.zip.b64 > /tmp/apk-v306.zip
          unzip -q /tmp/apk-v306.zip -d apk-v306
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > apk-v306/gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('apk-v306')
          p=root/'app/build.gradle'
          s=p.read_text()
          s=re.sub(r"applicationId\s+'[^']+'","applicationId 'com.krdiag.kilometer.n202609252354'",s)
          s=re.sub(r"minSdk\s+\d+","minSdk 23",s)
          s=re.sub(r"targetSdk\s+\d+","targetSdk 34",s)
          s=re.sub(r"versionCode\s+\d+","versionCode 306",s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '3.0.6'",s)
          s=s.replace('minifyEnabled true','minifyEnabled false').replace('shrinkResources true','shrinkResources false')
          p.write_text(s)

          p=root/'app/src/main/AndroidManifest.xml'
          s=p.read_text()
          if 'android:icon=' not in s:
              s=s.replace('android:allowBackup="false"',
                          'android:allowBackup="false"\n        android:icon="@drawable/kr_launcher"\n        android:roundIcon="@drawable/kr_launcher"')
          s=s.replace('android:label="خانه ریمپ"','android:label="@string/app_name"')
          p.write_text(s)
          (root/'app/src/main/res/values/strings.xml').write_text('<resources>\n<string name="app_name">خانه ریمپ کیلومتر</string>\n</resources>\n')

          p=root/'app/src/main/java/ir/khanehremap/diag/MainActivity.java'
          s=p.read_text()

          old='        @JavascriptInterface public void disconnect(){ runOnUiThread(()->{if(gatt!=null){try{gatt.disconnect();gatt.close();}catch(Exception ignored){}gatt=null;chars.clear();}); }'
          new='''        @JavascriptInterface public void disconnect(){
              runOnUiThread(()->{
                  if(gatt!=null){
                      try{gatt.disconnect();gatt.close();}catch(Exception ignored){}
                      gatt=null;
                  }
                  chars.clear();
              });
          }'''
          if old in s: s=s.replace(old,new)

          # No management-route hint in the app binary; endpoint is not rendered in UI.
          s=s.replace('private static final String APP_URL = "https://achinu.ir/diag/";',
                      'private static final String APP_ENDPOINT = "aHR0cHM6Ly9hY2hpbnUuaXIvZGlhZy8=";')
          s=s.replace('private static final String APP_ORIGIN = "https://achinu.ir";\n','')
          anchor='    private SharedPreferences prefs;\n'
          if 'private String appUrl()' not in s:
              s=s.replace(anchor,anchor+'\n    private String appUrl(){ return new String(Base64.decode(APP_ENDPOINT,Base64.NO_WRAP)); }\n')

          s=s.replace('if(url.startsWith(APP_URL) && !u.getPath().contains("/manage-")) return false;',
                      'Uri b=Uri.parse(appUrl()); String p=u.getPath()==null?"":u.getPath(); if("https".equalsIgnoreCase(u.getScheme()) && b.getHost()!=null && b.getHost().equalsIgnoreCase(u.getHost()) && ("/diag/".equals(p)||"/diag/index.php".equals(p))) return false;')
          s=s.replace('web.loadUrl(APP_URL);','web.loadUrl(appUrl());')
          s=s.replace('web.loadUrl(APP_URL));','web.loadUrl(appUrl()));')
          s=s.replace('URL u=new URL(APP_URL+"api/app_manifest.php");','URL u=new URL(appUrl()+"api/app_manifest.php");')
          s=s.replace('injectNativeUpdateHook();\n','')

          # Replace obsolete manual button hook with no-op.
          s=re.sub(r'\n    private void injectNativeUpdateHook\(\)\{.*?\n    \}\n', '\n', s, flags=re.S)

          # Current version must come from package metadata.
          s=s.replace('if(compareVersion(ver,"3.0.0")<=0){toastUi("برنامه به‌روز است");return;}\n                toastUi("در حال دریافت نسخه "+ver);\n                downloadAndInstall(url,sha,ver);',
          '''String current=currentVersion();
                if(compareVersion(ver,current)<=0)return;
                String notes=j.optString("notes","");
                runOnUiThread(()->new AlertDialog.Builder(MainActivity.this)
                    .setTitle("نسخه جدید آماده است")
                    .setMessage("نسخه "+ver+(notes.isEmpty()?"":"\\n\\n"+notes))
                    .setNegativeButton("بعداً",null)
                    .setPositiveButton("دانلود و نصب",(d,w)->new Thread(()->{
                        try{toastUi("در حال دریافت نسخه "+ver);downloadAndInstall(url,sha,ver);}
                        catch(Exception ex){toastUi("دریافت آپدیت انجام نشد");}
                    }).start())
                    .show());''')

          marker='    private void downloadAndInstall(String url,String sha,String ver)throws Exception{'
          if 'private String currentVersion()' not in s:
              s=s.replace(marker,'''    private String currentVersion(){
        try{return getPackageManager().getPackageInfo(getPackageName(),0).versionName;}catch(Exception e){return "0";}
    }

'''+marker)

          p.write_text(s)
          PY

          mkdir -p apk-v306/app/src/main/res/drawable
          cat > apk-v306/app/src/main/res/drawable/kr_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#041016" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#22E8FF" android:strokeWidth="3"
                  android:pathData="M8,54A46,46 0,1 1,100 54A46,46 0,1 1,8 54"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#39F2C1" android:strokeWidth="6"
                  android:strokeLineCap="round" android:pathData="M21,55A33,33 0,0 1,87 55"/>
              <path android:fillColor="@android:color/transparent" android:strokeColor="#FFFFFF" android:strokeWidth="4"
                  android:strokeLineCap="round" android:pathData="M54,55L80,36"/>
              <path android:fillColor="#22E8FF" android:pathData="M59,55A5,5 0,1 1,49 55A5,5 0,1 1,59 55"/>
              <path android:fillColor="#0B2530" android:strokeColor="#27E5FF" android:strokeWidth="2"
                  android:pathData="M18,70L24,62L36,58L45,51L66,51L75,57L85,61L91,70L88,76L20,76z"/>
              <path android:fillColor="#F2FEFF"
                  android:pathData="M34,79L39,79L39,91L45,79L51,79L44,87L52,98L46,98L40,90L39,91L39,98L34,98z"/>
              <path android:fillColor="#1FE7D2"
                  android:pathData="M55,79L68,79C75,79 78,82 78,87C78,91 75,93 72,94L79,98L72,98L66,94L61,94L61,98L55,98zM61,84L61,90L68,90C71,90 72,89 72,87C72,85 71,84 68,84z"/>
          </vector>
          XML

      - name: Build release
        run: |
          cd apk-v306
          gradle --no-daemon clean :app:assembleRelease

      - name: Zipalign
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            apk-v306/app/build/outputs/apk/release/app-release-unsigned.apk \
            KhanehRemap-SmartOBD-v3.0.6-aligned.apk

      - name: Sign with v3.0.5 identity
        run: |
          PASS="$(cat signing/KhanehRemap-v305-signing-password.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/KhanehRemap-SmartOBD-v305-FRESH.jks \
            --ks-key-alias krfresh305 \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out KhanehRemap-SmartOBD-v3.0.6.apk \
            KhanehRemap-SmartOBD-v3.0.6-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs KhanehRemap-SmartOBD-v3.0.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-SmartOBD-v3.0.6
          path: KhanehRemap-SmartOBD-v3.0.6.apk
          retention-days: 1
