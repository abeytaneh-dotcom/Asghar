name: Build Khaneh Remap APK v3

on:
  push:
    branches:
      - apk-build-v3-20260925
    paths:
      - apk-v3-src.zip.b64
      - .github/workflows/build-khaneh-remap-apk-v3.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Unpack and patch Android source
        run: |
          mkdir -p apk-v3
          base64 -d apk-v3-src.zip.b64 > /tmp/apk-v3.zip
          unzip -q /tmp/apk-v3.zip -d apk-v3
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.nonTransitiveRClass=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > apk-v3/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apk-v3/app/src/main/java/ir/khanehremap/diag/MainActivity.java')
          s=p.read_text()
          old='        @JavascriptInterface public void disconnect(){ runOnUiThread(()->{if(gatt!=null){try{gatt.disconnect();gatt.close();}catch(Exception ignored){}gatt=null;chars.clear();}); }'
          new='''        @JavascriptInterface public void disconnect(){
              runOnUiThread(()->{
                  if(gatt!=null){
                      try{gatt.disconnect();gatt.close();}catch(Exception ignored){}
                      gatt=null;
                  }
                  chars.clear();
              });
          }'''
          if old not in s:
              raise SystemExit('disconnect patch target missing')
          p.write_text(s.replace(old,new))
          PY

      - name: Build unsigned release APK
        run: |
          cd apk-v3
          gradle --no-daemon :app:assembleRelease

      - name: Zipalign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            apk-v3/app/build/outputs/apk/release/app-release-unsigned.apk \
            KhanehRemap-SmartOBD-v3.0-aligned-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-SmartOBD-v3.0-unsigned
          path: KhanehRemap-SmartOBD-v3.0-aligned-unsigned.apk
          if-no-files-found: error
          retention-days: 1
