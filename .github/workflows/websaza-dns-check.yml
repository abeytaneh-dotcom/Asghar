name: WebSaza DNS migration check

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/websaza-dns-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public DNS and cPanel zone
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          OLD_IP='159.69.20.154'
          NEW_IP='31.56.183.9'
          echo '=== Public IPv4 resolution ==='
          python3 - <<'PY'
          import socket
          for host in ('websaza.ir','www.websaza.ir','mail.websaza.ir','ftp.websaza.ir','cpanel.websaza.ir','webmail.websaza.ir'):
              try:
                  ips=sorted({x[4][0] for x in socket.getaddrinfo(host,None,socket.AF_INET)})
                  print(f'{host}: {",".join(ips) if ips else "NO_A"}')
              except Exception as e:
                  print(f'{host}: ERROR {type(e).__name__}')
          PY

          test -n "$CPANEL_TOKEN"
          echo '=== cPanel A/CNAME records relevant to migration ==='
          RESP=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: cpanel vt6qdx8:$CPANEL_TOKEN" \
            --get \
            --data-urlencode 'cpanel_jsonapi_user=vt6qdx8' \
            --data-urlencode 'cpanel_jsonapi_apiversion=2' \
            --data-urlencode 'cpanel_jsonapi_module=ZoneEdit' \
            --data-urlencode 'cpanel_jsonapi_func=fetchzone_records' \
            --data-urlencode 'domain=websaza.ir' \
            --data-urlencode 'customonly=0' \
            'https://mch4444.dnsuserver.com:2083/json-api/cpanel')
          echo "$RESP" | jq -e '.cpanelresult.event.result == 1' >/dev/null
          echo "$RESP" | jq -r --arg old "$OLD_IP" --arg new "$NEW_IP" '
            .cpanelresult.data[]
            | select(.type=="A" or .type=="CNAME")
            | select((.address==$old) or (.address==$new) or (.name|test("^(websaza\\.ir|www\\.|mail\\.|ftp\\.|cpanel\\.|webmail\\.|whm\\.|webdisk\\.)")))
            | [(.Line|tostring), .type, (.name//""), (.address//.cname//.record//""), (.ttl|tostring)]
            | @tsv'
          OLD_COUNT=$(echo "$RESP" | jq --arg old "$OLD_IP" '[.cpanelresult.data[] | select(.type=="A" and .address==$old)] | length')
          NEW_COUNT=$(echo "$RESP" | jq --arg new "$NEW_IP" '[.cpanelresult.data[] | select(.type=="A" and .address==$new)] | length')
          echo "OLD_IP_RECORDS=$OLD_COUNT"
          echo "NEW_IP_RECORDS=$NEW_COUNT"
