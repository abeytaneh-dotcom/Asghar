name: Niyazestan Smoke QA

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/nz-*'
      - 'WebSaza/niazestan-*'
      - 'WebSaza/marketplace-uploads/**'
      - 'WebSaza/.htaccess'
      - '.github/workflows/niyazestan-smoke.yml'
      - '.github/workflows/deploy-websaza.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for this commit to be deployed
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_SHA:0:12}"
          for i in $(seq 1 50); do
            HTML=$(curl -fsS --max-time 12 https://websaza.ir/nz 2>/dev/null || true)
            SW=$(curl -fsS --max-time 12 https://websaza.ir/niazestan-sw.js 2>/dev/null || true)
            HEALTH=$(curl -fsS --max-time 12 https://websaza.ir/nz-health.php 2>/dev/null || true)
            RELEASE=$(jq -r '.release // empty' <<<"$HEALTH" 2>/dev/null || true)
            if [ "$RELEASE" = "$EXPECTED" ] \
              && grep -Eq 'nz-brand-model\.js\?v=[a-f0-9]{12}' <<<"$HTML" \
              && grep -Eq 'nz-a11y\.js\?v=[a-f0-9]{12}' <<<"$HTML" \
              && grep -Eq '^const CACHE="niazestan-[a-f0-9]{16}";' <<<"$SW"; then
              echo "Deployment for $EXPECTED is live."; exit 0
            fi
            sleep 10
          done
          echo "Deployment for $EXPECTED did not become ready in time." >&2; exit 1

      - name: Check public application and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML=$(curl -fsS --retry 4 --retry-delay 3 --max-time 25 https://websaza.ir/nz)
          grep -F 'نیازستان' <<<"$HOME_HTML" >/dev/null
          grep -Eq 'nz-geocode-proxy\.js\?v=[a-f0-9]{12}' <<<"$HOME_HTML"
          grep -Eq 'nz-location-privacy\.js\?v=[a-f0-9]{12}' <<<"$HOME_HTML"
          LOGIN_HTML=$(curl -fsS --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz?page=login')
          grep -F 'ورود / ثبت‌نام' <<<"$LOGIN_HTML" >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 https://websaza.ir/nz-taxonomy.php | jq -e '.ok == true and (.categories|length) >= 10 and (.provinces|length) == 31' >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz-models.php?subcategory=%D8%AE%D9%88%D8%AF%D8%B1%D9%88' | jq -e '.ok == true and (.brands|length) > 5' >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz-models.php?subcategory=%D8%AE%D9%88%D8%AF%D8%B1%D9%88&brand=%D8%A7%DB%8C%D8%B1%D8%A7%D9%86%20%D8%AE%D9%88%D8%AF%D8%B1%D9%88' | jq -e '.ok == true and (.models|length) > 5' >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz-geocode.php?lat=35.6892&lon=51.3890' | jq -e '.ok == true and (.address|type)=="object"' >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 https://websaza.ir/nz-health.php | jq -e '.ok == true' >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 https://websaza.ir/nz-sitemap.xml | grep -F '<urlset' >/dev/null
          curl -fsS --retry 4 --retry-delay 3 --max-time 25 https://websaza.ir/nz-offline.html | grep -F 'اتصال اینترنت برقرار نیست' >/dev/null
          code=$(curl -sS -o /tmp/cron.json -w '%{http_code}' --max-time 25 https://websaza.ir/nz-lifecycle-cron.php); test "$code" = "403"
          code=$(curl -sS -o /tmp/private -w '%{http_code}' --max-time 25 https://websaza.ir/.marketplace-data/data.json); test "$code" = "404"
          curl -fsSI --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz?page=login' | grep -i 'cache-control:.*no-store' >/dev/null
          curl -fsSI --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz?page=notifications' | grep -i 'x-robots-tag:.*noindex' >/dev/null
          curl -fsSI --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz?page=login' | grep -i 'content-security-policy:' >/dev/null
          SEARCH=$(curl -fsS --retry 4 --retry-delay 3 --max-time 25 'https://websaza.ir/nz?page=search&category=%D9%88%D8%B3%D8%A7%DB%8C%D9%84%20%D9%86%D9%82%D9%84%DB%8C%D9%87')
          grep -F '<meta name="robots" content="index,follow,max-image-preview:large">' <<<"$SEARCH" >/dev/null
          grep -F '<link rel="canonical" href="https://websaza.ir/nz?page=search&amp;category=' <<<"$SEARCH" >/dev/null
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 https://websaza.ir/marketplace-uploads/.htaccess); test "$code" = "403" -o "$code" = "404"

      - name: Check static upgrade assets and PWA
        shell: bash
        run: |
          set -euo pipefail
          for f in nz-draft-preview.js nz-taxonomy-client.js nz-chat-live.js nz-brand-model.js nz-geocode-proxy.js nz-location-privacy.js nz-a11y.js; do
            echo "Checking $f"
            curl -fsS --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 "https://websaza.ir/$f" >/dev/null
          done
          echo "Checking service worker body"
          curl -fsS --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 https://websaza.ir/niazestan-sw.js | grep -E '^const CACHE="niazestan-[a-f0-9]{16}";' >/dev/null
          echo "Checking service worker content type"
          curl -fsS -D /tmp/sw-headers --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 https://websaza.ir/niazestan-sw.js -o /dev/null
          grep -iE '^content-type:.*(application|text)/javascript' /tmp/sw-headers >/dev/null
          echo "Checking manifest scope/start_url/display"
          curl -fsS --max-time 25 https://websaza.ir/nz-manifest.json | jq -e '.scope=="/nz" and .start_url=="/nz?source=pwa" and .display=="standalone"' >/dev/null
