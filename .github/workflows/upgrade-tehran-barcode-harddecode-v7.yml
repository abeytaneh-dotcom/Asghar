name: Upgrade Tehran Barcode Hard Decode V7

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/upgrade-tehran-barcode-harddecode-v7'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      CPANEL_BASE: https://mch4444.dnsuserver.com:2083
      CPANEL_USER: vt6qdx8
      SITE_DIR: public_html/tehran
      SITE_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch scanner
        run: python3 .github/scripts/patch_tehran_scanner_harddecode.py
      - name: Download ZXing hard decoder
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 --max-time 90 \
            'https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js' \
            -o "$RUNNER_TEMP/zxing.min.js"
          test $(wc -c < "$RUNNER_TEMP/zxing.min.js") -gt 250000
          grep -q 'BrowserMultiFormatReader' "$RUNNER_TEMP/zxing.min.js"
      - name: Commit scanner source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/barcode_scanner_v2.js
          if ! git diff --cached --quiet; then
            git commit -m 'Improve Tehran barcode hard decoding'
            git push origin HEAD:websaza-hosting
          fi
      - name: Deploy scanner and ZXing
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){ local file="$1" dir="$2" name="$3"; curl -sS --fail-with-body -H "$AUTH" -F "file-1=@${file};filename=${name}" -F "dir=${dir}" -F 'overwrite=1' "$CPANEL_BASE/execute/Fileman/upload_files" | jq -e '(.result.status // .status)==1' >/dev/null; }
          upload "$RUNNER_TEMP/zxing.min.js" "$SITE_DIR/assets" 'zxing.min.js'
          upload 'TehranSupermarket/barcode_scanner_v2.js' "$SITE_DIR" 'barcode_scanner_v2.js'
      - name: Verify hard decoder is live
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -sS --fail --max-time 30 "$SITE_URL/barcode_scanner_v2.js?v=$(date +%s)" -o "$RUNNER_TEMP/scanner.js"
          grep -q 'tehran-harddecode-v7' "$RUNNER_TEMP/scanner.js"
          grep -q 'TRY_HARDER' "$RUNNER_TEMP/scanner.js"
          grep -q 'RSS_EXPANDED' "$RUNNER_TEMP/scanner.js"
          grep -q 'hardDecodePhoto' "$RUNNER_TEMP/scanner.js"
          curl -sS --fail --max-time 30 "$SITE_URL/assets/zxing.min.js?v=$(date +%s)" -o "$RUNNER_TEMP/zxing.js"
          test $(wc -c < "$RUNNER_TEMP/zxing.js") -gt 250000
          code=$(curl -sS -o "$RUNNER_TEMP/lookup.json" -w '%{http_code}' --get --data-urlencode 'barcode=8996001414002' "$SITE_URL/barcode_lookup.php")
          test "$code" = 200
          jq -e 'has("ok")' "$RUNNER_TEMP/lookup.json" >/dev/null
