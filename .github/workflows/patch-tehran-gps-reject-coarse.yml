name: Patch Tehran GPS Reject Coarse
on:
  push:
    paths:
      - '.github/workflows/patch-tehran-gps-reject-coarse.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Reject coarse browser location
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          old="""function showGeo(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.max(1,Math.round(pos.coords.accuracy||99999));if(!bestGeo||acc<bestGeo.acc){bestGeo={lat,lng,acc};choose(lat,lng,acc,true);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:1,fillColor:'#64b5f6',fillOpacity:.13}).addTo(map);const msg=acc<=40?'✅ موقعیت دقیق پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر':acc<=120?'موقعیت پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر؛ چند ثانیه برای دقت بهتر صبر کنید.':'⚠️ موقعیت فعلی تقریبی است · دقت حدود '+acc.toLocaleString('fa-IR')+' متر. اگر بهتر نشد، لوکیشن دقیق Chrome را فعال کنید یا دستی روی نقشه انتخاب کنید.';st.className='locstatus '+(acc<=120?'ok':'warn');st.textContent=msg;}if(bestGeo&&bestGeo.acc<=25)finishGeo();}"""
          new="""function showGeo(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.max(1,Math.round(pos.coords.accuracy||99999));if(!bestGeo||acc<bestGeo.acc){bestGeo={lat,lng,acc};if(acc<=120){choose(lat,lng,acc,true);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:1,fillColor:'#64b5f6',fillOpacity:.13}).addTo(map);const msg=acc<=40?'✅ موقعیت دقیق پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر':'موقعیت قابل قبول پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر؛ چند ثانیه برای دقت بهتر صبر کنید.';st.className='locstatus ok';st.textContent=msg;}else{st.className='locstatus warn';st.textContent='⚠️ لوکیشن گوشی تقریبی است · دقت حدود '+acc.toLocaleString('fa-IR')+' متر. پین جابه‌جا نشد. «موقعیت دقیق» Chrome را فعال کنید یا محل تحویل را دستی روی نقشه انتخاب کنید.';}}if(bestGeo&&bestGeo.acc<=25)finishGeo();}"""
          if old not in s:
              raise SystemExit('showGeo block not found')
          s=s.replace(old,new)
          old2="""if(bestGeo){pending={lat:bestGeo.lat,lng:bestGeo.lng,acc:bestGeo.acc};if(bestGeo.acc>150){st.className='locstatus warn';st.textContent='⚠️ بهترین دقت فعلی '+bestGeo.acc.toLocaleString('fa-IR')+' متر است؛ این موقعیت تقریبی است. برای تحویل دقیق، پین را دستی اصلاح کنید یا دسترسی «موقعیت دقیق» Chrome را فعال کنید.';}else{st.className='locstatus ok';st.textContent='✅ بهترین موقعیت پیدا شد · دقت حدود '+bestGeo.acc.toLocaleString('fa-IR')+' متر. اگر درست است «ثبت این نقطه» را بزنید.';}}"""
          new2="""if(bestGeo){if(bestGeo.acc>120){st.className='locstatus warn';st.textContent='⚠️ بهترین دقت فعلی '+bestGeo.acc.toLocaleString('fa-IR')+' متر است؛ برای جلوگیری از ثبت آدرس اشتباه، این موقعیت قبول نشد و پین جابه‌جا نشد. موقعیت دقیق Chrome را فعال کنید یا پین را دستی روی محل تحویل بگذارید.';}else{pending={lat:bestGeo.lat,lng:bestGeo.lng,acc:bestGeo.acc};st.className='locstatus ok';st.textContent='✅ بهترین موقعیت پیدا شد · دقت حدود '+bestGeo.acc.toLocaleString('fa-IR')+' متر. اگر درست است «ثبت این نقطه» را بزنید.';}}"""
          if old2 not in s:
              raise SystemExit('finishGeo block not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          git commit -m 'Reject inaccurate browser GPS for Tehran checkout' || exit 0
          git push origin HEAD:websaza-hosting
