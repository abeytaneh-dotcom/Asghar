name: Build Hani Overlay v420
on:
  push:
    paths:
      - '.github/workflows/build-hani-overlay-v420.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create helper sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src/ir/htaelec/haniassistant out
          cat > src/ir/htaelec/haniassistant/RobotOverlay.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.accessibilityservice.AccessibilityService;
          import android.animation.ObjectAnimator;
          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import java.lang.reflect.Field;

          public final class RobotOverlay {
              public static final int IDLE=0, LISTENING=1, SPEAKING=2, WORKING=3;
              private static WindowManager wm;
              private static FrameLayout root;
              private static RobotFace face;
              private static TextView label;
              private static WindowManager.LayoutParams lp;
              private static ObjectAnimator pulse;
              private static float downX, downY;
              private static int startX, startY;

              private RobotOverlay(){}

              public static void show(final Context context, final int state, final String text) {
                  if (context == null) return;
                  new Handler(Looper.getMainLooper()).post(new Runnable() {
                      @Override public void run() {
                          try {
                              AccessibilityService as = service();
                              if (as == null) return;
                              if (wm == null) wm = (WindowManager) as.getSystemService(Context.WINDOW_SERVICE);
                              if (wm == null) return;
                              if (root == null) create(as);
                              update(state, text);
                          } catch (Throwable ignored) {}
                      }
                  });
              }

              public static void hide() {
                  new Handler(Looper.getMainLooper()).post(new Runnable() {
                      @Override public void run() {
                          try {
                              if (pulse != null) pulse.cancel();
                              if (wm != null && root != null) wm.removeView(root);
                          } catch (Throwable ignored) {}
                          root=null; face=null; label=null; lp=null; pulse=null;
                      }
                  });
              }

              private static AccessibilityService service() {
                  try {
                      Class<?> c = Class.forName("ir.htaelec.haniassistant.HaniAccessibilityService");
                      Field f = c.getDeclaredField("instance");
                      f.setAccessible(true);
                      Object o = f.get(null);
                      return o instanceof AccessibilityService ? (AccessibilityService)o : null;
                  } catch(Throwable e) { return null; }
              }

              private static int dp(Context c, int v) {
                  return (int)(v*c.getResources().getDisplayMetrics().density+0.5f);
              }

              private static void create(final AccessibilityService c) {
                  root = new FrameLayout(c);
                  root.setPadding(dp(c,5),dp(c,5),dp(c,5),dp(c,5));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(222,8,28,36));
                  bg.setCornerRadius(dp(c,24));
                  bg.setStroke(dp(c,1),Color.argb(180,36,218,180));
                  root.setBackground(bg);

                  face = new RobotFace(c);
                  FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(dp(c,56),dp(c,56));
                  fp.gravity=Gravity.START|Gravity.CENTER_VERTICAL;
                  root.addView(face,fp);

                  label = new TextView(c);
                  label.setTextColor(Color.WHITE);
                  label.setTextSize(13);
                  label.setGravity(Gravity.CENTER);
                  label.setMaxLines(2);
                  FrameLayout.LayoutParams tp = new FrameLayout.LayoutParams(dp(c,104),dp(c,58));
                  tp.gravity=Gravity.END|Gravity.CENTER_VERTICAL;
                  tp.leftMargin=dp(c,57);
                  root.addView(label,tp);

                  int type = Build.VERSION.SDK_INT >= 22 ? 2032 : 2006;
                  lp = new WindowManager.LayoutParams(dp(c,170),dp(c,68),type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE |
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL |
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      android.graphics.PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP|Gravity.END;
                  lp.x=dp(c,8);
                  lp.y=dp(c,120);

                  root.setOnTouchListener(new View.OnTouchListener(){
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if(lp==null||wm==null) return false;
                          switch(e.getActionMasked()){
                              case MotionEvent.ACTION_DOWN:
                                  downX=e.getRawX(); downY=e.getRawY(); startX=lp.x; startY=lp.y; return true;
                              case MotionEvent.ACTION_MOVE:
                                  lp.x=startX-(int)(e.getRawX()-downX);
                                  lp.y=startY+(int)(e.getRawY()-downY);
                                  try{wm.updateViewLayout(root,lp);}catch(Throwable ignored){}
                                  return true;
                              case MotionEvent.ACTION_UP: return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(root,lp);
              }

              private static void update(int state, String text) {
                  if(root==null||face==null||label==null||lp==null||wm==null) return;
                  face.state=state; face.invalidate();
                  if (pulse!=null) { pulse.cancel(); pulse=null; }
                  String s=text==null?"":text.trim();
                  if(state==IDLE) {
                      label.setText("هانی فعال");
                      lp.width=dp(root.getContext(),122);
                  } else if(state==LISTENING) {
                      label.setText(s.length()>0?s:"گوش می‌کنم...");
                      lp.width=dp(root.getContext(),170);
                      pulse=ObjectAnimator.ofFloat(face,"alpha",1f,.45f,1f);
                      pulse.setDuration(850); pulse.setRepeatCount(ValueAnimator.INFINITE); pulse.start();
                  } else if(state==SPEAKING) {
                      label.setText(s.length()>0?s:"در خدمتم");
                      lp.width=dp(root.getContext(),185);
                      pulse=ObjectAnimator.ofFloat(face,"scaleX",1f,1.12f,1f);
                      pulse.setDuration(650); pulse.setRepeatCount(ValueAnimator.INFINITE); pulse.start();
                  } else {
                      label.setText(s.length()>0?s:"در حال انجام...");
                      lp.width=dp(root.getContext(),175);
                      pulse=ObjectAnimator.ofFloat(face,"rotation",-5f,5f,-5f);
                      pulse.setDuration(500); pulse.setRepeatCount(ValueAnimator.INFINITE); pulse.start();
                  }
                  try{wm.updateViewLayout(root,lp);}catch(Throwable ignored){}
              }

              public static final class RobotFace extends View {
                  final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
                  final RectF r=new RectF();
                  int state=0;
                  public RobotFace(Context c){super(c); setLayerType(View.LAYER_TYPE_SOFTWARE,null);}
                  @Override protected void onDraw(Canvas c){
                      super.onDraw(c);
                      float w=getWidth(),h=getHeight(),cx=w/2f;
                      int accent = state==LISTENING?Color.rgb(55,235,190): state==SPEAKING?Color.rgb(80,185,255): state==WORKING?Color.rgb(255,195,70):Color.rgb(120,210,195);
                      p.setStrokeWidth(Math.max(3f,w*.055f)); p.setStrokeCap(Paint.Cap.ROUND);
                      p.setColor(accent); c.drawLine(cx,h*.16f,cx,h*.04f,p); c.drawCircle(cx,h*.035f,w*.045f,p);
                      p.setStyle(Paint.Style.FILL); p.setColor(Color.rgb(28,48,57));
                      r.set(w*.12f,h*.18f,w*.88f,h*.78f); c.drawRoundRect(r,w*.18f,w*.18f,p);
                      p.setStyle(Paint.Style.STROKE); p.setColor(accent); p.setStrokeWidth(w*.055f); c.drawRoundRect(r,w*.18f,w*.18f,p);
                      p.setStyle(Paint.Style.FILL); p.setColor(accent);
                      c.drawCircle(w*.36f,h*.43f,w*.065f,p); c.drawCircle(w*.64f,h*.43f,w*.065f,p);
                      p.setStrokeWidth(w*.045f); c.drawLine(w*.35f,h*.62f,w*.65f,h*.62f,p);
                      c.drawRoundRect(w*.26f,h*.78f,w*.74f,h*.91f,w*.08f,w*.08f,p);
                  }
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/HaniVoiceFeedback.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Method;

          public final class HaniVoiceFeedback {
              private static MediaPlayer active;
              private HaniVoiceFeedback(){}

              public static boolean play(Context c, String text) {
                  if(c==null||text==null) return false;
                  String n=norm(text);
                  String clip=null;
                  if(n.contains("در خدمتم")||n.contains("بفرمایید")||n.contains("جانم")||n.contains("منتظر دستور")) clip="ready.wav";
                  else if(n.contains("چراغ") && n.contains("روشن")) clip="flash_on.wav";
                  else if(n.contains("چراغ") && n.contains("خاموش")) clip="flash_off.wav";
                  else if(n.contains("تایمر")||n.contains("زمان سنج")) clip="timer.wav";
                  else if(n.contains("زنگ زدم")||n.contains("تماس گرفتم")||n.contains("دارم زنگ")) clip="call.wav";
                  else if((n.contains("پیام")||n.contains("واتساپ")) && (n.contains("ارسال")||n.contains("فرست"))) clip="message.wav";
                  else if(n.contains("باز شد")||n.contains("باز کردم")||n.contains("اجرا شد")) clip="opened.wav";
                  else if(n.contains("نفهم")||n.contains("متوجه نشدم")) clip="retry.wav";
                  else if(n.contains("انجام شد")||n.equals("باشه")||n.equals("حتما")) clip="done.wav";
                  if(clip==null) return false;
                  return playClip(c,clip);
              }

              private static String norm(String s){
                  return s.replace('ي','ی').replace('ك','ک').replace("\u200c"," ").replaceAll("\\s+"," ").trim();
              }

              private static boolean playClip(final Context c, String clip) {
                  try {
                      File dir=new File(c.getCacheDir(),"hani_voice");
                      if(!dir.exists()) dir.mkdirs();
                      final File out=new File(dir,clip);
                      if(!out.exists()||out.length()<100){
                          InputStream in=c.getAssets().open("hani_voice/"+clip);
                          FileOutputStream fos=new FileOutputStream(out);
                          byte[] b=new byte[8192]; int n;
                          while((n=in.read(b))>0) fos.write(b,0,n);
                          fos.flush(); fos.close(); in.close();
                      }
                      try{ if(active!=null){active.stop();active.release();} }catch(Throwable ignored){}
                      MediaPlayer mp=new MediaPlayer();
                      if(Build.VERSION.SDK_INT>=21){
                          mp.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ASSISTANCE_ACCESSIBILITY).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                      }else mp.setAudioStreamType(3);
                      mp.setDataSource(out.getAbsolutePath());
                      mp.setVolume(1f,1f);
                      mp.setOnCompletionListener(new MediaPlayer.OnCompletionListener(){
                          @Override public void onCompletion(MediaPlayer m){try{m.release();}catch(Throwable ignored){} active=null; finish(c);}
                      });
                      mp.setOnErrorListener(new MediaPlayer.OnErrorListener(){
                          @Override public boolean onError(MediaPlayer m,int what,int extra){try{m.release();}catch(Throwable ignored){} active=null; finish(c); return true;}
                      });
                      mp.prepare();
                      active=mp; mp.start(); return true;
                  }catch(Throwable e){return false;}
              }

              private static void finish(final Context c){
                  new Handler(Looper.getMainLooper()).post(new Runnable(){
                      @Override public void run(){
                          try{
                              Method m=c.getClass().getDeclaredMethod("afterSpeech");
                              m.setAccessible(true); m.invoke(c);
                          }catch(Throwable ignored){}
                      }
                  });
              }
          }
          JAVA

      - name: Compile helper dex
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p classes
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d classes $(find src -name '*.java')
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 23 --output out $(find classes -name '*.class')
          mv out/classes.dex out/hani-overlay-v420.dex
          ls -lh out/hani-overlay-v420.dex

      - uses: actions/upload-artifact@v4
        with:
          name: hani-overlay-v420
          path: out/hani-overlay-v420.dex
          retention-days: 1
