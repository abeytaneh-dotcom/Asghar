name: Patch Tehran GPS Move Pin
on:
  push:
    paths:
      - '.github/workflows/patch-tehran-gps-move-pin.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Make current-location button always move pin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          old="""function showGeo(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.max(1,Math.round(pos.coords.accuracy||99999));if(!bestGeo||acc<bestGeo.acc){bestGeo={lat,lng,acc};if(acc<=120){choose(lat,lng,acc,true);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:1,fillColor:'#64b5f6',fillOpacity:.13}).addTo(map);const msg=acc<=40?'✅ موقعیت دقیق پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر':'موقعیت قابل قبول پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر؛ چند ثانیه برای دقت بهتر صبر کنید.';st.className='locstatus ok';st.textContent=msg;}else{st.className='locstatus warn';st.textContent='⚠️ لوکیشن گوشی تقریبی است · دقت حدود '+acc.toLocaleString('fa-IR')+' متر. پین جابه‌جا نشد. «موقعیت دقیق» Chrome را فعال کنید یا محل تحویل را دستی روی نقشه انتخاب کنید.';}}if(bestGeo&&bestGeo.acc<=25)finishGeo();}"""
          new="""function showGeo(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.max(1,Math.round(pos.coords.accuracy||99999));if(!bestGeo||acc<bestGeo.acc){bestGeo={lat,lng,acc};choose(lat,lng,acc,true);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle([lat,lng],{radius:acc,color:acc<=120?'#1976d2':'#f39c12',weight:2,fillColor:acc<=120?'#64b5f6':'#ffd180',fillOpacity:.15}).addTo(map);const msg=acc<=40?'✅ موقعیت دقیق پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر':acc<=120?'موقعیت فعلی پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر؛ چند ثانیه برای دقت بهتر صبر کنید.':'⚠️ پین روی موقعیت گزارش‌شده گوشی رفت، اما دقت فقط حدود '+acc.toLocaleString('fa-IR')+' متر است. اگر نقطه درست نیست، پین را دستی جابه‌جا کنید یا «موقعیت دقیق» Chrome را فعال کنید.';st.className='locstatus '+(acc<=120?'ok':'warn');st.textContent=msg;}if(bestGeo&&bestGeo.acc<=25)finishGeo();}"""
          if old not in s:
              raise SystemExit('strict showGeo block not found')
          s=s.replace(old,new)
          old2="""if(bestGeo){if(bestGeo.acc>120){st.className='locstatus warn';st.textContent='⚠️ بهترین دقت فعلی '+bestGeo.acc.toLocaleString('fa-IR')+' متر است؛ برای جلوگیری از ثبت آدرس اشتباه، این موقعیت قبول نشد و پین جابه‌جا نشد. موقعیت دقیق Chrome را فعال کنید یا پین را دستی روی محل تحویل بگذارید.';}else{pending={lat:bestGeo.lat,lng:bestGeo.lng,acc:bestGeo.acc};st.className='locstatus ok';st.textContent='✅ بهترین موقعیت پیدا شد · دقت حدود '+bestGeo.acc.toLocaleString('fa-IR')+' متر. اگر درست است «ثبت این نقطه» را بزنید.';}}"""
          new2="""if(bestGeo){pending={lat:bestGeo.lat,lng:bestGeo.lng,acc:bestGeo.acc};if(bestGeo.acc>120){st.className='locstatus warn';st.textContent='⚠️ بهترین موقعیت گوشی با دقت حدود '+bestGeo.acc.toLocaleString('fa-IR')+' متر پیدا شد و پین روی آن قرار گرفت. اگر دقیق نیست، پین را دستی روی محل تحویل بگذارید؛ فقط با زدن «ثبت این نقطه» ذخیره می‌شود.';}else{st.className='locstatus ok';st.textContent='✅ بهترین موقعیت پیدا شد · دقت حدود '+bestGeo.acc.toLocaleString('fa-IR')+' متر. اگر درست است «ثبت این نقطه» را بزنید.';}}"""
          if old2 not in s:
              raise SystemExit('strict finishGeo block not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          git commit -m 'Move Tehran delivery pin on current location' || exit 0
          git push origin HEAD:websaza-hosting
