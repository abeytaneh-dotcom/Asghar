name: Build Hani Speaker Enroll v416
on:
  push:
    paths:
      - '.github/workflows/build-hani-speaker-enroll-v416.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src/ir/htaelec/haniassistant src/org/vosk out
          cat > src/ir/htaelec/haniassistant/SpeakerEnrollActivity.java <<'JAVA'
          package ir.htaelec.haniassistant;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.MediaRecorder;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.vosk.Model;
          import org.vosk.Recognizer;
          import org.vosk.SpeakerModel;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;

          public class SpeakerEnrollActivity extends Activity {
              private static final int REQ_MIC = 91;
              private static final int RATE = 16000;
              private final ArrayList<float[]> samples = new ArrayList<>();
              private volatile boolean recording = false;
              private volatile boolean stopRequested = false;
              private volatile boolean destroyed = false;
              private TextView status;
              private Button sample1;
              private Button sample2;
              private Button sample3;
              private Button clear;
              private Button activeButton;
              private int activeIndex = 0;
              private int pendingIndex = 0;
              private Button pendingButton;
              private AudioRecord audioRecord;
              private Model model;
              private SpeakerModel speakerModel;
              private Recognizer recognizer;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(22), dp(38), dp(22), dp(28));
                  root.setBackgroundColor(Color.rgb(7, 17, 22));
                  scroll.addView(root, new ScrollView.LayoutParams(-1, -2));

                  TextView title = new TextView(this);
                  title.setText("ثبت صدای صاحب گوشی");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  TextView hint = new TextView(this);
                  hint.setText("هر نمونه را جداگانه ضبط کن. روی «شروع ضبط» بزن، جمله را واضح بگو و سپس همان دکمه را برای «پایان و ذخیره» بزن:\n\n«های هانی، من صاحب این گوشی هستم و فقط به صدای من گوش کن»");
                  hint.setTextColor(Color.rgb(190, 215, 220));
                  hint.setTextSize(16);
                  hint.setGravity(Gravity.CENTER);
                  hint.setPadding(0, dp(22), 0, dp(16));
                  root.addView(hint, new LinearLayout.LayoutParams(-1, -2));

                  status = new TextView(this);
                  status.setText("آماده؛ نمونه ۱ را ضبط کن.");
                  status.setTextColor(Color.rgb(41, 230, 194));
                  status.setTextSize(16);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, dp(8), 0, dp(14));
                  root.addView(status, new LinearLayout.LayoutParams(-1, -2));

                  sample1 = makeButton("نمونه ۱ — شروع ضبط", true, 1);
                  sample2 = makeButton("نمونه ۲ — شروع ضبط", false, 2);
                  sample3 = makeButton("نمونه ۳ — شروع ضبط", false, 3);
                  root.addView(sample1);
                  root.addView(sample2);
                  root.addView(sample3);

                  clear = new Button(this);
                  clear.setText("حذف صدای ثبت‌شده و شروع دوباره");
                  clear.setTextSize(16);
                  clear.setAllCaps(false);
                  LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(-1, dp(58));
                  cp.setMargins(0, dp(16), 0, 0);
                  clear.setLayoutParams(cp);
                  clear.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { resetAll(); }
                  });
                  root.addView(clear);

                  setContentView(scroll);
              }

              private Button makeButton(String text, boolean enabled, final int index) {
                  final Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setEnabled(enabled);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(62));
                  lp.setMargins(0, dp(8), 0, 0);
                  b.setLayoutParams(lp);
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { onSampleClick(index, b); }
                  });
                  return b;
              }

              private void onSampleClick(int index, Button b) {
                  if (recording) {
                      if (b == activeButton) {
                          stopCurrent();
                      } else {
                          status.setText("اول ضبط نمونه فعلی را با دکمه «پایان و ذخیره» تمام کن.");
                      }
                      return;
                  }
                  if (index != samples.size() + 1) {
                      status.setText("نمونه‌ها را به ترتیب ۱، ۲ و ۳ ثبت کن.");
                      return;
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      pendingIndex = index;
                      pendingButton = b;
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                      return;
                  }
                  startCurrent(index, b);
              }

              private void startCurrent(final int index, final Button b) {
                  if (!ModelManager.isReady(this) || !ModelManager.isSpeakerReady(this)) {
                      status.setText("مدل تشخیص صدا آماده نیست. ابتدا از صفحه اصلی مدل آفلاین را آماده کن.");
                      return;
                  }

                  try {
                      if (HaniVoiceService.running) {
                          stopService(new Intent(this, HaniVoiceService.class));
                      }
                  } catch (Throwable ignored) {}

                  activeIndex = index;
                  activeButton = b;
                  stopRequested = false;
                  recording = true;
                  setButtonsDuringRecording(b);
                  b.setText("نمونه " + fa(index) + " — پایان و ذخیره");
                  status.setText("در حال آماده‌سازی میکروفون...");

                  new Thread(new Runnable() {
                      @Override public void run() { recordLoop(index, b); }
                  }, "hani-owner-sample-" + index).start();
              }

              private void recordLoop(final int index, final Button b) {
                  String error = null;
                  String finalJson = null;
                  AudioRecord rec = null;
                  Recognizer localRecognizer = null;
                  try {
                      Thread.sleep(450);

                      if (model == null) {
                          File md = ModelManager.modelDir(this);
                          model = new Model(md.getAbsolutePath());
                      }
                      if (speakerModel == null) {
                          File sd = ModelManager.speakerDir(this);
                          speakerModel = new SpeakerModel(sd.getAbsolutePath());
                      }

                      localRecognizer = new Recognizer(model, (float) RATE);
                      localRecognizer.setSpeakerModel(speakerModel);
                      localRecognizer.setMaxAlternatives(1);
                      recognizer = localRecognizer;

                      int min = AudioRecord.getMinBufferSize(RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      if (min < 2048) min = 2048;
                      int bufferBytes = min * 2;
                      rec = new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, RATE,
                              AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufferBytes);
                      audioRecord = rec;
                      if (rec.getState() != AudioRecord.STATE_INITIALIZED) {
                          throw new IllegalStateException("AudioRecord init failed");
                      }
                      rec.startRecording();
                      if (rec.getRecordingState() != AudioRecord.RECORDSTATE_RECORDING) {
                          throw new IllegalStateException("Microphone busy");
                      }

                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              if (!destroyed) status.setText("● در حال ضبط نمونه " + fa(index) + " — بعد از گفتن جمله «پایان و ذخیره» را بزن.");
                          }
                      });

                      short[] buf = new short[Math.max(1024, bufferBytes / 2)];
                      long started = System.currentTimeMillis();
                      while (!stopRequested && !destroyed) {
                          if (System.currentTimeMillis() - started >= 20000L) {
                              stopRequested = true;
                              break;
                          }
                          int n = rec.read(buf, 0, buf.length);
                          if (n > 0) {
                              localRecognizer.acceptWaveForm(buf, n);
                          } else if (n < 0) {
                              throw new IllegalStateException("Audio read failed: " + n);
                          }
                      }
                      finalJson = localRecognizer.getFinalResult();
                  } catch (Throwable t) {
                      error = t.getClass().getSimpleName() + ": " + (t.getMessage() == null ? "" : t.getMessage());
                  } finally {
                      try { if (rec != null && rec.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) rec.stop(); } catch (Throwable ignored) {}
                      try { if (rec != null) rec.release(); } catch (Throwable ignored) {}
                      audioRecord = null;
                      try { if (localRecognizer != null) localRecognizer.close(); } catch (Throwable ignored) {}
                      recognizer = null;
                      recording = false;
                  }

                  final String e = error;
                  final String j = finalJson;
                  runOnUiThread(new Runnable() {
                      @Override public void run() {
                          if (destroyed) return;
                          if (e != null) {
                              failCurrent("شروع یا ضبط میکروفون انجام نشد. دوباره امتحان کن.");
                          } else {
                              acceptSample(index, b, j);
                          }
                      }
                  });
              }

              private void stopCurrent() {
                  if (!recording) return;
                  stopRequested = true;
                  if (activeButton != null) {
                      activeButton.setEnabled(false);
                      activeButton.setText("نمونه " + fa(activeIndex) + " — در حال ذخیره...");
                  }
                  status.setText("ضبط تمام شد؛ در حال ذخیره نمونه...");
              }

              private void acceptSample(int index, Button b, String json) {
                  try {
                      if (json == null || json.trim().isEmpty()) {
                          failCurrent("نمونه صدا دریافت نشد؛ دوباره ضبط کن.");
                          return;
                      }
                      JSONObject o = new JSONObject(json);
                      JSONArray a = o.optJSONArray("spk");
                      int frames = o.optInt("spk_frames", 0);
                      if (a == null || a.length() == 0 || frames < 30) {
                          failCurrent("صدا کافی نبود؛ حداقل ۳ ثانیه واضح صحبت کن و دوباره ذخیره کن.");
                          return;
                      }
                      float[] v = new float[a.length()];
                      for (int i = 0; i < v.length; i++) v[i] = (float) a.optDouble(i, 0d);

                      if (!samples.isEmpty() && SpeakerProfile.similarity(samples.get(0), v) < 0.35f) {
                          failCurrent("این نمونه با نمونه اول هماهنگ نبود؛ همین نمونه را دوباره ضبط کن.");
                          return;
                      }

                      samples.add(v);
                      b.setText("✓ نمونه " + fa(index) + " ثبت شد");
                      b.setEnabled(false);

                      if (samples.size() >= 3) {
                          float[] avg = SpeakerProfile.average(samples);
                          if (avg == null || avg.length == 0) {
                              failCurrent("ساخت پروفایل صدا کامل نشد؛ دوباره نمونه سوم را ضبط کن.");
                              return;
                          }
                          SpeakerProfile.save(this, avg);
                          sample1.setEnabled(false);
                          sample2.setEnabled(false);
                          sample3.setEnabled(false);
                          status.setText("✓ هر ۳ نمونه ثبت شد و صدای صاحب گوشی ذخیره شد.");
                          activeButton = null;
                          activeIndex = 0;
                          return;
                      }

                      int next = samples.size() + 1;
                      Button nb = next == 2 ? sample2 : sample3;
                      nb.setEnabled(true);
                      status.setText("✓ نمونه " + fa(index) + " ذخیره شد. حالا نمونه " + fa(next) + " را ضبط کن.");
                      activeButton = null;
                      activeIndex = 0;
                  } catch (Throwable t) {
                      failCurrent("پردازش نمونه کامل نشد؛ همین نمونه را دوباره ضبط کن.");
                  }
              }

              private void failCurrent(String message) {
                  recording = false;
                  stopRequested = true;
                  if (activeButton != null) {
                      activeButton.setText("نمونه " + fa(activeIndex) + " — شروع ضبط");
                      activeButton.setEnabled(true);
                  }
                  sample1.setEnabled(samples.size() == 0);
                  sample2.setEnabled(samples.size() == 1);
                  sample3.setEnabled(samples.size() == 2);
                  status.setText(message);
              }

              private void setButtonsDuringRecording(Button keep) {
                  sample1.setEnabled(sample1 == keep);
                  sample2.setEnabled(sample2 == keep);
                  sample3.setEnabled(sample3 == keep);
                  clear.setEnabled(false);
              }

              private void resetAll() {
                  stopRequested = true;
                  recording = false;
                  try {
                      AudioRecord r = audioRecord;
                      if (r != null && r.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) r.stop();
                  } catch (Throwable ignored) {}
                  samples.clear();
                  SpeakerProfile.clear(this);
                  activeButton = null;
                  activeIndex = 0;
                  sample1.setText("نمونه ۱ — شروع ضبط");
                  sample2.setText("نمونه ۲ — شروع ضبط");
                  sample3.setText("نمونه ۳ — شروع ضبط");
                  sample1.setEnabled(true);
                  sample2.setEnabled(false);
                  sample3.setEnabled(false);
                  clear.setEnabled(true);
                  status.setText("صدای قبلی حذف شد؛ از نمونه ۱ شروع کن.");
              }

              private String fa(int x) {
                  if (x == 1) return "۱";
                  if (x == 2) return "۲";
                  if (x == 3) return "۳";
                  return String.valueOf(x);
              }

              private int dp(int x) {
                  return (int) (x * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_MIC && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      if (pendingButton != null && pendingIndex > 0) startCurrent(pendingIndex, pendingButton);
                  } else if (requestCode == REQ_MIC) {
                      status.setText("برای ضبط نمونه، دسترسی میکروفون باید فعال باشد.");
                  }
                  pendingButton = null;
                  pendingIndex = 0;
              }

              @Override
              protected void onDestroy() {
                  destroyed = true;
                  stopRequested = true;
                  recording = false;
                  try {
                      AudioRecord r = audioRecord;
                      if (r != null && r.getRecordingState() == AudioRecord.RECORDSTATE_RECORDING) r.stop();
                  } catch (Throwable ignored) {}
                  super.onDestroy();
              }
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/ModelManager.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.content.Context;
          import java.io.File;
          public final class ModelManager {
            public static boolean isReady(Context c){return false;}
            public static boolean isSpeakerReady(Context c){return false;}
            public static File modelDir(Context c){return null;}
            public static File speakerDir(Context c){return null;}
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/SpeakerProfile.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.content.Context;
          import java.util.List;
          public final class SpeakerProfile {
            public static void clear(Context c){}
            public static void save(Context c,float[] v){}
            public static float[] average(List<float[]> v){return null;}
            public static float similarity(float[] a,float[] b){return 0;}
          }
          JAVA

          cat > src/ir/htaelec/haniassistant/HaniVoiceService.java <<'JAVA'
          package ir.htaelec.haniassistant;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;
          public class HaniVoiceService extends Service {
            public static boolean running=false;
            @Override public IBinder onBind(Intent i){return null;}
          }
          JAVA

          cat > src/org/vosk/Model.java <<'JAVA'
          package org.vosk;
          public class Model { public Model(String p){} public void close(){} }
          JAVA
          cat > src/org/vosk/SpeakerModel.java <<'JAVA'
          package org.vosk;
          public class SpeakerModel { public SpeakerModel(String p){} public void close(){} }
          JAVA
          cat > src/org/vosk/Recognizer.java <<'JAVA'
          package org.vosk;
          public class Recognizer {
            public Recognizer(Model m,float r){}
            public void setSpeakerModel(SpeakerModel m){}
            public void setMaxAlternatives(int x){}
            public boolean acceptWaveForm(short[] b,int n){return false;}
            public String getFinalResult(){return "";}
            public void close(){}
          }
          JAVA

      - name: Compile only replacement activity
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p classes stubclasses replacement
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d classes $(find src -name '*.java')
          cp classes/ir/htaelec/haniassistant/SpeakerEnrollActivity*.class replacement/
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 23 --output out replacement/*.class
          cp out/classes.dex out/speaker-enroll-v416.dex
          ls -lh out/speaker-enroll-v416.dex

      - uses: actions/upload-artifact@v4
        with:
          name: hani-speaker-enroll-v416
          path: out/speaker-enroll-v416.dex
          retention-days: 1
