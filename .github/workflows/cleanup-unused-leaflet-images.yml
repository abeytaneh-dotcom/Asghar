name: Cleanup unused Leaflet images
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/cleanup-unused-leaflet-images.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Remove unused binary assets
        run: |
          rm -rf TehranSupermarket/assets/leaflet/images
          rm -f .github/workflows/cleanup-unused-leaflet-images.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove unused Leaflet image assets"
          git push origin HEAD:websaza-hosting
