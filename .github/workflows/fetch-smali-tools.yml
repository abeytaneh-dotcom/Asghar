name: Fetch Smali Tools
on:
  push:
    paths:
      - '.github/workflows/fetch-smali-tools.yml'
  workflow_dispatch:
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download smali tools
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 3 -o out/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          curl -fL --retry 3 -o out/smali.jar https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: smali-tools
          path: out/
          retention-days: 1
