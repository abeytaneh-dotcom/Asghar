name: Ensure IranPayamak After Portal Deploy

"on":
  workflow_run:
    workflows:
      - "Deploy Namayandegi Portal"
    types:
      - completed

jobs:
  ensure-sms:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'websaza-hosting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal branch
        uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Build official IranPayamak adapter
        run: |
          set -euo pipefail
          python3 WebSaza/namayandegi/iranpayamak-api-v1.py
          php -l WebSaza/namayandegi/_security.php
          grep -F 'api.iranpayamak.com/ws/v1/sms/pattern' WebSaza/namayandegi/_security.php >/dev/null
          grep -F 'api.iranpayamak.com/ws/v1/sms/simple' WebSaza/namayandegi/_security.php >/dev/null
      - name: Upload official SMS adapter
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          response=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode "dir=public_html/namayandegi" \
            --data-urlencode "file=_security.php" \
            --data-urlencode "content@WebSaza/namayandegi/_security.php" \
            "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
          echo "$response" | jq -e '.status == 1' >/dev/null
      - name: Verify portal remains live
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://websaza.ir/namayandegi/?admin=1&recover=1' >/dev/null
