name: Add Search Console DNS verification

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/add-search-console-dns.yml'

jobs:
  add-dns-record:
    runs-on: ubuntu-latest
    steps:
      - name: Add TXT record in cPanel DNS
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}" \
            --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=ZoneEdit" \
            --data-urlencode "cpanel_jsonapi_func=add_zone_record" \
            --data-urlencode "domain=websaza.ir" \
            --data-urlencode "name=websaza.ir" \
            --data-urlencode "type=TXT" \
            --data-urlencode "txtdata=google-site-verification=2BdJrPdpS0ySBc-TgvygJF9cneqt-kD8k-PbCWusJrE" \
            --data-urlencode "ttl=14400" \
            --data-urlencode "class=IN" \
            "https://mch4444.dnsuserver.com:2083/json-api/cpanel")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.cpanelresult.data[0].result.status == 1 or .cpanelresult.event.result == 1' >/dev/null

      - name: Check authoritative DNS
        shell: bash
        run: |
          set -euo pipefail
          for ns in ns44.dnsuserver.com ns45.dnsuserver.com; do
            echo "Checking $ns"
            dig +short TXT websaza.ir @$ns || true
          done
