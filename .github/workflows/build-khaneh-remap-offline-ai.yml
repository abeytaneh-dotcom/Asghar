name: Build Khaneh Remap Offline AI

on:
  push:
    paths:
      - "KhanehRemapOfflineAI/**"
      - ".github/workflows/build-khaneh-remap-offline-ai.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: KhanehRemapOfflineAI
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp KhanehRemapOfflineAI/app/build/outputs/apk/debug/app-debug.apk dist/KhanehRemap-Offline-AI-v1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-Offline-AI-v1
          path: dist/KhanehRemap-Offline-AI-v1.apk
          if-no-files-found: error
