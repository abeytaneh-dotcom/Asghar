name: Inspect SMS Provider Result

"on":
  push:
    branches:
      - websaza-hosting
    paths:
      - ".github/workflows/inspect-sms-provider.yml"
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read last SMS provider result
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          r=$(curl --fail-with-body --silent --show-error -G -H "$auth" \
            --data-urlencode "dir=public_html/namayandegi/_data" \
            --data-urlencode "file=sms_last_provider.json" \
            "https://mch4444.dnsuserver.com:2083/execute/Fileman/get_file_content")
          echo "$r" | jq '{status,errors,messages,data}'
