name: Seed Tehran Supermarket Catalog v2

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/seed-tehran-catalog-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting

      - name: Validate safe storefront
        shell: bash
        run: |
          set -euo pipefail
          php -l TehranSupermarket/index.php
          grep -Fq 'قیمت در حال ثبت' TehranSupermarket/index.php
          grep -Fq "(int)\$p['price']>0" TehranSupermarket/index.php

      - name: Build one-time catalog seeder
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" > "$RUNNER_TEMP/seed-key"
          cat > "$RUNNER_TEMP/seed_products.php" <<'PHP'
          <?php
          declare(strict_types=1);
          set_time_limit(180);
          header('Content-Type: application/json; charset=utf-8');
          $expected='__SEED_KEY__';
          if(!hash_equals($expected,(string)($_GET['k']??''))){http_response_code(403);echo json_encode(['ok'=>false]);exit;}
          $cfg=require __DIR__.'/config.php';
          $pdo=new PDO('mysql:host='.$cfg['db_host'].';dbname='.$cfg['db_name'].';charset=utf8mb4',$cfg['db_user'],$cfg['db_pass'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          require_once __DIR__.'/schema.php'; ensure_product_schema($pdo);

          function get_url(string $url): string {
            $ch=curl_init($url);
            curl_setopt_array($ch,[
              CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>true,CURLOPT_MAXREDIRS=>4,
              CURLOPT_CONNECTTIMEOUT=>8,CURLOPT_TIMEOUT=>22,CURLOPT_ENCODING=>'',
              CURLOPT_USERAGENT=>'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36',
              CURLOPT_SSL_VERIFYPEER=>true
            ]);
            $body=curl_exec($ch);$code=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);curl_close($ch);
            return ($body!==false&&$code>=200&&$code<400)?(string)$body:'';
          }
          function hrefs(string $html,string $base): array {
            preg_match_all('/href=[\"\']([^\"\']+)[\"\']/iu',$html,$m);$out=[];
            foreach($m[1]??[] as $h){
              $h=html_entity_decode($h,ENT_QUOTES|ENT_HTML5,'UTF-8');
              if(str_starts_with($h,'/'))$h=rtrim($base,'/').$h;
              if(str_starts_with($h,$base.'/product/')){$h=preg_replace('/[?#].*$/','',$h);$out[]=$h;}
            }
            return array_values(array_unique($out));
          }
          function meta(string $html,string $property): string {
            $q=preg_quote($property,'/');
            if(preg_match('/<meta[^>]+(?:property|name)=[\"\']'.$q.'[\"\'][^>]+content=[\"\']([^\"\']*)[\"\'][^>]*>/iu',$html,$m))return html_entity_decode($m[1],ENT_QUOTES|ENT_HTML5,'UTF-8');
            if(preg_match('/<meta[^>]+content=[\"\']([^\"\']*)[\"\'][^>]+(?:property|name)=[\"\']'.$q.'[\"\'][^>]*>/iu',$html,$m))return html_entity_decode($m[1],ENT_QUOTES|ENT_HTML5,'UTF-8');
            return '';
          }
          function product_name(string $html): string {
            $t=meta($html,'og:title');
            if($t===''){if(preg_match('/<title[^>]*>(.*?)<\/title>/isu',$html,$m))$t=html_entity_decode(strip_tags($m[1]),ENT_QUOTES|ENT_HTML5,'UTF-8');}
            $t=preg_replace('/^خرید\s+و\s+قیمت\s+/u','',$t);
            $t=preg_replace('/\s*\|\s*اکالا\s*$/u','',$t);
            return trim(preg_replace('/\s+/u',' ',$t));
          }
          function quantity_from_name(string $name): ?string {
            if(preg_match('/(\d+(?:[\.،]\d+)?\s*(?:کیلوگرم(?:ی)?|گرم(?:ی)?|میلی\s*لیتر(?:ی)?|لیتر(?:ی)?|سی\s*سی|عدد(?:ی)?|برگ|مثقال))/u',$name,$m))return trim($m[1]);
            return null;
          }
          function brand_from_name(string $name): ?string {
            $known=['کاله','میهن','مزمز','چی توز','چی‌توز','زمزم','سن ایچ','سن‌ایچ','عالیس','گلستان','اویلا','فامیلا','نودیلند','مینو','پیک','بدر','فیروز','فولیکا','مای','داو','رافونه','دورتو','مانا','کامبیز','آبعلی','سحرخیز','ناصر','کالین'];
            foreach($known as $b){if(mb_strpos($name,$b)!==false)return $b;}
            return null;
          }
          $browse=[
            'refreshments'=>'تنقلات و شیرینی','groceries'=>'مواد غذایی','dairy-products'=>'لبنیات و صبحانه',
            'beverages'=>'نوشیدنی','spices'=>'مواد غذایی','home-hygiene'=>'خانه و شوینده',
            'canned-ready-food'=>'کنسرو و غذای آماده','cosmetics-hygiene'=>'بهداشت شخصی',
            'proteins'=>'گوشت و مرغ','breakfast-goods'=>'لبنیات و صبحانه','home-stuff'=>'خانه و شوینده',
            'baby-mother-care'=>'کودک','fruits-vegetables'=>'میوه و سبزی','nuts-sweets'=>'تنقلات و شیرینی',
            'fresh-bread'=>'مواد غذایی'
          ];
          $cache=__DIR__.'/storage/seed_links_v2.json';$items=[];
          if(is_file($cache)){$tmp=json_decode((string)file_get_contents($cache),true);if(is_array($tmp))$items=$tmp;}
          if(!$items){
            $seen=[];
            foreach($browse as $slug=>$cat){
              $html=get_url('https://www.okala.com/browse/'.$slug);
              foreach(hrefs($html,'https://www.okala.com') as $u){
                if(preg_match('#/product/(\d+)/#',$u,$mm)){$key=$mm[1];if(!isset($seen[$key])){$seen[$key]=1;$items[]=['url'=>$u,'category'=>$cat];}}
              }
            }
            if(!is_dir(__DIR__.'/storage'))@mkdir(__DIR__.'/storage',0755,true);
            file_put_contents($cache,json_encode($items,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          }

          // The user explicitly requested stock 10 for all products for now.
          $pdo->exec('UPDATE products SET stock=10');
          $offset=max(0,(int)($_GET['offset']??0));$limit=max(1,min(25,(int)($_GET['limit']??15)));
          $slice=array_slice($items,$offset,$limit);
          $find=$pdo->prepare('SELECT id,price,barcode,image_path,brand,quantity_label FROM products WHERE name=? LIMIT 1');
          $insert=$pdo->prepare('INSERT INTO products(name,barcode,brand,quantity_label,category,image_path,image_source,price,stock,active,created_at,updated_at) VALUES(?,NULL,?,?,?,?,?,0,10,1,NOW(),NOW())');
          $update=$pdo->prepare("UPDATE products SET stock=10,category=?,brand=COALESCE(NULLIF(brand,''),?),quantity_label=COALESCE(NULLIF(quantity_label,''),?),image_path=CASE WHEN image_path IS NULL OR image_path='' THEN ? ELSE image_path END,image_source=COALESCE(NULLIF(image_source,''),?),active=1,updated_at=NOW() WHERE id=?");
          $added=0;$updated=0;$failed=[];
          foreach($slice as $row){
            $html=get_url($row['url']);if($html===''){$failed[]=$row['url'];continue;}
            $name=product_name($html);$img=meta($html,'og:image');
            if($name===''||$img===''){$failed[]=$row['url'];continue;}
            $qty=quantity_from_name($name);$brand=brand_from_name($name);
            $find->execute([$name]);$old=$find->fetch();
            if($old){$update->execute([$row['category'],$brand,$qty,$img,$row['url'],$old['id']]);$updated++;}
            else{$insert->execute([$name,$brand,$qty,$row['category'],$img,$row['url']]);$added++;}
          }
          $count=(int)$pdo->query('SELECT COUNT(*) FROM products')->fetchColumn();
          $withImages=(int)$pdo->query("SELECT COUNT(*) FROM products WHERE image_path IS NOT NULL AND image_path<>''")->fetchColumn();
          $stock10=(int)$pdo->query('SELECT COUNT(*) FROM products WHERE stock=10')->fetchColumn();
          echo json_encode(['ok'=>true,'links'=>count($items),'offset'=>$offset,'processed'=>count($slice),'added'=>$added,'updated'=>$updated,'failed'=>count($failed),'products'=>$count,'with_images'=>$withImages,'stock_10'=>$stock10],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          python3 - <<'PY'
          import os
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP'])
          key=(rt/'seed-key').read_text()
          p=rt/'seed_products.php'
          p.write_text(p.read_text().replace('__SEED_KEY__',key),encoding='utf-8')
          PY
          php -l "$RUNNER_TEMP/seed_products.php"

      - name: Upload safe storefront and seeder
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          save(){
            local src="$1" file="$2" out="$RUNNER_TEMP/save.json"
            curl -sS --fail-with-body -H "$AUTH" --request POST \
              --data-urlencode "dir=${TARGET_DIR}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          save TehranSupermarket/index.php index.php
          save "$RUNNER_TEMP/seed_products.php" seed_products.php

      - name: Seed every discovered product in batches
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat "$RUNNER_TEMP/seed-key")"; echo "::add-mask::$KEY"
          : > "$RUNNER_TEMP/seed-results.txt"
          off=0; batch=15; max=300
          while [ "$off" -lt "$max" ]; do
            RES=$(curl -sS --fail-with-body --max-time 180 "${PUBLIC_URL}/seed_products.php?k=${KEY}&offset=${off}&limit=${batch}")
            echo "$RES" | tee -a "$RUNNER_TEMP/seed-results.txt"
            echo "$RES" | jq -e '.ok == true' >/dev/null
            LINKS=$(echo "$RES" | jq -r '.links')
            PROCESSED=$(echo "$RES" | jq -r '.processed')
            if [ "$PROCESSED" -eq 0 ]; then break; fi
            off=$((off+batch))
            if [ "$off" -ge "$LINKS" ]; then break; fi
          done
          LAST=$(tail -n 1 "$RUNNER_TEMP/seed-results.txt")
          echo "FINAL=$LAST"
          echo "$LAST" | jq -e '.products > 0 and .with_images > 0 and .stock_10 == .products' >/dev/null

      - name: Disable seeder and verify live store
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          printf '%s\n' "<?php http_response_code(404); exit('Not found');" > "$RUNNER_TEMP/seed-disabled.php"
          OUT="$RUNNER_TEMP/lock.json"
          curl -sS --fail-with-body -H "$AUTH" --request POST \
            --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'file=seed_products.php' \
            --data-urlencode "content@$RUNNER_TEMP/seed-disabled.php" \
            "${BASE}/execute/Fileman/save_file_content" -o "$OUT"
          test "$(jq -r '.result.status // .status // 0' "$OUT")" = '1'
          CODE=$(curl -sS -L --max-time 30 -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "${PUBLIC_URL}/")
          test "$CODE" = '200'
          grep -Fq 'محصولات فروشگاه' "$RUNNER_TEMP/home.html"
          grep -Eq 'قیمت در حال ثبت|تومان' "$RUNNER_TEMP/home.html"
          SEEDCODE=$(curl -sS -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/seed_products.php")
          test "$SEEDCODE" = '404'
          echo 'CATALOG_SEED_V2_DONE=1'

      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tehran-catalog-seed-v2-${{ github.run_number }}
          path: ${{ runner.temp }}/seed-results.txt
          if-no-files-found: ignore
          retention-days: 2
