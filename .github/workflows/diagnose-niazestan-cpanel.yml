name: Diagnose Niazestan cPanel access

on:
  push:
    branches: [niazestan-cloud]
    paths:
      - '.github/workflows/diagnose-niazestan-cpanel.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
    steps:
      - name: Check available cPanel APIs
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        shell: bash
        run: |
          set -u
          test -n "$CPANEL_TOKEN" || { echo 'Token secret is empty'; exit 1; }
          auth="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"

          echo '--- UAPI DomainInfo/list_domains ---'
          curl --silent --show-error -H "$auth" \
            "https://${CPANEL_HOST}:2083/execute/DomainInfo/list_domains" | jq '.' || true

          echo '--- API2 AddonDomain/listaddondomains ---'
          curl --silent --show-error -H "$auth" --get \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=AddonDomain" \
            --data-urlencode "cpanel_jsonapi_func=listaddondomains" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel" | jq '.' || true

          echo '--- UAPI Fileman/get_file_information ---'
          curl --silent --show-error -H "$auth" --get \
            --data-urlencode "path=public_html" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/get_file_information" | jq '.' || true
