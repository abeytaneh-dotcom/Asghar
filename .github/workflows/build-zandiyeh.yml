name: Build Zandiyeh Accounting APK

on:
  push:
    branches:
      - build/zandiyeh-accounting-20261025
    paths:
      - '.github/workflows/build-zandiyeh.yml'
      - 'zandiyeh_payload/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct and patch project
        shell: bash
        run: |
          mkdir -p zandiyeh-src
          cat zandiyeh_payload/part00 zandiyeh_payload/part01 zandiyeh_payload/part02 zandiyeh_payload/part03_05 zandiyeh_payload/part06_08 zandiyeh_payload/part09_12 | base64 -d > /tmp/zandiyeh.zip
          unzip -q /tmp/zandiyeh.zip -d zandiyeh-src
          python - <<'PY'
          from pathlib import Path
          p=Path('zandiyeh-src/app/build.gradle')
          s=p.read_text()
          s=s.replace("applicationId 'ir.zandiyeh.accounting'", "applicationId 'ir.zandiyeh.accounting.v2'")
          s=s.replace('minSdk 29','minSdk 24')
          s=s.replace('targetSdk 35','targetSdk 33')
          s=s.replace('JavaVersion.VERSION_17','JavaVersion.VERSION_1_8')
          p.write_text(s)
          m=Path('zandiyeh-src/app/src/main/AndroidManifest.xml')
          s=m.read_text().replace('android:fullBackupContent="true"\n        ','')
          for name in ['ReportsActivity','LedgerActivity','PendingActivity','CardsActivity','AddTransactionActivity','MainActivity','SmsReceiver']:
              s=s.replace(f'android:name=".{name}"', f'android:name="ir.zandiyeh.accounting.{name}"')
          m.write_text(s)
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build APK
        working-directory: zandiyeh-src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare and verify APK
        shell: bash
        run: |
          cp zandiyeh-src/app/build/outputs/apk/debug/app-debug.apk Zandiyeh-Accounting-Fixed.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs Zandiyeh-Accounting-Fixed.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging Zandiyeh-Accounting-Fixed.apk | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: Zandiyeh-Accounting-Fixed-APK
          path: Zandiyeh-Accounting-Fixed.apk
          if-no-files-found: error
