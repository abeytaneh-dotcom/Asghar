name: Build Zandiyeh Accounting APK

on:
  push:
    branches:
      - build/zandiyeh-accounting-20261025
    paths:
      - '.github/workflows/build-zandiyeh.yml'
      - 'zandiyeh_payload/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct project
        shell: bash
        run: |
          mkdir -p zandiyeh-src
          cat zandiyeh_payload/part00 zandiyeh_payload/part01 zandiyeh_payload/part02 zandiyeh_payload/part03_05 zandiyeh_payload/part06_08 zandiyeh_payload/part09_12 | base64 -d > /tmp/zandiyeh.zip
          unzip -q /tmp/zandiyeh.zip -d zandiyeh-src

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build APK
        working-directory: zandiyeh-src
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp zandiyeh-src/app/build/outputs/apk/debug/app-debug.apk Zandiyeh-Accounting.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zandiyeh-Accounting-APK
          path: Zandiyeh-Accounting.apk
          if-no-files-found: error
