# Tehran production deploy + storefront smoke tests
name: Deploy Tehran Supermarket

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'TehranSupermarket/**'
      - '.github/workflows/deploy-tehran.yml'
  workflow_dispatch:

concurrency:
  group: deploy-tehran-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CPANEL_TOKEN:-}"
          find TehranSupermarket -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find TehranSupermarket/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check TehranSupermarket/sw.js
          test -s TehranSupermarket/error_bootstrap.php
          test -s TehranSupermarket/error.php
          test -s TehranSupermarket/assets/leaflet/leaflet.js
          test -s TehranSupermarket/assets/leaflet/leaflet.css
          test -s TehranSupermarket/assets/server_storefront_critical_v1.css
          test -s TehranSupermarket/assets/tehran_premium_mobile_v5.css
          test -s TehranSupermarket/assets/tehran-storefront-v2.svg
          grep -Fq 'Tehran Market premium mobile storefront v5' TehranSupermarket/assets/tehran_premium_mobile_v5.css
          grep -Fq 'طهران مارکت' TehranSupermarket/assets/tehran-storefront-v2.svg
          ! grep -RniE 'console\.error\(' TehranSupermarket/assets --include='*.js'

      - name: Ensure all target directories
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          mkdir_cp(){
            local parent="$1" name="$2" out="$RUNNER_TEMP/mkdir.json"
            curl -sS --connect-timeout 15 --max-time 60 -H "$AUTH" -H 'Content-Type: application/x-www-form-urlencoded' --request POST \
              --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" --data-urlencode 'cpanel_jsonapi_apiversion=2' \
              --data-urlencode 'cpanel_jsonapi_module=Fileman' --data-urlencode 'cpanel_jsonapi_func=mkdir' \
              --data-urlencode "path=${parent}" --data-urlencode "name=${name}" --data-urlencode 'permissions=0755' \
              "${BASE}/json-api/cpanel" -o "$out" || true
          }
          ROOT="/home/${CPANEL_USER}/public_html"
          mkdir_cp "$ROOT" tehran
          # Mirror every source directory so nested legacy/assets directories can never abort a deploy.
          while IFS= read -r srcdir; do
            rel="${srcdir#TehranSupermarket/}"
            [ "$srcdir" = 'TehranSupermarket' ] && continue
            parent_rel="$(dirname "$rel")"
            name="$(basename "$rel")"
            parent="$ROOT/tehran"
            [ "$parent_rel" = '.' ] || parent="$ROOT/tehran/$parent_rel"
            echo "Ensuring directory: tehran/$rel"
            mkdir_cp "$parent" "$name"
          done < <(find TehranSupermarket -mindepth 1 -type d | awk '{ print gsub("/","/"), $0 }' | sort -n -k1,1 | cut -d' ' -f2-)
          mkdir_cp "$ROOT/tehran" storage
          mkdir_cp "$ROOT/tehran" uploads
          mkdir_cp "$ROOT/tehran/uploads" products
          VERIFY="$RUNNER_TEMP/verify.json"
          curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --get \
            --data-urlencode 'dir=public_html/tehran' --data-urlencode 'show_hidden=1' \
            "${BASE}/execute/Fileman/list_files" -o "$VERIFY"
          test "$(jq -r '.result.status // .status // 0' "$VERIFY")" = '1'

      - name: Upload application updates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          save_file(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save-${file//[^A-Za-z0-9._-]/_}.json" attempt status
            for attempt in 1 2 3; do
              echo "Uploading ${src#TehranSupermarket/} (attempt $attempt/3)"
              rm -f "$out"
              if curl -sS --fail-with-body --connect-timeout 15 --max-time 120 -H "$AUTH" --request POST \
                --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
                "${BASE}/execute/Fileman/save_file_content" -o "$out"; then
                status="$(jq -r '.result.status // .status // 0' "$out" 2>/dev/null || echo 0)"
                if [ "$status" = '1' ]; then return 0; fi
              fi
              echo "Upload failed for ${src#TehranSupermarket/}"
              cat "$out" 2>/dev/null | jq -c '{status:(.result.status // .status),errors:(.result.errors // .errors),messages:(.result.messages // .messages)}' 2>/dev/null || cat "$out" 2>/dev/null || true
              sleep $((attempt * 2))
            done
            echo "FATAL: unable to upload ${src#TehranSupermarket/} after 3 attempts"
            return 1
          }
          upload_rel(){
            local rel="$1" src="TehranSupermarket/$1" sub file dir
            sub="$(dirname "$rel")"; file="$(basename "$rel")"; dir="$TARGET_DIR"; [ "$sub" = '.' ] || dir="$TARGET_DIR/$sub"
            save_file "$src" "$dir" "$file"
          }

          # Put the storefront-critical files on the host first.
          upload_rel '.htaccess'
          upload_rel 'assets/server_storefront_critical_v1.css'
          upload_rel 'assets/tehran_premium_mobile_v5.css'
          upload_rel 'assets/tehran-storefront-v2.svg'
          upload_rel 'assets/server_mobile_nav_v1.css'
          upload_rel 'assets/server_mobile_nav_v1.js'

          # Then update the complete text application. Critical files above may safely be repeated.
          while IFS= read -r -d '' src; do
            rel="${src#TehranSupermarket/}"; [ "$rel" = 'install.php' ] && continue
            case "${rel,,}" in
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.zip|*.rar|*.pdf)
                echo "Skipping binary asset in text uploader: $rel"
                continue
                ;;
            esac
            sub="$(dirname "$rel")"; file="$(basename "$rel")"; dir="$TARGET_DIR"; [ "$sub" = '.' ] || dir="$TARGET_DIR/$sub"
            save_file "$src" "$dir" "$file"
          done < <(find TehranSupermarket -type f -print0)

      - name: Verify production premium storefront and safe errors
        shell: bash
        run: |
          set -euo pipefail
          get(){ local url="$1" out="$2"; curl -sS -L --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o "$out" -w '%{http_code}' "$url"; }
          HCODE=$(get "${PUBLIC_URL}/?ui=20261027-5" "$RUNNER_TEMP/home.html")
          MCSS=$(get "${PUBLIC_URL}/assets/tehran_premium_mobile_v5.css?v=20261027-5" "$RUNNER_TEMP/mobile.css")
          SCSS=$(get "${PUBLIC_URL}/assets/server_storefront_critical_v1.css?v=20261027-5" "$RUNNER_TEMP/storefront.css")
          SVGCODE=$(get "${PUBLIC_URL}/assets/tehran-storefront-v2.svg?v=20261027-5" "$RUNNER_TEMP/storefront.svg")
          ACODE=$(get "${PUBLIC_URL}/admin.php" "$RUNNER_TEMP/admin.html")
          TCODE=$(get "${PUBLIC_URL}/track.php" "$RUNNER_TEMP/track.html")
          ICODE=$(get "${PUBLIC_URL}/install.php" "$RUNNER_TEMP/installer.html")
          NFCODE=$(get "${PUBLIC_URL}/__safe_error_probe_missing_404" "$RUNNER_TEMP/404.html")
          echo "HTTP home=$HCODE mobile_css=$MCSS storefront_css=$SCSS storefront_svg=$SVGCODE admin=$ACODE track=$TCODE installer=$ICODE missing=$NFCODE"
          test "$HCODE" = '200'
          test "$MCSS" = '200'
          test "$SCSS" = '200'
          test "$SVGCODE" = '200'
          test "$ACODE" = '200'
          test "$TCODE" = '200'
          test "$ICODE" = '403'
          test "$NFCODE" = '404'
          grep -Fq 'طهران مارکت' "$RUNNER_TEMP/home.html"
          grep -Fq 'اولین فروشگاه' "$RUNNER_TEMP/home.html"
          grep -Fq 'tehran_premium_mobile_v5.css?v=20261027-5' "$RUNNER_TEMP/home.html"
          grep -Fq 'Tehran Market premium mobile storefront v5' "$RUNNER_TEMP/mobile.css"
          grep -Fq 'Tehran Market server storefront v4' "$RUNNER_TEMP/storefront.css"
          grep -Fq 'طهران مارکت' "$RUNNER_TEMP/storefront.svg"
          grep -Fq 'HTTP-403' "$RUNNER_TEMP/installer.html"
          grep -Fq 'HTTP-404' "$RUNNER_TEMP/404.html"
          ! grep -Eiq 'SQLSTATE|Stack trace|Fatal error|Uncaught|/home/|PDOException|mysqli|vendor/' "$RUNNER_TEMP/installer.html" "$RUNNER_TEMP/404.html"
          echo "DEPLOY_OK premium_mobile_v5=live matte_black_storefront=live legacy_visual_autodeploy=disabled"
