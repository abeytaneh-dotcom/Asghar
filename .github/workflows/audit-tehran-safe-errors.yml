# frontend + backend error-surface audit
name: Audit Tehran Safe Errors
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/audit-tehran-safe-errors.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Scan error surfaces
        shell: bash
        run: |
          echo '=== PHP raw exception/detail surfaces ==='
          grep -RniE 'getMessage\(|->getMessage|\$e->|\$x->' TehranSupermarket --include='*.php' || true
          echo '=== PHP direct error exits ==='
          grep -RniE "exit\(|die\(|'error'=>|\"error\"=>|http_response_code\((4|5)" TehranSupermarket --include='*.php' || true
          echo '=== JS raw exception surfaces ==='
          grep -RniE '(^|[^A-Za-z])(err|error|e)\.message|console\.error|alert\(|throw new Error|\.catch\(' TehranSupermarket/assets TehranSupermarket --include='*.js' --include='*.php' || true
