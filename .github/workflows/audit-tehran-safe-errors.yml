name: Audit Tehran Safe Errors
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/audit-tehran-safe-errors.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Probe safe error tokens only
        shell: bash
        run: |
          set -u
          BASE='https://websaza.ir/tehran'
          probe(){
            local name="$1" url="$2" expected="$3" out="/tmp/$1.out"
            code=$(curl -sS -L --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)
            if grep -Eq "$expected" "$out"; then token=yes; else token=no; fi
            if grep -Eiq 'SQLSTATE|Stack trace|Fatal error|Uncaught|/home/|PDOException|mysqli|vendor/' "$out"; then leak=yes; else leak=no; fi
            echo "$name http=$code safe_token=$token technical_leak=$leak"
          }
          probe installer "$BASE/install.php" 'HTTP-403'
          probe missing "$BASE/__safe_error_probe_missing_404" 'HTTP-404'
          probe sync "$BASE/pyramid_api.php?action=status" 'SYNC-701|SYNC-703'
          probe payment "$BASE/payment_start.php?t=bad" 'PAY-401'
