name: Patch Tehran Customer Location
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/patch-tehran-location.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch location flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Schema: persist delivery coordinates on each order.
          p=Path('TehranSupermarket/schema.php')
          s=p.read_text()
          needle='''    if(!isset($orderCols['delivery_eta'])) $oa[]="ADD COLUMN delivery_eta VARCHAR(120) NULL";\n'''
          add=needle+'''    if(!isset($orderCols['delivery_lat'])) $oa[]="ADD COLUMN delivery_lat DECIMAL(10,7) NULL";\n    if(!isset($orderCols['delivery_lng'])) $oa[]="ADD COLUMN delivery_lng DECIMAL(10,7) NULL";\n    if(!isset($orderCols['delivery_accuracy'])) $oa[]="ADD COLUMN delivery_accuracy INT UNSIGNED NULL";\n'''
          if "delivery_lat" not in s:
              assert needle in s
              s=s.replace(needle,add,1)
              p.write_text(s)

          # Checkout: accept validated GPS data, store it, and expose one-tap capture UI.
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          old="""  $name=trim((string)($_POST['name']??''));$phone=trim((string)($_POST['phone']??''));$address=trim((string)($_POST['address']??''));$slot=trim((string)($_POST['slot']??'اولین زمان ممکن'));$zoneId=max(0,(int)($_POST['zone_id']??0));$couponCode=trim((string)($_POST['coupon_code']??''));"""
          new=old+"""$latRaw=trim((string)($_POST['delivery_lat']??''));$lngRaw=trim((string)($_POST['delivery_lng']??''));$deliveryLat=$latRaw===''?null:filter_var($latRaw,FILTER_VALIDATE_FLOAT);$deliveryLng=$lngRaw===''?null:filter_var($lngRaw,FILTER_VALIDATE_FLOAT);if($deliveryLat===false||$deliveryLat<-90||$deliveryLat>90||$deliveryLng===false||$deliveryLng<-180||$deliveryLng>180){$deliveryLat=null;$deliveryLng=null;}$deliveryAccuracy=($deliveryLat!==null&&$deliveryLng!==null)?max(0,min(100000,(int)($_POST['delivery_accuracy']??0))):null;"""
          assert old in s
          s=s.replace(old,new,1)

          old="""$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,public_token,coupon_code,discount_total,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$total,$zoneId?:null,$zone['name'],$zone['eta']?:null,$publicToken,$coupon['code']?:null,$discount]);"""
          new="""$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,delivery_lat,delivery_lng,delivery_accuracy,public_token,coupon_code,discount_total,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$total,$zoneId?:null,$zone['name'],$zone['eta']?:null,$deliveryLat,$deliveryLng,$deliveryAccuracy,$publicToken,$coupon['code']?:null,$discount]);"""
          assert old in s
          s=s.replace(old,new,1)

          old='''<label class="wide">آدرس<textarea name="address" required><?=e($_SESSION['checkout_address']??'')?></textarea></label>'''
          new=old+'''<div class="locbox wide"><input type="hidden" name="delivery_lat" id="delivery_lat"><input type="hidden" name="delivery_lng" id="delivery_lng"><input type="hidden" name="delivery_accuracy" id="delivery_accuracy"><button type="button" class="btn pale" id="getLocation">📍 ثبت موقعیت فعلی</button><div><b id="locationStatus">برای تحویل دقیق‌تر، لوکیشن را ثبت کنید.</b><br><a id="locationMap" href="#" target="_blank" rel="noopener" hidden>🗺️ مشاهده موقعیت روی نقشه</a></div></div>'''
          assert old in s
          s=s.replace(old,new,1)

          cssneedle='''.pager a{background:#fff;border:1px solid #dfe8e1;border-radius:10px;padding:9px 14px;font-weight:700}'''
          cssadd=cssneedle+'''.locbox{display:flex;align-items:center;gap:12px;background:#f3f8f4;border:1px solid #dce9df;border-radius:14px;padding:11px}.locbox .btn{flex:0 0 auto}.locbox div{font-size:12px;line-height:1.7}.locbox a{color:#08783b;font-weight:800}@media(max-width:520px){.locbox{align-items:stretch;flex-direction:column}.locbox .btn{width:100%}}'''
          assert cssneedle in s
          s=s.replace(cssneedle,cssadd,1)

          marker='''</script><script>(()=>{if('serviceWorker' in navigator)'''
          geo="""</script><script>(()=>{const b=document.getElementById('getLocation'),st=document.getElementById('locationStatus'),la=document.getElementById('delivery_lat'),ln=document.getElementById('delivery_lng'),ac=document.getElementById('delivery_accuracy'),map=document.getElementById('locationMap');if(!b)return;b.addEventListener('click',()=>{if(!navigator.geolocation){st.textContent='مرورگر این گوشی امکان ثبت لوکیشن ندارد.';return;}b.disabled=true;b.textContent='📍 در حال دریافت موقعیت…';st.textContent='اجازه دسترسی به موقعیت مکانی را تأیید کنید.';navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy||0);la.value=lat.toFixed(7);ln.value=lng.toFixed(7);ac.value=acc;st.textContent='✅ لوکیشن ثبت شد'+(acc?' · دقت تقریبی '+acc.toLocaleString('fa-IR')+' متر':'');map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat+','+lng);map.hidden=false;b.textContent='✅ بروزرسانی لوکیشن';b.disabled=false;},err=>{const m=err.code===1?'اجازه دسترسی به لوکیشن داده نشد. از تنظیمات مرورگر Location را فعال کنید.':err.code===2?'موقعیت فعلی پیدا نشد. GPS گوشی را روشن کنید.':'دریافت لوکیشن طول کشید؛ دوباره امتحان کنید.';st.textContent=m;b.textContent='📍 ثبت موقعیت فعلی';b.disabled=false;},{enableHighAccuracy:true,timeout:15000,maximumAge:0});});})();</script><script>(()=>{if('serviceWorker' in navigator)"""
          assert marker in s
          s=s.replace(marker,geo,1)
          p.write_text(s)

          # Manager order cards: open the customer's saved pin directly in Maps.
          p=Path('TehranSupermarket/admin_orders.php')
          s=p.read_text()
          old="""<?=e($o['address'])?></div><div class=\"status-row\">"""
          new="""<?=e($o['address'])?><?php if($o['delivery_lat']!==null&&$o['delivery_lng']!==null):?><br><a class=\"btn pale\" style=\"display:inline-block;margin-top:7px\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=<?=rawurlencode((string)$o['delivery_lat'].','.(string)$o['delivery_lng'])?>\">📍 باز کردن لوکیشن مشتری</a><?php endif;?></div><div class=\"status-row\">"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # Courier panel: navigation link to the exact saved pin.
          p=Path('TehranSupermarket/courier.php')
          s=p.read_text()
          old="""<?=e($o['address'])?><?php if($o['delivery_zone_name']):?><br><span class=\"muted\"><?=e($o['delivery_zone_name'])?></span><?php endif;?></div>"""
          new="""<?=e($o['address'])?><?php if($o['delivery_zone_name']):?><br><span class=\"muted\"><?=e($o['delivery_zone_name'])?></span><?php endif;?><?php if($o['delivery_lat']!==null&&$o['delivery_lng']!==null):?><br><a class=\"btn\" style=\"display:inline-block;margin-top:8px\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=<?=rawurlencode((string)$o['delivery_lat'].','.(string)$o['delivery_lng'])?>\">🧭 مسیریابی تا مشتری</a><?php endif;?></div>"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          # Customer tracking page also shows the saved pin without exposing coordinates in the lookup URL.
          p=Path('TehranSupermarket/track.php')
          s=p.read_text()
          old="""<p><b>آدرس:</b> <?=e($order['address'])?></p>"""
          new=old+"""<?php if($order['delivery_lat']!==null&&$order['delivery_lng']!==null):?><p><a class=\"btn pale\" target=\"_blank\" rel=\"noopener\" href=\"https://www.google.com/maps/search/?api=1&amp;query=<?=rawurlencode((string)$order['delivery_lat'].','.(string)$order['delivery_lng'])?>\">📍 مشاهده لوکیشن ثبت‌شده</a></p><?php endif;?>"""
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          php -l TehranSupermarket/schema.php
          php -l TehranSupermarket/shop.php
          php -l TehranSupermarket/admin_orders.php
          php -l TehranSupermarket/courier.php
          php -l TehranSupermarket/track.php
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TehranSupermarket
          git diff --cached --quiet || git commit -m 'Add customer delivery geolocation'
          git push origin HEAD:websaza-hosting
