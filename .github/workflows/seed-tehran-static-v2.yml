name: Seed Tehran Common Products v2

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/seed-tehran-static-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with: {ref: websaza-hosting}
      - name: Build importer
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 24)"; echo "::add-mask::$KEY"; printf '%s' "$KEY" > "$RUNNER_TEMP/key"
          cat > "$RUNNER_TEMP/import.php" <<'PHP'
          <?php
          declare(strict_types=1);header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__KEY__',(string)($_GET['k']??''))){http_response_code(403);exit;}
          $c=require __DIR__.'/config.php';$pdo=new PDO('mysql:host='.$c['db_host'].';dbname='.$c['db_name'].';charset=utf8mb4',$c['db_user'],$c['db_pass'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);require_once __DIR__.'/schema.php';ensure_product_schema($pdo);
          $rows=[
          ['پفک نمکی مینو 60 گرم','مینو','60 گرم','تنقلات و شیرینی','https://cartmart.ca/cdn/shop/files/1_771015af-9c58-47f5-b6a8-407923f91760.jpg?v=1752342675','https://cartmart.ca/products/minoo-cheese-snack-60-gr'],
          ['چیپس کچاپ مزمز 90 گرم','مزمز','90 گرم','تنقلات و شیرینی','https://cdn.tezolmarket.com/media/products/large/1055634_3784.jpg','https://www.tezolmarket.com/Product/1055634/'],
          ['دوغ گازدار آبعلی 250 میلی لیتر','آبعلی','250 میلی لیتر','نوشیدنی','https://vicinitymart.com/cdn/shop/files/abali-doogh-250-ml.webp?v=1756418171','https://vicinitymart.com/products/abeali-yogurt-soda-250ml'],
          ['نوشابه زمزم زیرو 1.5 لیتر','زمزم','1.5 لیتر','نوشیدنی','https://d1l8km4g5s76x5.cloudfront.net/Production/exb_doc/2041/48355/2041_48355_47449_2097.png/fit-in/500x500','https://www.gulfood.com/gulfood-2026-products/zero-soft-drink'],
          ['آبمیوه پرتقال سن ایچ 1 لیتر','سن ایچ','1 لیتر','نوشیدنی','https://www.sunich.org/img/product/webp/medium/Orange-Juice-with-pulp-no-added-sugar1753109537.webp','https://www.sunich.org/en/products'],
          ['شیر پاستوریزه کم چرب میهن 1 لیتری','میهن','1 لیتر','لبنیات و صبحانه','https://cdn.tezolmarket.com/media/products/org/13827819_12883.jpg','https://www.tezolmarket.com/Product/1979701/'],
          ['بیسکویت ساقه طلایی مینو','مینو',NULL,'تنقلات و شیرینی','https://setare.com/files/1398/04/29/Untitled-4.jpg','https://setare.com/fa/news/33139/'],
          ['ویفر رنگارنگ مینو بسته 35 عددی','مینو','35 عدد','تنقلات و شیرینی','https://cdn11.bigcommerce.com/s-lbtzfspbze/images/stencil/760x760/products/5042/9266/rangarang__09846.1701731153.jpg?c=2','https://www.dizin.ca/wafers-and-biscuits/wafer-with-caramel-cream-35pcs-rangarang-minoo/'],
          ['ماست همزده سون کاله 900 گرم','کاله','900 گرم','لبنیات و صبحانه','https://www.highshop.ir/images/items/L8970.gif','https://www.highshop.ir/index.aspx?act=view&fid=8970'],
          ['پودر پنیر پارمسان کاله','کاله',NULL,'لبنیات و صبحانه','https://www.highshop.ir/images/items/L9200.gif','https://www.highshop.ir/index.aspx?act=view&fid=9200'],
          ['نودل با طعم مرغ الیت 75 گرم','الیت','75 گرم','کنسرو و غذای آماده','https://www.highshop.ir/images/items/L16255.gif','https://www.highshop.ir/index.aspx?act=view&fid=16255'],
          ['دوغ نعنا آبعلی 1 لیتر','آبعلی','1 لیتر','نوشیدنی','https://khoraksupermarket.com/cdn/shop/files/AbaliMintYogurtSoda1L_1_1200x1200.jpg?v=1749665570','https://khoraksupermarket.com/products/abali-mint-yogurt-soda-1l'],
          ['تن ماهی شیلتون در روغن گیاهی 180 گرم','شیلتون','180 گرم','کنسرو و غذای آماده','https://www.rosemarket.com.au/cdn/shop/files/ffa165_95848437f6934f8fa6ae69a7af2f0a5f_mv2.avif?v=1754555636','https://www.rosemarket.com.au/products/shilton-tuna-fish-in-vegetable-oil-180g'],
          ['مایع ظرفشویی پریل اوکالیپتوس 750 میلی لیتر','پریل','750 میلی لیتر','خانه و شوینده','https://khoshnamak.com/UpImage/c887bead-cb2a-4ff0-b342-745f8169d2e1.jpg','https://khoshnamak.com/Images/1116/pril-eucalyptus-dishwashing-liquid-750ml/'],
          ['شکر سفید برلیان 900 گرم','برلیان','900 گرم','مواد غذایی','https://romiyani.com/wp-content/uploads/2024/09/%D8%B4%DA%A9%D8%B1-%D8%B3%D9%81%DB%8C%D8%AF900-%DA%AF%D8%B1%D9%85%DB%8C.jpg','https://romiyani.com/product/%D8%B4%DA%A9%D8%B1-%D8%B3%D9%81%DB%8C%D8%AF-900-%DA%AF%D8%B1%D9%85%DB%8C/'],
          ['رب گوجه فرنگی کامروز 800 گرم','کامروز','800 گرم','کنسرو و غذای آماده','https://images.orientbazar24.com/item/images/2014411/middle/KamroozTomatenpaste-3.jpg','https://www.orientbazar24.com/rund-ums-kochen/sossen-pasten/kamrooz-tomatenpaste-800-gr-pasteurisierte-tomaten_2014411_38170']
          ];
          $pdo->exec('UPDATE products SET stock=10');
          $find=$pdo->prepare('SELECT id FROM products WHERE name=? LIMIT 1');$ins=$pdo->prepare('INSERT INTO products(name,barcode,brand,quantity_label,category,image_path,image_source,price,stock,active,created_at,updated_at) VALUES(?,NULL,?,?,?,?,?,0,10,1,NOW(),NOW())');$upd=$pdo->prepare('UPDATE products SET stock=10,brand=?,quantity_label=?,category=?,image_path=?,image_source=?,active=1,updated_at=NOW() WHERE id=?');
          $added=0;$updated=0;foreach($rows as $r){$find->execute([$r[0]]);$id=(int)($find->fetchColumn()?:0);if($id){$upd->execute([$r[1],$r[2],$r[3],$r[4],$r[5],$id]);$updated++;}else{$ins->execute($r);$added++;}}
          $total=(int)$pdo->query('SELECT COUNT(*) FROM products')->fetchColumn();$stock=(int)$pdo->query('SELECT COUNT(*) FROM products WHERE stock=10')->fetchColumn();$images=(int)$pdo->query("SELECT COUNT(*) FROM products WHERE image_path IS NOT NULL AND image_path<>''")->fetchColumn();echo json_encode(['ok'=>true,'added'=>$added,'updated'=>$updated,'total'=>$total,'stock10'=>$stock,'images'=>$images],JSON_UNESCAPED_UNICODE);
          PHP
          python3 - <<'PY'
          import os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP']);p=r/'import.php';p.write_text(p.read_text().replace('__KEY__',(r/'key').read_text()),encoding='utf-8')
          PY
          php -l "$RUNNER_TEMP/import.php"
      - name: Import and lock
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083";AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}";OUT="$RUNNER_TEMP/save.json"
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'file=seed_products.php' --data-urlencode "content@$RUNNER_TEMP/import.php" "${BASE}/execute/Fileman/save_file_content" -o "$OUT";test "$(jq -r '.result.status // .status // 0' "$OUT")" = 1
          KEY="$(cat "$RUNNER_TEMP/key")";echo "::add-mask::$KEY";RES=$(curl -sS --fail-with-body --max-time 60 "${PUBLIC_URL}/seed_products.php?k=${KEY}");echo "$RES" | tee "$RUNNER_TEMP/result.json";echo "$RES" | jq -e '.ok and .total >= 40 and .stock10 == .total and .images >= 40' >/dev/null
          printf '%s\n' "<?php http_response_code(404); exit('Not found');" > "$RUNNER_TEMP/off.php";curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'file=seed_products.php' --data-urlencode "content@$RUNNER_TEMP/off.php" "${BASE}/execute/Fileman/save_file_content" -o "$OUT";test "$(jq -r '.result.status // .status // 0' "$OUT")" = 1
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/seed_products.php")" = 404
      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tehran-static-seed-v2-${{ github.run_number }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
          retention-days: 2
