name: Build DirectYar 1.3
on:
  push:
    branches:
      - feat/directyar-v13-nov19
    paths:
      - 'directyar-v13/**'
      - '.github/workflows/directyar-v13-build.yml'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test automation logic
        run: python -m unittest discover -s directyar-v13/backend/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: directyar-v13
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DirectYar-v1.3-debug-apk
          path: directyar-v13/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
