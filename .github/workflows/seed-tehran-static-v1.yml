name: Seed Tehran Verified Starter Products

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/seed-tehran-static-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting

      - name: Build protected one-time importer
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 24)"; echo "::add-mask::$KEY"; printf '%s' "$KEY" > "$RUNNER_TEMP/key"
          cat > "$RUNNER_TEMP/import.php" <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__KEY__',(string)($_GET['k']??''))){http_response_code(403);exit;}
          $c=require __DIR__.'/config.php';
          $pdo=new PDO('mysql:host='.$c['db_host'].';dbname='.$c['db_name'].';charset=utf8mb4',$c['db_user'],$c['db_pass'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          require_once __DIR__.'/schema.php';ensure_product_schema($pdo);
          $rows=[
          ['شربت زعفران گلستان 650 گرم','گلستان','650 گرم','نوشیدنی','https://cdn.modiseh.com/unsafe/medium/au6299/au6299_1_.jpg','https://www.modiseh.com/product/mp-au6299/'],
          ['لوبیا قرمز گلستان 900 گرم','گلستان','900 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ch8596/ch8596_1_.jpg','https://www.modiseh.com/product/mp-ch8596/'],
          ['لوبیا چیتی گلستان 900 گرم','گلستان','900 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ch8595/ch8595_1_.jpg','https://www.modiseh.com/product/mp-ch8595/'],
          ['نبات سفید شاخه ای گلستان 500 گرم','گلستان','500 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/cf2911/cf2911_1_.jpg','https://www.modiseh.com/product/mp-cf2911/'],
          ['زعفران کاور طرح گل گلستان یک مثقال','گلستان','1 مثقال','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/as5458/483256_main_1.jpg','https://www.modiseh.com/product/mp-as5458/'],
          ['نمک تصفیه کریستاله یددار گلستان 500 گرم','گلستان','500 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/as0170/432645_main_1.jpg','https://www.modiseh.com/product/mp-as0170/'],
          ['قند کله شکسته گلستان 1700 گرم','گلستان','1700 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/as0102/432554_main_1.jpg','https://www.modiseh.com/product/mp-as0102/'],
          ['زعفران گلستان 0.5 گرم','گلستان','0.5 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/as0081/432539_main_1.jpg','https://www.modiseh.com/product/mp-as0081/'],
          ['زعفران کاور گلستان 1 مثقال','گلستان','1 مثقال','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/as0096/as0096_1_-.jpg','https://www.modiseh.com/product/mp-as0096/'],
          ['زعفران گلستان 1 گرم','گلستان','1 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/as0086/432478_main_1.jpg','https://www.modiseh.com/product/mp-as0086/'],
          ['دمنوش مخلوط گل گاوزبان گلستان بسته 20 عددی','گلستان','40 گرم / 20 عدد','لبنیات و صبحانه','https://cdn.modiseh.com/unsafe/medium/aq3348_1.jpg','https://www.modiseh.com/product/mp-aq3348/'],
          ['نبات زعفرانی چوبی گلستان بسته 10 عددی','گلستان','10 عدد','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ao9986_3.jpg','https://www.modiseh.com/product/mp-ao9986/'],
          ['چای سیاه کیسه ای ممتاز هندوستان گلستان بسته 1000 عددی','گلستان','1000 عدد','لبنیات و صبحانه','https://cdn.modiseh.com/unsafe/medium/am0241/am0241_1_--.jpg','https://www.modiseh.com/product/mp-am0241/'],
          ['برنج پاکستانی سوپر باسماتی صافورا 10 کیلوگرم','صافورا','10 کیلوگرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/au6792/au6792_1_-.jpg','https://www.modiseh.com/product/mp-au6792/'],
          ['پاستا فرمی پنه ژیک 500 گرم','ژیک','500 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ci1984/ci1984_1_.jpg','https://www.modiseh.com/product/mp-ci1984/'],
          ['اسپاگتی 1.2 ژیک 500 گرم','ژیک','500 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ci1983/ci1983_1_.jpg','https://www.modiseh.com/product/mp-ci1983/'],
          ['اسپاگتی 1.2 ژیک 700 گرم','ژیک','700 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ci1982/ci1982_1_.jpg','https://www.modiseh.com/product/mp-ci1982/'],
          ['اسپاگتی 1.2 پارسیلا 700 گرم','پارسیلا','700 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ci1868/ci1868_1_.jpg','https://www.modiseh.com/product/mp-ci1868/'],
          ['اسپاگتی 1.4 ژیک 700 گرم','ژیک','700 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ci1865/ci1865_1_.jpg','https://www.modiseh.com/product/mp-ci1865/'],
          ['قند شکسته پردیس 400 گرم','پردیس','400 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/mt0654_3.jpg','https://www.modiseh.com/product/mp-mt0654/'],
          ['رشته پلویی گلها 340 گرم','گلها','340 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/mx8907/mx8907_1_-.jpg','https://www.modiseh.com/product/mp-mx8907/'],
          ['شکر سفید قوطی پلاستیکی گلها 220 گرم','گلها','220 گرم','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/nh6046/nh6046_1_.jpg','https://www.modiseh.com/product/mp-nh6046/'],
          ['پودر جوانه گندم گلها 15 گرم بسته 20 عددی','گلها','15 گرم / 20 عدد','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ne8615/ne8615_1_.jpg','https://www.modiseh.com/product/mp-ne8615/'],
          ['سبوس برنج قهوه ای گلها 15 گرم بسته 20 عددی','گلها','15 گرم / 20 عدد','مواد غذایی','https://cdn.modiseh.com/unsafe/medium/ne8614/ne8614_1_.jpg','https://www.modiseh.com/product/mp-ne8614/']
          ];
          $pdo->exec('UPDATE products SET stock=10');
          $find=$pdo->prepare('SELECT id FROM products WHERE name=? LIMIT 1');
          $ins=$pdo->prepare('INSERT INTO products(name,barcode,brand,quantity_label,category,image_path,image_source,price,stock,active,created_at,updated_at) VALUES(?,NULL,?,?,?,?,?,0,10,1,NOW(),NOW())');
          $upd=$pdo->prepare('UPDATE products SET stock=10,brand=?,quantity_label=?,category=?,image_path=?,image_source=?,active=1,updated_at=NOW() WHERE id=?');
          $added=0;$updated=0;
          foreach($rows as $r){$find->execute([$r[0]]);$id=(int)($find->fetchColumn()?:0);if($id){$upd->execute([$r[1],$r[2],$r[3],$r[4],$r[5],$id]);$updated++;}else{$ins->execute($r);$added++;}}
          $total=(int)$pdo->query('SELECT COUNT(*) FROM products')->fetchColumn();
          $stock10=(int)$pdo->query('SELECT COUNT(*) FROM products WHERE stock=10')->fetchColumn();
          $images=(int)$pdo->query("SELECT COUNT(*) FROM products WHERE image_path IS NOT NULL AND image_path<>''")->fetchColumn();
          echo json_encode(['ok'=>true,'added'=>$added,'updated'=>$updated,'total'=>$total,'stock10'=>$stock10,'images'=>$images],JSON_UNESCAPED_UNICODE);
          PHP
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'import.php'
          key=(Path(os.environ['RUNNER_TEMP'])/'key').read_text()
          p.write_text(p.read_text().replace('__KEY__',key),encoding='utf-8')
          PY
          php -l "$RUNNER_TEMP/import.php"

      - name: Upload and execute importer
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          OUT="$RUNNER_TEMP/save.json"
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'file=seed_products.php' --data-urlencode "content@$RUNNER_TEMP/import.php" "${BASE}/execute/Fileman/save_file_content" -o "$OUT"
          test "$(jq -r '.result.status // .status // 0' "$OUT")" = '1'
          KEY="$(cat "$RUNNER_TEMP/key")"; echo "::add-mask::$KEY"
          RES=$(curl -sS --fail-with-body --max-time 60 "${PUBLIC_URL}/seed_products.php?k=${KEY}")
          echo "$RES" | tee "$RUNNER_TEMP/result.json"
          echo "$RES" | jq -e '.ok == true and .total >= 24 and .stock10 == .total and .images >= 24' >/dev/null

      - name: Lock importer and verify store
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          printf '%s\n' "<?php http_response_code(404); exit('Not found');" > "$RUNNER_TEMP/off.php"
          OUT="$RUNNER_TEMP/lock.json"
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}" --data-urlencode 'file=seed_products.php' --data-urlencode "content@$RUNNER_TEMP/off.php" "${BASE}/execute/Fileman/save_file_content" -o "$OUT"
          test "$(jq -r '.result.status // .status // 0' "$OUT")" = '1'
          CODE=$(curl -sS -L --max-time 30 -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "${PUBLIC_URL}/")
          test "$CODE" = '200'
          grep -Fq 'قیمت در حال ثبت' "$RUNNER_TEMP/home.html"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/seed_products.php")" = '404'

      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tehran-static-seed-${{ github.run_number }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: ignore
          retention-days: 2
