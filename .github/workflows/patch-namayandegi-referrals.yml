name: Patch Namayandegi Referrals

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-namayandegi-referrals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch referral system
        run: |
          set -euo pipefail
          python3 WebSaza/namayandegi/patch_referrals.py
          php -l WebSaza/namayandegi/index.php
      - name: Commit referral system
        run: |
          set -euo pipefail
          git config user.name "websaza-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- WebSaza/namayandegi/index.php; then
            echo "No changes"
            exit 0
          fi
          git add WebSaza/namayandegi/index.php
          git commit -m "Add permanent referral reward system"
          git push origin HEAD:websaza-hosting
