name: Patch Namayandegi Referral Signup

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-namayandegi-referrals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Add visible referrer code field
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('WebSaza/namayandegi/index.php')
          s = p.read_text(encoding='utf-8')
          old = """<input type=\"hidden\" name=\"ref\" value=\"'.$ref.'\">"""
          new = """<label>کد معرف (اختیاری)<input name=\"ref\" inputmode=\"numeric\" maxlength=\"4\" value=\"'.$ref.'\" placeholder=\"مثلاً 1234\"></label>"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('referral field added')
          else:
              print('referral field already present or source changed')
          PY
          php -l WebSaza/namayandegi/index.php
      - name: Commit signup field
        run: |
          set -euo pipefail
          git config user.name "websaza-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- WebSaza/namayandegi/index.php; then
            echo "No changes"
            exit 0
          fi
          git add WebSaza/namayandegi/index.php
          git commit -m "Show referrer code field during agency signup"
          git push origin HEAD:websaza-hosting
