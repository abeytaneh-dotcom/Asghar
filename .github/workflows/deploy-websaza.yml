name: Deploy WebSaza to cPanel

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/**'
      - '.github/workflows/deploy-websaza.yml'
      - '.github/workflows/niyazestan-smoke.yml'
  workflow_dispatch:

concurrency:
  group: deploy-websaza-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check Niyazestan code
        shell: bash
        run: |
          set -euo pipefail
          find WebSaza -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for file in WebSaza/nz-*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done

      - name: Build local image assets
        shell: bash
        run: |
          set -euo pipefail
          download() {
            url="$1"; out="$2"
            echo "Preparing $out"
            if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o "WebSaza/$out"; then
              echo "Primary source failed; using current production asset as safe fallback"
              curl -fL --retry 3 --connect-timeout 20 --max-time 120 "https://websaza.ir/$out" -o "WebSaza/$out"
            fi
            test -s "WebSaza/$out"
            bytes=$(wc -c < "WebSaza/$out")
            test "$bytes" -ge 15000
          }
          download "https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1400&q=86" "hero-real-v10.jpg"
          download "https://images.pexels.com/photos/6804581/pexels-photo-6804581.jpeg?auto=compress&cs=tinysrgb&w=1400" "service-web-v8.jpg"
          download "https://images.pexels.com/photos/12123390/pexels-photo-12123390.jpeg?auto=compress&cs=tinysrgb&w=1400" "service-app-v8.jpg"
          download "https://images.pexels.com/photos/12969403/pexels-photo-12969403.jpeg?auto=compress&cs=tinysrgb&w=1400" "service-seo-v8.jpg"
          download "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=82" "studio-real-v10.jpg"
          download "https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=82" "meeting-real-v10.jpg"
          download "https://image.thum.io/get/width/1400/crop/875/noanimate/https://htaelec.ir/" "project-htaelec-v10.png"
          download "https://image.thum.io/get/width/1400/crop/875/noanimate/https://achinu.ir/" "project-achinu-v10.png"
          download "https://image.thum.io/get/width/1400/crop/875/noanimate/https://goldartmis.ir/" "project-goldartmis-v10.png"

      - name: Prepare production HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('WebSaza/index.html'); html=path.read_text(encoding='utf-8')
          seo_title='طراحی سایت حرفه‌ای، فروشگاه اینترنتی، اپلیکیشن و سئو | وب ساز'
          seo_description='وب ساز؛ طراحی سایت حرفه‌ای، فروشگاه اینترنتی، اپلیکیشن و خدمات سئو با رابط کاربری مدرن، سرعت بالا، ساختار فنی استاندارد و تمرکز بر جذب مشتری و رشد کسب‌وکار.'
          social_description='طراحی سایت، فروشگاه اینترنتی، اپلیکیشن و سئو با تمرکز بر تجربه کاربری، سرعت، ساختار فنی و رشد واقعی کسب‌وکار.'
          html=re.sub(r'<title>.*?</title>',f'<title>{seo_title}</title>',html,count=1,flags=re.S)
          html=re.sub(r'<meta name="description" content="[^"]*">',f'<meta name="description" content="{seo_description}">',html,count=1)
          html=re.sub(r'<meta property="og:title" content="[^"]*">',f'<meta property="og:title" content="{seo_title}">',html,count=1)
          html=re.sub(r'<meta property="og:description" content="[^"]*">',f'<meta property="og:description" content="{social_description}">',html,count=1)
          html=re.sub(r'<meta name="twitter:title" content="[^"]*">',f'<meta name="twitter:title" content="{seo_title}">',html,count=1)
          html=re.sub(r'<meta name="twitter:description" content="[^"]*">',f'<meta name="twitter:description" content="{social_description}">',html,count=1)
          if '<meta name="author"' not in html: html=html.replace('<meta name="theme-color" content="#ffffff">','<meta name="theme-color" content="#ffffff">\n<meta name="author" content="وب ساز">\n<meta name="publisher" content="وب ساز">')
          html=re.sub(r'<link rel="preconnect" href="https://images\.unsplash\.com" crossorigin>\n?','',html)
          html=re.sub(r'<link rel="preconnect" href="https://image\.thum\.io" crossorigin>\n?','',html)
          html=re.sub(r'<link rel="preload" as="image" href="https://images\.unsplash\.com[^>]+>\n?','<link rel="preload" as="image" href="/hero-real-v10.jpg?v=20261017-1" fetchpriority="high">\n',html)
          html=re.sub(r'<meta property="og:image" content="[^"]+">','<meta property="og:image" content="https://websaza.ir/hero-real-v10.jpg?v=20261017-1">',html)
          html=re.sub(r'<meta name="twitter:image" content="[^"]+">','<meta name="twitter:image" content="https://websaza.ir/hero-real-v10.jpg?v=20261017-1">',html)
          replacements={
            'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=86':'/hero-real-v10.jpg?v=20261017-1',
            'https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1000&q=80':'/service-web-v8.jpg?v=20261017-1',
            'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?auto=format&fit=crop&w=1000&q=80':'/service-app-v8.jpg?v=20261017-1',
            'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1000&q=80':'/service-seo-v8.jpg?v=20261017-1',
            'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=82':'/studio-real-v10.jpg?v=20261017-1',
            'https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1000&q=82':'/meeting-real-v10.jpg?v=20261017-1',
            'https://image.thum.io/get/width/1200/crop/750/noanimate/https://htaelec.ir/':'/project-htaelec-v10.png?v=20261017-1',
            'https://image.thum.io/get/width/1200/crop/750/noanimate/https://achinu.ir/':'/project-achinu-v10.png?v=20261017-1',
            'https://image.thum.io/get/width/1200/crop/750/noanimate/https://goldartmis.ir/':'/project-goldartmis-v10.png?v=20261017-1',
            '<div class="project-domain">htaelec.ir</div>':'<div class="project-domain">سایت خانه ریمپ</div>',
            '<div class="project-domain">achinu.ir</div>':'<div class="project-domain">سایت آچینو</div>',
            '<div class="project-domain">goldartmis.ir</div>':'<div class="project-domain">سایت Gold Artmis</div>'}
          for old,new in replacements.items(): html=html.replace(old,new)
          path.write_text(html,encoding='utf-8')
          PY

      - name: Deploy text files via cPanel UAPI
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_TOKEN"
          shopt -s dotglob
          for file in WebSaza/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            case "$name" in *.jpg|*.jpeg|*.png|*.webp|*.gif|*.ico|*.woff|*.woff2|*.b64.*) continue ;; esac
            echo "Deploying text: $name"
            RESPONSE=$(curl --fail-with-body --silent --show-error -H "Authorization: cpanel vt6qdx8:$CPANEL_TOKEN" --request POST --data-urlencode "dir=public_html" --data-urlencode "file=$name" --data-urlencode "content@$file" "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$RESPONSE" | jq -e '.status == 1' >/dev/null
          done
          if [ -f WebSaza/marketplace-uploads/.htaccess ]; then
            RESPONSE=$(curl --fail-with-body --silent --show-error -H "Authorization: cpanel vt6qdx8:$CPANEL_TOKEN" --request POST --data-urlencode "dir=public_html/marketplace-uploads" --data-urlencode "file=.htaccess" --data-urlencode "content@WebSaza/marketplace-uploads/.htaccess" "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$RESPONSE" | jq -e '.status == 1' >/dev/null
          fi

      - name: Upload image assets via cPanel UAPI
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          upload_binary(){ file="$1";name=$(basename "$file");RESPONSE=$(curl --fail-with-body --silent --show-error -H "Authorization: cpanel vt6qdx8:$CPANEL_TOKEN" -F "file-1=@$file;filename=$name" -F "dir=public_html" -F "overwrite=1" "https://mch4444.dnsuserver.com:2083/execute/Fileman/upload_files");echo "$RESPONSE" | jq -e '.status == 1' >/dev/null; }
          for f in WebSaza/hero-real-v10.jpg WebSaza/service-web-v8.jpg WebSaza/service-app-v8.jpg WebSaza/service-seo-v8.jpg WebSaza/studio-real-v10.jpg WebSaza/meeting-real-v10.jpg WebSaza/project-htaelec-v10.png WebSaza/project-achinu-v10.png WebSaza/project-goldartmis-v10.png; do upload_binary "$f"; done

      - name: Write release marker
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE=$(jq -nc --arg sha "$GITHUB_SHA" --arg deployed_at "$(date -u +%FT%TZ)" '{sha:$sha,deployed_at:$deployed_at}')
          RESPONSE=$(curl --fail-with-body --silent --show-error -H "Authorization: cpanel vt6qdx8:$CPANEL_TOKEN" --request POST --data-urlencode "dir=public_html/.marketplace-data" --data-urlencode "file=release.json" --data-urlencode "content=$RELEASE" "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
          echo "$RESPONSE" | jq -e '.status == 1' >/dev/null

      - name: Verify live domain and Niyazestan
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsS --max-time 20 https://websaza.ir/ | grep -F 'فروشگاه اینترنتی، اپلیکیشن و سئو' >/dev/null
          HTML=$(curl -fsS --max-time 25 https://websaza.ir/nz)
          grep -F 'نیازستان' <<<"$HTML" >/dev/null
          grep -E 'nz-brand-model\.js\?v=[a-f0-9]{12}' <<<"$HTML" >/dev/null
          grep -E 'nz-geocode-proxy\.js\?v=[a-f0-9]{12}' <<<"$HTML" >/dev/null
          grep -E 'nz-a11y\.js\?v=[a-f0-9]{12}' <<<"$HTML" >/dev/null
          curl -fsS --max-time 20 https://websaza.ir/nz-manifest.json | jq -e '.scope == "/nz" and .display == "standalone"' >/dev/null
          curl -fsS --max-time 20 'https://websaza.ir/nz-models.php?subcategory=%D8%AE%D9%88%D8%AF%D8%B1%D9%88' | jq -e '.ok == true and (.brands | length) > 5' >/dev/null
          curl -fsS --max-time 20 'https://websaza.ir/nz-geocode.php?lat=35.6892&lon=51.3890' | jq -e '.ok == true and (.address|type)=="object"' >/dev/null
          curl -fsS --max-time 20 https://websaza.ir/niazestan-sw.js | grep -E '^const CACHE="niazestan-[a-f0-9]{16}";' >/dev/null
          curl -fsS --max-time 20 https://websaza.ir/nz-health.php | jq -e '.ok == true' >/dev/null
          curl -fsSI --max-time 20 'https://websaza.ir/nz?page=notifications' | grep -qi 'x-robots-tag: noindex'
          curl -fsS --max-time 20 'https://websaza.ir/nz?page=search&category=%D9%88%D8%B3%D8%A7%DB%8C%D9%84%20%D9%86%D9%82%D9%84%DB%8C%D9%87' | grep -F '<meta name="robots" content="index,follow,max-image-preview:large">' >/dev/null
          curl -fsS --max-time 20 https://websaza.ir/sitemap.xml | grep -F 'website-speed-optimization.html' >/dev/null
