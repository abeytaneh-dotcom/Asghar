name: Deploy WebSaza to cPanel

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/**'
      - '.github/workflows/deploy-websaza.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local premium image assets
        shell: bash
        run: |
          set -euo pipefail

          # Rebuild the approved custom WebSaza hero from repository text chunks.
          cat WebSaza/hero-v9.b64.01 WebSaza/hero-v9.b64.02 WebSaza/hero-v9.b64.03 WebSaza/hero-v9.b64.04 \
            | tr -d '\n\r ' \
            | base64 --decode > WebSaza/hero-custom-v9.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('WebSaza/hero-custom-v9.jpg')
          data = p.read_bytes()
          assert len(data) > 20000, f'hero too small: {len(data)} bytes'
          assert data[:2] == b'\xff\xd8', 'hero is not a JPEG'
          print(f'Custom hero rebuilt: {len(data)} bytes')
          PY

          download() {
            url="$1"
            out="$2"
            echo "Downloading $out"
            curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 "$url" -o "WebSaza/$out"
            test -s "WebSaza/$out"
            bytes=$(wc -c < "WebSaza/$out")
            if [ "$bytes" -lt 20000 ]; then
              echo "Downloaded asset is unexpectedly small: $out ($bytes bytes)"
              exit 1
            fi
          }

          # Supporting real photographic assets, downloaded at deploy time and served locally.
          download "https://images.pexels.com/photos/6804581/pexels-photo-6804581.jpeg?auto=compress&cs=tinysrgb&w=1400" "service-web-v8.jpg"
          download "https://images.pexels.com/photos/12123390/pexels-photo-12123390.jpeg?auto=compress&cs=tinysrgb&w=1400" "service-app-v8.jpg"
          download "https://images.pexels.com/photos/12969403/pexels-photo-12969403.jpeg?auto=compress&cs=tinysrgb&w=1400" "service-seo-v8.jpg"

          # Real project previews, cached locally so visitors never depend on a third-party screenshot request.
          download "https://image.thum.io/get/width/1600/crop/1000/noanimate/https://htaelec.ir/" "project-htaelec-v7.png"
          download "https://image.thum.io/get/width/1400/crop/875/noanimate/https://achinu.ir/" "project-achinu-v7.png"
          download "https://image.thum.io/get/width/1400/crop/875/noanimate/https://goldartmis.ir/" "project-goldartmis-v7.png"

      - name: Prepare production HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('WebSaza/index.html')
          html = path.read_text(encoding='utf-8')

          html = re.sub(r'<link rel="preconnect" href="https://images\.unsplash\.com" crossorigin>\n?', '', html)
          html = re.sub(r'<link rel="preload" as="image" href="https://images\.unsplash\.com[^>]+>\n?', '', html)
          html = re.sub(r'<link rel="preload" as="image" href="/hero-[^"]+\.jpg"[^>]*>\n?', '', html)
          html = html.replace(
              '<link rel="preload" href="/YekanBakhMedium.woff" as="font" type="font/woff" crossorigin>',
              '<link rel="preload" href="/YekanBakhMedium.woff" as="font" type="font/woff" crossorigin>\n<link rel="preload" as="image" href="/hero-custom-v9.jpg?v=20261017-6" fetchpriority="high">'
          )

          html = re.sub(r'<meta property="og:image" content="[^"]+">', '<meta property="og:image" content="https://websaza.ir/hero-custom-v9.jpg?v=20261017-6">', html)
          html = re.sub(r'<meta name="twitter:image" content="[^"]+">', '<meta name="twitter:image" content="https://websaza.ir/hero-custom-v9.jpg?v=20261017-6">', html)

          if '/premium-v7.css' not in html:
              html = html.replace('<link rel="stylesheet" href="/wow-v6.css?v=20261016-2">', '<link rel="stylesheet" href="/wow-v6.css?v=20261016-2">\n<link rel="stylesheet" href="/premium-v7.css?v=20261017-6">')
          else:
              html = re.sub(r'/premium-v7\.css\?v=[^\"]+', '/premium-v7.css?v=20261017-6', html)

          hero = '<div class="hero-photo-layer"><img src="/hero-custom-v9.jpg?v=20261017-6" width="800" height="600" fetchpriority="high" loading="eager" decoding="async" alt="نمای حرفه‌ای طراحی سایت و اپلیکیشن وب ساز با تم تیره و سبز"></div>'
          html = re.sub(r'<div class="hero-photo-layer"><img[^>]*></div>', hero, html, count=1)

          replacements = {
              'https://image.thum.io/get/width/1600/crop/1000/noanimate/https://htaelec.ir/': '/project-htaelec-v7.png',
              'https://image.thum.io/get/width/1200/crop/750/noanimate/https://achinu.ir/': '/project-achinu-v7.png',
              'https://image.thum.io/get/width/1200/crop/750/noanimate/https://goldartmis.ir/': '/project-goldartmis-v7.png',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Deploy text files via cPanel UAPI
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob
          for file in WebSaza/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            case "$name" in
              *.jpg|*.jpeg|*.png|*.webp|*.gif|*.ico|*.woff|*.woff2|*.b64.*) continue ;;
            esac
            echo "Deploying text: $name"
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: cpanel vt6qdx8:${{ secrets.WEBSAZA_CPANEL_TOKEN }}" \
              --request POST \
              --data-urlencode "dir=public_html" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$file" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$RESPONSE" | jq -e '.status == 1' >/dev/null
          done

      - name: Upload premium binary images via cPanel UAPI
        shell: bash
        run: |
          set -euo pipefail
          upload_binary() {
            file="$1"
            force="${2:-0}"
            name=$(basename "$file")
            if [ "$force" != "1" ] && curl -fsSI --max-time 15 "https://websaza.ir/$name" >/dev/null 2>&1; then
              echo "Image already present on live site, keeping it: $name"
              return 0
            fi
            echo "Uploading image: $name"
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: cpanel vt6qdx8:${{ secrets.WEBSAZA_CPANEL_TOKEN }}" \
              -F "file-1=@$file;filename=$name" \
              -F "dir=public_html" \
              -F "overwrite=1" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/upload_files")
            echo "$RESPONSE" | jq -e '.status == 1' >/dev/null
          }
          upload_binary WebSaza/hero-custom-v9.jpg 1
          upload_binary WebSaza/service-web-v8.jpg
          upload_binary WebSaza/service-app-v8.jpg
          upload_binary WebSaza/service-seo-v8.jpg
          upload_binary WebSaza/project-htaelec-v7.png
          upload_binary WebSaza/project-achinu-v7.png
          upload_binary WebSaza/project-goldartmis-v7.png

      - name: Verify live domain and local assets
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          echo "Root response"
          curl -fsSI --max-time 20 https://websaza.ir/ | head -n 12
          echo "HTML build markers"
          curl -fsS --max-time 20 https://websaza.ir/ | grep -E 'premium-v7\.css\?v=20261017-6|hero-custom-v9\.jpg\?v=20261017-6' >/dev/null
          echo "WWW response"
          curl -sS -I --max-time 20 https://www.websaza.ir/ | head -n 10
          for asset in hero-custom-v9.jpg service-web-v8.jpg service-app-v8.jpg service-seo-v8.jpg project-htaelec-v7.png project-achinu-v7.png project-goldartmis-v7.png premium-v7.css; do
            echo "Checking $asset"
            curl -fsSI --max-time 20 "https://websaza.ir/$asset" | head -n 4
          done
