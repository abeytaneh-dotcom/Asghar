name: Deploy WebSaza to cPanel

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/**'
      - '.github/workflows/deploy-websaza.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy all WebSaza files via cPanel UAPI
        shell: bash
        run: |
          set -euo pipefail
          for file in WebSaza/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            echo "Deploying $name"
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: cpanel vt6qdx8:${{ secrets.WEBSAZA_CPANEL_TOKEN }}" \
              --request POST \
              --data-urlencode "dir=public_html" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$file" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$RESPONSE" | jq -e '.status == 1' >/dev/null
          done
          echo "All WebSaza files deployed successfully."

      - name: Check live root and www domains
        shell: bash
        run: |
          set +e
          echo "=== DNS ==="
          echo "websaza.ir A: $(dig +short websaza.ir A | tr '\n' ' ')"
          echo "www.websaza.ir A: $(dig +short www.websaza.ir A | tr '\n' ' ')"
          echo "www.websaza.ir CNAME: $(dig +short www.websaza.ir CNAME | tr '\n' ' ')"
          echo "=== HTTPS ==="
          echo "root:"
          curl -I -L --max-time 20 --connect-timeout 10 https://websaza.ir || true
          echo "www:"
          curl -I -L --max-time 20 --connect-timeout 10 https://www.websaza.ir || true
