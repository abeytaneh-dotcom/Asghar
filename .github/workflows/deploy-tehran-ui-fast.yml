name: Deploy Tehran UI Fast

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/deploy-tehran-ui-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Upload storefront UI only
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          save(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/out.json"
            for n in 1 2 3; do
              if curl -sS --fail-with-body --connect-timeout 15 --max-time 90 -H "$AUTH" --request POST \
                --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
                "${BASE}/execute/Fileman/save_file_content" -o "$out" && [ "$(jq -r '.result.status // .status // 0' "$out")" = 1 ]; then
                echo "uploaded $file"; return 0
              fi
              sleep $((n*2))
            done
            cat "$out" || true
            return 1
          }
          save TehranSupermarket/assets/server_storefront_critical_v1.css "$TARGET_DIR/assets" server_storefront_critical_v1.css
          save TehranSupermarket/assets/tehran_premium_mobile_v5.css "$TARGET_DIR/assets" tehran_premium_mobile_v5.css
          save TehranSupermarket/assets/tehran-storefront-v2.svg "$TARGET_DIR/assets" tehran-storefront-v2.svg
          save TehranSupermarket/assets/ai_entry_flow.js "$TARGET_DIR/assets" ai_entry_flow.js
      - name: Verify runtime loader is live
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --fail --max-time 30 -H 'Cache-Control: no-cache' 'https://websaza.ir/tehran/assets/ai_entry_flow.js?v=20261027-6' -o "$RUNNER_TEMP/entry.js"
          grep -Fq 'premium-storefront-runtime-v6' "$RUNNER_TEMP/entry.js"
          curl -sS -L --fail --max-time 30 -H 'Cache-Control: no-cache' 'https://websaza.ir/tehran/assets/tehran_premium_mobile_v5.css?v=20261027-6' -o "$RUNNER_TEMP/ui.css"
          grep -Fq 'Tehran Market premium mobile storefront v5' "$RUNNER_TEMP/ui.css"
          echo 'TEHRAN_UI_FAST_LIVE_OK'
