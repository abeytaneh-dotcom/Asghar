name: Configure Namayandegi Cron

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/namayandegi/smart-actions.php'
      - '.github/workflows/configure-namayandegi-cron.yml'
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure one-minute order automation cron
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          endpoint="https://mch4444.dnsuserver.com:2083/json-api/cpanel"
          marker="WEBSAZA_NAMAYANDEGI_TICK"
          command="WEBSAZA_NAMAYANDEGI_TICK=1 /usr/local/bin/php -q /home/vt6qdx8/public_html/namayandegi/smart-actions.php >/dev/null 2>&1"

          list=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Cron" \
            --data-urlencode "cpanel_jsonapi_func=listcron" \
            "$endpoint")

          if echo "$list" | jq -e --arg m "$marker" 'any(.cpanelresult.data[]?; ((.command // "") | contains($m)))' >/dev/null; then
            echo "Namayandegi cron already exists."
            exit 0
          fi

          add=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Cron" \
            --data-urlencode "cpanel_jsonapi_func=add_line" \
            --data-urlencode "minute=*" \
            --data-urlencode "hour=*" \
            --data-urlencode "day=*" \
            --data-urlencode "month=*" \
            --data-urlencode "weekday=*" \
            --data-urlencode "command=$command" \
            "$endpoint")

          echo "$add" | jq -e '(.cpanelresult.event.result // .cpanelresult.data[0].status // .cpanelresult.data[0].result // 0) | tonumber == 1' >/dev/null

          verify=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Cron" \
            --data-urlencode "cpanel_jsonapi_func=listcron" \
            "$endpoint")
          echo "$verify" | jq -e --arg m "$marker" 'any(.cpanelresult.data[]?; ((.command // "") | contains($m)))' >/dev/null
          echo "Namayandegi one-minute cron verified."
