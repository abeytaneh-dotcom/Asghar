name: Build Websaz Store Windows EXE
on:
  push:
    branches: [websaz-store-desktop-v1]
    paths:
      - 'websaz-store/**'
      - '.github/workflows/build-websaz-store.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        shell: pwsh
        run: |
          dotnet build websaz-store\WebsazStore.csproj -c Release
      - name: Package native dashboard build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item websaz-store\bin\Release\net48\WebsazStore.exe dist\WebsazStore.exe
          Copy-Item websaz-store\server\websaz-sync.php dist\websaz-sync.php
          Copy-Item websaz-store\server\websaz-sync-config.sample.php dist\websaz-sync-config.sample.php
      - name: Verify Windows executable
        shell: pwsh
        run: |
          $p='dist\WebsazStore.exe'
          if(!(Test-Path $p)){ throw 'EXE missing' }
          $bytes=[System.IO.File]::ReadAllBytes($p)
          if($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A){ throw 'Invalid PE header' }
          Write-Host "WebsazStore.exe bytes: $($bytes.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: WebsazStore-Native-HDPI-Windows
          path: dist/*
          if-no-files-found: error
