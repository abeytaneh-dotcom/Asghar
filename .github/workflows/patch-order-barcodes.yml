name: Launch Tehran UX Overhaul

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-order-barcodes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Execute prepared overhaul steps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          path=Path('.github/workflows/ux-overhaul.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          blocks=[]
          i=0
          while i < len(lines):
              line=lines[i]
              if line.strip()=='run: |':
                  base=len(line)-len(line.lstrip())
                  i+=1
                  chunk=[]
                  while i < len(lines):
                      cur=lines[i]
                      if cur.strip() and (len(cur)-len(cur.lstrip())) <= base:
                          break
                      chunk.append(cur)
                      i+=1
                  blocks.append(textwrap.dedent('\n'.join(chunk)))
                  continue
              i+=1
          if len(blocks)<7:
              raise SystemExit(f'Expected 7 run blocks, found {len(blocks)}')
          for n,block in enumerate(blocks,1):
              if n==5:
                  print('--- admin safety/nav patch already applied; skipping block 5 ---')
                  continue
              print(f'--- running overhaul block {n}/{len(blocks)} ---')
              subprocess.run(['bash','-lc',block],check=True)
          PY
