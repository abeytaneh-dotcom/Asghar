name: Export Android Signing Tools

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Collect signing tools
        run: |
          mkdir -p artifact/tools/lib
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign artifact/tools/zipalign
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar artifact/tools/lib/apksigner.jar
          chmod +x artifact/tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: artifact/
          if-no-files-found: error
