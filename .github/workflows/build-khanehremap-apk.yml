name: Build KhanehRemap APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        working-directory: khanehremap-android-private-shell
        run: gradle --no-daemon :app:assembleRelease
      - name: Collect unsigned APK
        run: |
          mkdir -p artifact
          cp khanehremap-android-private-shell/app/build/outputs/apk/release/app-release-unsigned.apk artifact/KhanehRemap-PrivateShell-unsigned.apk
          sha256sum artifact/KhanehRemap-PrivateShell-unsigned.apk > artifact/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: khanehremap-apk-unsigned
          path: artifact/
          if-no-files-found: error
