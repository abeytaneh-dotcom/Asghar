name: Build DirectYar Android APK
on:
  push:
    branches: [feat/directyar-android-mvp]
    paths:
      - 'instagram-manager/**'
      - '.github/workflows/build-directyar.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile v1.1
        working-directory: instagram-manager
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DirectYar-v1.1-apk
          path: instagram-manager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
