name: Apply Tehran Safe Errors
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/apply-tehran-safe-errors.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Finalize safe error surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('TehranSupermarket')

          # Admin order: safe semantic 404.
          p=root/'admin_order_edit.php'; s=p.read_text()
          s=s.replace("if(!$order){http_response_code(404);exit('سفارش پیدا نشد.');}", "if(!$order)ts_html_fail('ORD-801',404,'admin.php');")
          p.write_text(s)

          # Role enforcement: never explain protected implementation details.
          p=root/'admin.php'; s=p.read_text()
          s=s.replace("http_response_code(403);exit('دسترسی این حساب فقط به سفارش‌ها محدود است.');", "ts_html_fail('AUTH-104',403,'admin.php');")
          p.write_text(s)

          # Frontend scanner/upload: remove raw console exceptions and show only safe codes.
          p=root/'assets/admin.js'; s=p.read_text()
          s=re.sub(r"console\.error\([^;]*\);", "", s)
          s=s.replace("function cameraErrorMessage(e){const n=e?.name||'';if(!window.isSecureContext)return 'دوربین زنده فقط روی HTTPS باز می‌شود؛ از دکمه «عکس بارکد» استفاده کنید.';if(!navigator.mediaDevices?.getUserMedia)return 'این مرورگر داخلی دوربین زنده را پشتیبانی نمی‌کند؛ دکمه «عکس بارکد» را بزنید.';if(n==='NotAllowedError'||n==='PermissionDeniedError')return 'مجوز دوربین زنده رد شده است؛ دکمه «عکس بارکد» را بزنید یا Camera را Allow کنید.';if(n==='NotFoundError'||n==='DevicesNotFoundError')return 'دوربین پیدا نشد؛ دکمه «عکس بارکد» را امتحان کنید.';if(n==='NotReadableError'||n==='TrackStartError')return 'دوربین درگیر برنامه دیگری است؛ دکمه «عکس بارکد» را امتحان کنید.';return 'دوربین زنده باز نشد؛ دکمه «عکس بارکد» را بزنید.';}", "function cameraErrorMessage(e){const n=e?.name||'';const c='کد خطا: BAR-801 — ';if(!window.isSecureContext)return c+'اسکن زنده در این صفحه در دسترس نیست. راه‌حل: از «عکس بارکد» استفاده کنید.';if(!navigator.mediaDevices?.getUserMedia)return c+'این مرورگر اسکن زنده را پشتیبانی نمی‌کند. راه‌حل: «عکس بارکد» را بزنید.';if(n==='NotAllowedError'||n==='PermissionDeniedError')return c+'مجوز دوربین داده نشده است. راه‌حل: Camera را Allow کنید یا «عکس بارکد» را بزنید.';if(n==='NotFoundError'||n==='DevicesNotFoundError')return c+'دوربین در دسترس نیست. راه‌حل: از «عکس بارکد» یا ورود دستی استفاده کنید.';if(n==='NotReadableError'||n==='TrackStartError')return c+'دوربین فعلاً قابل استفاده نیست. راه‌حل: برنامه دیگری که از دوربین استفاده می‌کند ببندید یا «عکس بارکد» را بزنید.';return c+'اسکن زنده باز نشد. راه‌حل: از «عکس بارکد» یا ورود دستی استفاده کنید.';}")
          s=s.replace("catch(e){setScan('بررسی بارکد انجام نشد؛ می‌توانید ادامه دهید.','warn');}", "catch(_e){setScan('کد خطا: BAR-803 — بررسی بارکد انجام نشد. راه‌حل: می‌توانید اطلاعات کالا را دستی ادامه دهید یا دوباره بررسی کنید.','warn');}")
          s=s.replace("setScan('عکس واضح است اما موتور بارکد عددی پیدا نکرد. لطفاً بارکد را طوری بگیرید که تمام خط‌ها و عدد زیر آن داخل عکس باشند؛ یا عدد زیر بارکد را دستی وارد کنید.','warn');", "setScan('کد خطا: BAR-802 — بارکد خوانده نشد. راه‌حل: عکس را صاف، نزدیک و با نور کافی بگیرید؛ همه خط‌ها و عدد زیر بارکد داخل تصویر باشد.','warn');")
          s=s.replace("catch(e){setScan('خواندن عکس با خطا روبه‌رو شد. یک‌بار دیگر عکس بارکد را بگیرید.','warn');}", "catch(_e){setScan('کد خطا: BAR-802 — بارکد از عکس خوانده نشد. راه‌حل: عکس واضح‌تری بگیرید یا عدد زیر بارکد را دستی وارد کنید.','warn');}")
          s=s.replace("if(!window.ZXing){setScan('اسکن زنده آماده نیست؛ دوربین گوشی برای عکس بارکد باز می‌شود.','warn');", "if(!window.ZXing){setScan('کد خطا: BAR-801 — اسکن زنده آماده نیست. راه‌حل: از عکس بارکد استفاده کنید.','warn');")

          # Replace the upload error path with a safe server-contract renderer.
          s=s.replace("status.textContent='در حال آماده‌سازی عکس برای فروشگاه…';\n  try{", "status.textContent='در حال آماده‌سازی عکس برای فروشگاه…';\n  let uploadSafe='کد خطا: IMG-305 — پردازش عکس انجام نشد. راه‌حل: یک عکس دیگر انتخاب کنید و دوباره تلاش کنید.';\n  try{")
          s=s.replace("let d=null;try{d=await r.json();}catch(_e){throw new Error(r.status===413?'حجم عکس قبل از رسیدن به برنامه توسط سرور رد شد.':'پاسخ نامعتبر از سرور دریافت شد.');}\n    if(!r.ok||!d?.ok)throw new Error(d?.error||'آپلود عکس انجام نشد.');", "let d=null;try{d=await r.json();}catch(_e){uploadSafe=r.status===413?'کد خطا: IMG-303 — حجم عکس بیش از حد مجاز است. راه‌حل: عکس کوچک‌تری انتخاب کنید.':'کد خطا: IMG-305 — پاسخ قابل پردازش دریافت نشد. راه‌حل: دوباره تلاش کنید و در صورت تکرار این کد را به پشتیبانی بدهید.';throw new Error('safe');}\n    if(!r.ok||!d?.ok){const code=d?.code||'IMG-305',title=d?.error||'آپلود عکس انجام نشد',message=d?.message||'',help=d?.help||'دوباره تلاش کنید.';uploadSafe=`کد خطا: ${code} — ${title}${message?' | '+message:''} راه‌حل: ${help}`;throw new Error('safe');}")
          s=s.replace("catch(e){\n    \n    productImageUploadFailed=true;\n    selectedPreview.innerHTML=`<div class=\"notice\">❌ عکس هنوز ثبت نشده: ${esc(e?.message||'خطای آپلود')}<br>دوباره عکس را انتخاب کنید.</div>`;\n    status.textContent='آپلود عکس انجام نشد؛ دوباره انتخاب کنید.';", "catch(_e){\n    productImageUploadFailed=true;\n    selectedPreview.innerHTML=`<div class=\"notice\">❌ ${esc(uploadSafe)}</div>`;\n    status.textContent=uploadSafe;")
          s=s.replace("alert('عکس هنوز در حال آپلود است. چند لحظه صبر کنید تا پیام «عکس آماده شد» نمایش داده شود.');", "alert('کد خطا: IMG-306 — آپلود عکس هنوز تمام نشده. راه‌حل: چند لحظه صبر کنید تا پیام موفقیت نمایش داده شود.');")
          s=s.replace("alert('آپلود عکس انجام نشده است. دوباره عکس را انتخاب کنید و صبر کنید تا ذخیره شود.');", "alert('کد خطا: IMG-305 — عکس روی سرور ذخیره نشده است. راه‌حل: دوباره عکس را انتخاب کنید و تا پایان آپلود صبر کنید.');")
          p.write_text(s)
          PY
          git diff --check
          find TehranSupermarket -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check TehranSupermarket/assets/admin.js
          node --check TehranSupermarket/assets/admin_push.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'abeytaneh-dotcom'
          git config user.email 'abeytaneh@gmail.com'
          git add TehranSupermarket
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize safe coded frontend and order errors'
          git push origin HEAD:websaza-hosting
