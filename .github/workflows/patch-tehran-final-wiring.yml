name: Patch Tehran Final Wiring
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-tehran-final-wiring.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch final wiring
        shell: python
        run: |
          from pathlib import Path
          files=['TehranSupermarket/admin.php','TehranSupermarket/admin_orders.php']
          for fn in files:
              p=Path(fn); s=p.read_text()
              if 'assets/admin_push.js' not in s:
                  s=s.replace('<script src="assets/order-alert.js?v=20261024"></script></body>', '<script src="assets/order-alert.js?v=20261024"></script><script src="assets/admin_push.js?v=20261024-bgpush"></script></body>')
              p.write_text(s)
          p=Path('TehranSupermarket/admin.php'); s=p.read_text()
          if 'admin_catalog.php' not in s:
              s=s.replace('<a href="admin_products.php">📦 کالاها</a>', '<a href="admin_products.php">📦 کالاها</a><a href="admin_catalog.php">🔎 مدیریت سریع کالاها</a>')
          p.write_text(s)
          p=Path('TehranSupermarket/shop.php'); s=p.read_text()
          if 'href="account.php"' not in s:
              s=s.replace('<a href="track.php">📦 پیگیری سفارش</a>', '<a href="track.php">📦 پیگیری سفارش</a> <a href="account.php">👤 سفارش‌های من</a>')
          p.write_text(s)
      - name: Validate
        run: |
          set -e
          find TehranSupermarket -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find TehranSupermarket/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check TehranSupermarket/sw.js
          grep -q 'admin_push.js' TehranSupermarket/admin.php
          grep -q 'admin_push.js' TehranSupermarket/admin_orders.php
          grep -q 'href="account.php"' TehranSupermarket/shop.php
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/admin.php TehranSupermarket/admin_orders.php TehranSupermarket/shop.php
          git diff --cached --quiet || git commit -m 'Expose customer account and complete Tehran operation wiring'
          git push origin HEAD:websaza-hosting
