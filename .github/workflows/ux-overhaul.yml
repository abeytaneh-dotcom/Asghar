          ?><!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جمع‌آوری سفارش‌ها | مدیریت</title><link rel="stylesheet" href="assets/style.css?v=20261024-orders"><style>.ops{max-width:980px;margin:20px auto;padding:0 14px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.filters a{white-space:nowrap;background:#fff;border:1px solid #e4ebe5;padding:8px 11px;border-radius:999px}.filters a.active{background:#11823b;color:#fff}.order-card{background:#fff;border:1px solid #e3ebe5;border-radius:18px;margin:14px 0;padding:15px;box-shadow:0 4px 18px #1831260a}.order-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-meta{font-size:12px;color:#718078;line-height:1.8}.pick-progress{height:8px;border-radius:8px;background:#edf2ee;overflow:hidden;margin:10px 0}.pick-progress i{display:block;height:100%;background:#11823b}.pick-item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eef1ef}.pick-item img,.pick-photo{width:60px;height:60px;object-fit:contain;border-radius:10px;border:1px solid #e7ece8}.picked{opacity:.55}.picked .item-name{text-decoration:line-through}.item-name{font-weight:800}.barcode{display:inline-block;font-family:monospace;direction:ltr;background:#f3f6f3;padding:3px 6px;border-radius:6px;font-size:11px}.pick-btn{min-width:82px}.pick-btn.done{background:#e5f5e8;color:#11823b}.status-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.status-row form{margin:0}.status-row button{padding:8px 10px;font-size:11px}.customer-box{background:#f7faf7;border-radius:12px;padding:10px;margin-top:10px;font-size:12px;line-height:1.8}.print-btn{background:#eef5ff;color:#245a9a}.danger{background:#fff0ee;color:#a62a22}.empty{padding:35px;text-align:center}@media(max-width:650px){.ops{padding:0 9px}.pick-item{grid-template-columns:52px 1fr}.pick-item img,.pick-photo{width:50px;height:50px}.pick-item .pick-btn{grid-column:1/-1;width:100%}.order-top{flex-direction:column}.status-row button{flex:1}.top .brand small{display:none}}</style></head><body><header class="top"><a class="brand" href="admin.php"><span class="logo">🧺</span><span><b>جمع‌آوری سفارش‌ها</b><small>کار روزانه فروشگاه</small></span></a><a class="btn pale" href="admin.php">مدیریت اصلی</a></header><main class="ops"><?php if($msg):?><div class="success"><?=e($msg)?></div><?php endif;?><?php if($err):?><div class="notice"><?=e($err)?></div><?php endif;?><div class="filters"><?php foreach(['active'=>'فعال','new'=>'جدید','preparing'=>'جمع‌آوری','ready'=>'آماده','out'=>'در مسیر','delivered'=>'تحویل‌شده','cancelled'=>'لغوشده'] as $k=>$v):?><a class="<?=$filter===$k?'active':''?>" href="admin_orders.php?status=<?=e($k)?>"><?=e($v)?></a><?php endforeach;?></div><?php if(!$orders):?><div class="panel empty">سفارشی در این بخش نیست.</div><?php endif;?><?php foreach($orders as $o):$its=$items[(int)$o['id']]??[];$picked=0;foreach($its as $x)$picked+=(int)$x['picked'];$total=count($its);$pct=$total?round($picked/$total*100):0;?><article class="order-card" id="order-<?=(int)$o['id']?>"><div class="order-top"><div><h2 style="margin:0">سفارش #<?=(int)$o['id']?> · <?=e($labels[$o['status']]??$o['status'])?></h2><div class="order-meta"><?=e($o['created_at'])?> · <?=e($o['delivery_slot'])?></div></div><div><b><?=toman($o['total'])?></b><br><button class="btn print-btn" type="button" onclick="printCard(<?=(int)$o['id']?>)">🖨 چاپ</button></div></div><div class="pick-progress"><i style="width:<?=$pct?>%"></i></div><div class="muted"><?=$picked?> از <?=$total?> قلم جمع‌آوری شده</div><?php foreach($its as $it):?><div class="pick-item <?=$it['picked']?'picked':''?>"><?php if(!empty($it['image_path'])):?><img src="<?=e($it['image_path'])?>" alt=""><?php else:?><div class="pick-photo" style="display:grid;place-items:center">🛒</div><?php endif;?><div><div class="item-name"><?=e($it['product_name'])?></div><div><?=number_format((int)$it['quantity'])?> عدد × <?=toman($it['unit_price'])?></div><span class="barcode"><?=e($it['show_barcode']?:'بدون بارکد')?></span><?php if(!empty($it['pyramid_code2'])):?><span class="muted"> · Code2: <?=e($it['pyramid_code2'])?></span><?php endif;?></div><form method="post"><input type="hidden" name="csrf" value="<?=e(token())?>"><input type="hidden" name="action" value="toggle_item"><input type="hidden" name="order_id" value="<?=(int)$o['id']?>"><input type="hidden" name="item_id" value="<?=(int)$it['id']?>"><button class="btn pick-btn <?=$it['picked']?'done':''?>"><?=$it['picked']?'✓ برداشتم':'برداشتم'?></button></form></div><?php endforeach;?><div class="customer-box"><b><?=e($o['customer_name'])?></b> · <a href="tel:<?=e($o['phone'])?>"><?=e($o['phone'])?></a><br><?=e($o['address'])?></div><div class="status-row"><?php foreach(['confirmed'=>'تأیید','preparing'=>'جمع‌آوری','ready'=>'آماده','out'=>'ارسال شد','delivered'=>'تحویل شد'] as $k=>$v):?><form method="post"><input type="hidden" name="csrf" value="<?=e(token())?>"><input type="hidden" name="action" value="set_status"><input type="hidden" name="order_id" value="<?=(int)$o['id']?>"><input type="hidden" name="status" value="<?=e($k)?>"><button class="btn <?=$o['status']===$k?'pale':''?>"><?=e($v)?></button></form><?php endforeach;?><?php if($o['status']!=='cancelled'&&$o['status']!=='delivered'):?><form method="post" onsubmit="return confirm('سفارش لغو شود و موجودی همه کالاها به فروشگاه برگردد؟');"><input type="hidden" name="csrf" value="<?=e(token())?>"><input type="hidden" name="action" value="set_status"><input type="hidden" name="order_id" value="<?=(int)$o['id']?>"><input type="hidden" name="status" value="cancelled"><button class="btn danger">لغو + برگشت موجودی</button></form><?php endif;?></div></article><?php endforeach;?></main><script>function printCard(id){const el=document.getElementById('order-'+id);if(!el)return;const w=window.open('','_blank','width=700,height=900');w.document.write('<meta charset="utf-8"><title>سفارش '+id+'</title><style>body{font-family:Tahoma;direction:rtl;padding:20px}.pick-btn,.status-row,.print-btn{display:none}.pick-item{display:grid;grid-template-columns:60px 1fr;gap:10px;border-top:1px solid #ddd;padding:10px}.pick-item img,.pick-photo{width:55px;height:55px;object-fit:contain}.barcode{font-family:monospace;direction:ltr}.customer-box{margin-top:15px}</style>'+el.outerHTML);w.document.close();w.focus();setTimeout(()=>w.print(),300);}</script></body></html>
