name: Vendor Tehran Leaflet
on:
  push:
    branches: [websaza-hosting]
    paths: ['.github/workflows/vendor-tehran-leaflet.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Vendor Leaflet and switch storefront to local assets
        run: |
          set -euo pipefail
          mkdir -p TehranSupermarket/assets/leaflet/images
          BASE='https://unpkg.com/leaflet@1.9.4/dist'
          curl -fsSL --retry 3 "$BASE/leaflet.js" -o TehranSupermarket/assets/leaflet/leaflet.js
          curl -fsSL --retry 3 "$BASE/leaflet.css" -o TehranSupermarket/assets/leaflet/leaflet.css
          for f in layers.png layers-2x.png marker-icon.png marker-icon-2x.png marker-shadow.png; do
            curl -fsSL --retry 3 "$BASE/images/$f" -o "TehranSupermarket/assets/leaflet/images/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">','<link rel="stylesheet" href="assets/leaflet/leaflet.css?v=1.9.4">')
          s=s.replace('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>','<script src="assets/leaflet/leaflet.js?v=1.9.4"></script>')
          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
          node --check TehranSupermarket/assets/leaflet/leaflet.js
          rm -f .github/workflows/vendor-tehran-leaflet.yml
      - name: Commit vendored map library
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Vendor Leaflet locally for Tehran delivery map"
          git push origin HEAD:websaza-hosting
