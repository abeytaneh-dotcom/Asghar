name: Patch Tehran Geolocation Simple
on:
  push:
    paths:
      - '.github/workflows/patch-tehran-geolocation-simple.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Simplify current-location logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()
          start=s.find("let accuracyCircle=null")
          end=s.find("setTimeout(()=>map.invalidateSize(),100);", start)
          if start<0 or end<0:
              raise SystemExit('geolocation block not found')
          end += len("setTimeout(()=>map.invalidateSize(),100);")
          new="""let accuracyCircle=null;function stopAccuracyCircle(){if(accuracyCircle){map.removeLayer(accuracyCircle);accuracyCircle=null;}}function showCurrentPosition(pos){const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.max(1,Math.round(Number(pos.coords.accuracy||0)));choose(lat,lng,acc,true);stopAccuracyCircle();accuracyCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:1,fillColor:'#64b5f6',fillOpacity:.13}).addTo(map);geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';if(acc<=80){st.className='locstatus ok';st.textContent='✅ موقعیت گوشی پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر. اگر درست است «ثبت این نقطه» را بزنید.';}else{st.className='locstatus warn';st.textContent='⚠️ موقعیت گوشی پیدا شد اما دقت آن حدود '+acc.toLocaleString('fa-IR')+' متر است. سنجاق جابه‌جا شد؛ در صورت نیاز آن را دستی روی محل دقیق تحویل ببرید.';}}function showGeoError(err){geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';st.className='locstatus warn';if(err&&err.code===1)st.textContent='اجازه دسترسی به موقعیت برای Chrome داده نشده است. مجوز Location را برای این سایت فعال کنید یا نقطه را دستی انتخاب کنید.';else if(err&&err.code===2)st.textContent='گوشی نتوانست موقعیت فعلی را پیدا کند. GPS/Location را روشن کنید و دوباره بزنید، یا نقطه را دستی انتخاب کنید.';else if(err&&err.code===3)st.textContent='دریافت موقعیت طول کشید و متوقف شد. دوباره امتحان کنید یا نقطه را دستی انتخاب کنید.';else st.textContent='موقعیت فعلی دریافت نشد. می‌توانید محل تحویل را دستی روی نقشه انتخاب کنید.';}geoBtn.addEventListener('click',()=>{if(!navigator.geolocation){showGeoError({code:0});return;}geoBtn.disabled=true;geoBtn.textContent='در حال پیدا کردن موقعیت…';st.className='locstatus';st.textContent='در حال دریافت موقعیت گوشی…';navigator.geolocation.getCurrentPosition(showCurrentPosition,showGeoError,{enableHighAccuracy:true,timeout:15000,maximumAge:0});});setTimeout(()=>map.invalidateSize(),100);"""
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          git commit -m 'Simplify Tehran current location geolocation flow' || exit 0
          git push origin HEAD:websaza-hosting
