name: WebSaza Visual QA

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/**'
      - '.github/workflows/websaza-visual-test.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment
        run: sleep 40

      - name: Check live page
        run: |
          curl -fsSI --max-time 20 https://websaza.ir/ | head -n 10

      - name: Capture realistic viewport screenshots
        shell: bash
        run: |
          set -e
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"

          capture() {
            local size="$1"
            local file="$2"
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size="$size" \
              --screenshot="$GITHUB_WORKSPACE/$file" \
              https://websaza.ir/
          }

          capture 1280,720  websaza-1280x720.png
          capture 1366,768  websaza-1366x768.png
          capture 1440,900  websaza-1440x900.png
          capture 1600,900  websaza-1600x900.png
          capture 1920,1080 websaza-1920x1080.png
          capture 390,844   websaza-mobile-390x844.png
          capture 430,932   websaza-mobile-430x932.png

          ls -lh "$GITHUB_WORKSPACE"/websaza-*.png

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: websaza-visual-qa
          path: websaza-*.png
          retention-days: 3
