name: Test Tehran Map Tile
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/test-tehran-map-tile.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check production map tile
        shell: bash
        run: |
          set -euo pipefail
          URL='https://websaza.ir/tehran/map_tile.php?z=14&x=10548&y=6627'
          curl -fsSL --retry 2 --max-time 25 -D headers.txt -o tile.png "$URL"
          grep -qi '^content-type: image/png' headers.txt
          test "$(wc -c < tile.png)" -gt 1000
          file tile.png | grep -qi 'PNG image data'
          echo 'Production map tile OK'
