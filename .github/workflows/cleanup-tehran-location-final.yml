name: Finalize Tehran Delivery Location UX
on:
  push:
    paths:
      - '.github/workflows/cleanup-tehran-location-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Clean and finalize location picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text()

          # Remove CSS left from older inline map implementations, keeping Leaflet shared styling.
          s=re.sub(r"\.locbox\{.*?@media\(max-width:800px\)\{\.hero", ".leaflet-container{font-family:inherit}.leaflet-control-attribution{font-size:8px!important;opacity:.72}.leaflet-control-zoom a{color:#17472e!important}@media(max-width:800px){.hero", s, count=1, flags=re.S)

          # Refine final picker styles: clearer CTA, fixed pin, safe-area bottom, compact status.
          s=s.replace(".location-main-btn{width:100%;border:1px solid #dce9df;background:#f7faf7;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:right;font:inherit;color:#173b28;cursor:pointer}",
                      ".location-main-btn{width:100%;border:1px solid #cfe3d4;background:#f4faf5;border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:12px;text-align:right;font:inherit;color:#173b28;cursor:pointer;box-shadow:0 1px 0 #fff inset}")
          s=s.replace(".location-sheet-status{padding:10px 14px;background:#f7faf7;color:#5d6d63;font-size:12px;line-height:1.7;text-align:center;border-top:1px solid #e6ece8}",
                      ".location-sheet-status{padding:9px 14px;background:#f7faf7;color:#5d6d63;font-size:12px;line-height:1.6;text-align:center;border-top:1px solid #e6ece8;min-height:38px;display:flex;align-items:center;justify-content:center}")
          s=s.replace(".location-confirm{margin:10px 14px calc(10px + env(safe-area-inset-bottom));width:calc(100% - 28px);padding:14px;font-size:16px}",
                      ".location-confirm{margin:10px 14px calc(10px + env(safe-area-inset-bottom));width:calc(100% - 28px);padding:15px;font-size:16px;font-weight:800}")

          old="""<script>(()=>{const openBtn=document.getElementById('openLocationPicker'),changeBtn=document.getElementById('changeLocation'),sheet=document.getElementById('locationSheet'),closeBtn=document.getElementById('closeLocationPicker'),meBtn=document.getElementById('locationMe'),confirmBtn=document.getElementById('confirmLocation'),status=document.getElementById('locationPickerStatus'),picked=document.getElementById('locationPicked'),title=document.getElementById('locationMainTitle'),sub=document.getElementById('locationMainSub'),la=document.getElementById('delivery_lat'),ln=document.getElementById('delivery_lng'),ac=document.getElementById('delivery_accuracy');if(!openBtn||!sheet||typeof L==='undefined')return;const home=[32.48814,51.773119];let map=null,tiles=null,lastAcc=null,locating=false;function ensureMap(){if(map)return;map=L.map('deliveryMap',{zoomControl:true,attributionControl:true}).setView(home,15);tiles=L.tileLayer('map_tile.php?z={z}&x={x}&y={y}',{maxZoom:19,minZoom:3,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);tiles.on('tileerror',()=>{status.textContent='نقشه در حال بارگذاری مجدد است…';setTimeout(()=>tiles.redraw(),700);});map.on('movestart',()=>{status.textContent='نقشه را حرکت دهید تا سنجاق روی محل دقیق تحویل قرار بگیرد.';});map.on('moveend',()=>{if(!locating)status.textContent='اگر سنجاق روی محل درست است، «تأیید این لوکیشن» را بزنید.';});}function refreshMap(){setTimeout(()=>{if(map){map.invalidateSize(true);if(tiles)tiles.redraw();}},120);}function openPicker(){sheet.hidden=false;document.body.classList.add('location-sheet-open');ensureMap();if(la.value&&ln.value){map.setView([Number(la.value),Number(ln.value)],17);status.textContent='لوکیشن قبلی نمایش داده شد؛ در صورت نیاز نقشه را جابه‌جا کنید.';refreshMap();return;}refreshMap();findMe(true);}function closePicker(){sheet.hidden=true;document.body.classList.remove('location-sheet-open');}function findMe(auto=false){if(!navigator.geolocation){status.textContent='موقعیت خودکار در این مرورگر در دسترس نیست؛ نقشه را دستی جابه‌جا کنید.';return;}if(locating)return;locating=true;meBtn.disabled=true;status.textContent='در حال پیدا کردن موقعیت شما…';navigator.geolocation.getCurrentPosition(pos=>{locating=false;meBtn.disabled=false;const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.max(1,Math.round(Number(pos.coords.accuracy||0)));lastAcc=acc;map.setView([lat,lng],acc<=100?18:acc<=500?16:14);refreshMap();status.textContent=acc<=120?'موقعیت شما پیدا شد؛ در صورت نیاز نقشه را کمی جابه‌جا کنید.':'موقعیت تقریبی پیدا شد؛ نقشه را با دست روی محل دقیق تحویل تنظیم کنید.';},err=>{locating=false;meBtn.disabled=false;lastAcc=null;status.textContent='موقعیت خودکار پیدا نشد؛ فقط نقشه را با دست روی محل تحویل ببرید.';},{enableHighAccuracy:true,timeout:10000,maximumAge:15000});}function confirm(){ensureMap();const c=map.getCenter();la.value=Number(c.lat).toFixed(7);ln.value=Number(c.lng).toFixed(7);ac.value=lastAcc&&lastAcc<=120?String(lastAcc):'';picked.hidden=false;title.textContent='لوکیشن تحویل ثبت شد';sub.textContent='برای تغییر دوباره بزنید';closePicker();}openBtn.addEventListener('click',openPicker);if(changeBtn)changeBtn.addEventListener('click',openPicker);closeBtn.addEventListener('click',closePicker);meBtn.addEventListener('click',()=>findMe(false));confirmBtn.addEventListener('click',confirm);})();</script>"""

          new="""<script>(()=>{const openBtn=document.getElementById('openLocationPicker'),changeBtn=document.getElementById('changeLocation'),sheet=document.getElementById('locationSheet'),closeBtn=document.getElementById('closeLocationPicker'),meBtn=document.getElementById('locationMe'),confirmBtn=document.getElementById('confirmLocation'),status=document.getElementById('locationPickerStatus'),picked=document.getElementById('locationPicked'),title=document.getElementById('locationMainTitle'),sub=document.getElementById('locationMainSub'),la=document.getElementById('delivery_lat'),ln=document.getElementById('delivery_lng'),ac=document.getElementById('delivery_accuracy');if(!openBtn||!sheet||typeof L==='undefined')return;const home=[32.48814,51.773119],storageKey='tehran_delivery_location_v1';let map=null,tiles=null,lastAcc=null,locating=false,programmaticMove=false;function saveDraft(){if(!la.value||!ln.value)return;try{sessionStorage.setItem(storageKey,JSON.stringify({lat:la.value,lng:ln.value,acc:ac.value||''}));}catch(e){}}function restoreDraft(){if(la.value&&ln.value)return;try{const d=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(d&&d.lat&&d.lng){la.value=d.lat;ln.value=d.lng;ac.value=d.acc||'';picked.hidden=false;title.textContent='لوکیشن تحویل ثبت شد';sub.textContent='برای تغییر دوباره بزنید';}}catch(e){}}function ensureMap(){if(map)return;map=L.map('deliveryMap',{zoomControl:true,attributionControl:true}).setView(home,15);tiles=L.tileLayer('map_tile.php?z={z}&x={x}&y={y}',{maxZoom:19,minZoom:3,attribution:'&copy; OpenStreetMap contributors',keepBuffer:3,updateWhenIdle:true}).addTo(map);tiles.on('tileerror',()=>{status.textContent='در حال بارگذاری نقشه…';setTimeout(()=>tiles.redraw(),800);});map.on('movestart',()=>{if(!programmaticMove){lastAcc=null;ac.value='';status.textContent='نقشه را حرکت دهید تا سنجاق روی محل دقیق تحویل باشد.';}});map.on('moveend',()=>{programmaticMove=false;if(!locating)status.textContent='اگر محل درست است، «تأیید این لوکیشن» را بزنید.';});}function refreshMap(){setTimeout(()=>{if(map){map.invalidateSize(true);if(tiles)tiles.redraw();}},100);}function setView(lat,lng,zoom){programmaticMove=true;map.setView([lat,lng],zoom);refreshMap();}function openPicker(){sheet.hidden=false;document.body.classList.add('location-sheet-open');ensureMap();if(la.value&&ln.value){setView(Number(la.value),Number(ln.value),17);status.textContent='لوکیشن انتخاب‌شده نمایش داده شد.';return;}setView(home[0],home[1],15);status.textContent='نقشه را جابه‌جا کنید یا برای نزدیک شدن، دکمه موقعیت من را بزنید.';}function closePicker(){sheet.hidden=true;document.body.classList.remove('location-sheet-open');}function findMe(){if(!navigator.geolocation){status.textContent='موقعیت خودکار در دسترس نیست؛ نقشه را دستی جابه‌جا کنید.';return;}if(locating)return;locating=true;meBtn.disabled=true;status.textContent='در حال پیدا کردن موقعیت شما…';navigator.geolocation.getCurrentPosition(pos=>{locating=false;meBtn.disabled=false;const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.max(1,Math.round(Number(pos.coords.accuracy||0)));lastAcc=acc;setView(lat,lng,acc<=100?18:acc<=500?16:14);status.textContent=acc<=120?'موقعیت پیدا شد؛ اگر درست است تأیید کنید.':'موقعیت تقریبی است؛ نقشه را با دست روی محل دقیق تنظیم کنید.';},()=>{locating=false;meBtn.disabled=false;lastAcc=null;status.textContent='موقعیت خودکار پیدا نشد؛ نقشه را دستی روی محل تحویل ببرید.';},{enableHighAccuracy:true,timeout:9000,maximumAge:10000});}function confirm(){ensureMap();const c=map.getCenter();la.value=Number(c.lat).toFixed(7);ln.value=Number(c.lng).toFixed(7);ac.value=lastAcc&&lastAcc<=120?String(lastAcc):'';saveDraft();picked.hidden=false;title.textContent='لوکیشن تحویل ثبت شد';sub.textContent='برای تغییر دوباره بزنید';closePicker();}restoreDraft();openBtn.addEventListener('click',openPicker);if(changeBtn)changeBtn.addEventListener('click',openPicker);closeBtn.addEventListener('click',closePicker);meBtn.addEventListener('click',findMe);confirmBtn.addEventListener('click',confirm);})();</script>"""
          if old not in s:
              raise SystemExit('Final location script anchor not found')
          s=s.replace(old,new,1)

          # Bump shop css query to make the final UX visible immediately.
          s=s.replace('assets/style.css?v=20261024-shop2','assets/style.css?v=20261024-shop3')
          p.write_text(s)
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TehranSupermarket/shop.php
          git diff --cached --quiet || git commit -m "Finalize delivery location picker and remove legacy map code"
          git push origin HEAD:websaza-hosting
