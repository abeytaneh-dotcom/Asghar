name: Deploy Tehran AI Auto Commit

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/deploy-tehran-ai-autocommit'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      CPANEL_BASE: https://mch4444.dnsuserver.com:2083
      CPANEL_USER: vt6qdx8
      SITE_DIR: public_html/tehran
      SITE_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting

      - name: Load auto-commit helper
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/index.php')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/ai_assistant_autocommit.js?v=20261026-1"></script>'
          if tag not in s:
              marker='$aiAssistant = '
              pos=s.find(marker)
              if pos<0:
                  raise SystemExit('AI loader marker not found')
              needle="$html = str_replace('</body>', $aiAssistant.'</body>', $html);"
              if needle not in s:
                  raise SystemExit('AI loader insertion point not found')
              s=s.replace(needle, needle+"\n\n$aiAutoCommit = '<script src=\"assets/ai_assistant_autocommit.js?v=20261026-1\"></script>';\n$html = str_replace('</body>', $aiAutoCommit.'</body>', $html);",1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check TehranSupermarket/assets/ai_assistant_autocommit.js
          php -l TehranSupermarket/index.php
          grep -q 'ai_assistant_autocommit.js?v=20261026-1' TehranSupermarket/index.php

      - name: Commit storefront loader
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/index.php
          if ! git diff --cached --quiet; then
            git commit -m 'Load Tehran AI default quantity helper'
            git push origin HEAD:websaza-hosting
          fi

      - name: Deploy helper and storefront
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){ local file="$1" dir="$2" name="$3"; curl -sS --fail-with-body -H "$AUTH" -F "file-1=@${file};filename=${name}" -F "dir=${dir}" -F 'overwrite=1' "$CPANEL_BASE/execute/Fileman/upload_files" | jq -e '(.result.status // .status)==1' >/dev/null; }
          upload 'TehranSupermarket/assets/ai_assistant_autocommit.js' "$SITE_DIR/assets" 'ai_assistant_autocommit.js'
          upload 'TehranSupermarket/index.php' "$SITE_DIR" 'index.php'

      - name: Verify auto-commit live
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -sS --fail --max-time 30 "$SITE_URL/?v=$(date +%s)" -o "$RUNNER_TEMP/home.html"
          grep -q 'ai_assistant_autocommit.js?v=20261026-1' "$RUNNER_TEMP/home.html"
          curl -sS --fail --max-time 30 "$SITE_URL/assets/ai_assistant_autocommit.js?v=$(date +%s)" -o "$RUNNER_TEMP/auto.js"
          grep -q 'commitPending' "$RUNNER_TEMP/auto.js"
          grep -q "dataset.qty||1" "$RUNNER_TEMP/auto.js"
          node --check "$RUNNER_TEMP/auto.js"
