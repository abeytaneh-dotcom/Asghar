name: Build Tehran Manager APK

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'TehranManagerApp/**'
      - '.github/workflows/build-tehran-manager-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tehran-manager-signing-v1

      - name: Prepare Android SDK and signing key
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' >/dev/null
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname 'CN=Tehran Manager,O=Websaza,C=IR' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p TehranManagerApp :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp TehranManagerApp/app/build/outputs/apk/release/app-release.apk dist/TehranManager-v1.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/TehranManager-v1.0.0.apk
          sha256sum dist/TehranManager-v1.0.0.apk > dist/TehranManager-v1.0.0.sha256.txt
          test -s dist/TehranManager-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TehranManager-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
