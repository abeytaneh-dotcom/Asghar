name: Export Tehran Products

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/export-tehran-products.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - name: Export catalog securely
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          TOKEN="$(openssl rand -hex 24)"
          FILE="catalog-export-${GITHUB_RUN_ID}.php"
          echo "::add-mask::$TOKEN"
          cat > "$RUNNER_TEMP/export.php" <<PHP
          <?php
          declare(strict_types=1);
          if (!hash_equals('${TOKEN}', (string)(\$_GET['k'] ?? ''))) { http_response_code(403); exit; }
          header('Content-Type: application/json; charset=utf-8');
          \$c=require __DIR__.'/config.php';
          \$pdo=new PDO('mysql:host='.\$c['db_host'].';dbname='.\$c['db_name'].';charset=utf8mb4',\$c['db_user'],\$c['db_pass'],[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          \$rows=\$pdo->query("SELECT id,barcode,name,brand,quantity_label,category,price,stock,active,image_path FROM products WHERE active=1 ORDER BY id ASC")->fetchAll();
          echo json_encode(['products'=>\$rows], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          SAVE="$RUNNER_TEMP/save.json"
          curl -sS --fail-with-body -H "$AUTH" --request POST \
            --data-urlencode 'dir=public_html/tehran' \
            --data-urlencode "file=$FILE" \
            --data-urlencode "content@$RUNNER_TEMP/export.php" \
            "${BASE}/execute/Fileman/save_file_content" -o "$SAVE"
          test "$(jq -r '.result.status // .status // 0' "$SAVE")" = '1'
          curl -sS --fail-with-body --max-time 30 "${PUBLIC_URL}/${FILE}?k=${TOKEN}" -o "$RUNNER_TEMP/products.json"
          jq -e '.products | type=="array"' "$RUNNER_TEMP/products.json" >/dev/null
          # remove temp endpoint immediately
          curl -sS --fail-with-body -H "$AUTH" --request POST \
            --data-urlencode 'dir=public_html/tehran' \
            --data-urlencode "file=$FILE" \
            "${BASE}/execute/Fileman/delete_files" -o "$RUNNER_TEMP/delete.json" || true
          echo "EXPORTED=$(jq '.products|length' "$RUNNER_TEMP/products.json")"
      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: tehran-products-${{ github.run_number }}
          path: ${{ runner.temp }}/products.json
          retention-days: 1
