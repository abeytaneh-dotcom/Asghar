# scalable-orders-v1-deploy-20261017
name: Deploy Namayandegi Portal

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/namayandegi/**'
      - '.github/workflows/deploy-namayandegi.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production assets
        shell: bash
        run: |
          set -euo pipefail
          export ASSET_VERSION="${GITHUB_SHA::8}"
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root=Path('WebSaza/namayandegi')
          v=os.environ['ASSET_VERSION']

          # Cache-busted assets.
          p=root/'index.php'
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'style\.css\?v=[^"\']+',f'style.css?v={v}',text)
          text=re.sub(r'app\.js\?v=[^"\']+',f'app.js?v={v}',text)

          # Request-local JSON cache: eliminates repeated disk reads/decodes while
          # preserving the existing storage format and updating cache after writes.
          old_j="function j(string $f):array{$x=json_decode((string)@file_get_contents($f),true);return is_array($x)?$x:[];}"
          new_j="function j(string $f):array{$c=&$GLOBALS['_WSJ_CACHE'];if(!is_array($c??null))$c=[];if(array_key_exists($f,$c))return $c[$f];$x=json_decode((string)@file_get_contents($f),true);return $c[$f]=is_array($x)?$x:[];}"
          old_sj="function sj(string $f,array $x):bool{$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);return rename($t,$f);}finally{flock($l,LOCK_UN);fclose($l);}}"
          new_sj="function sj(string $f,array $x):bool{$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);$ok=rename($t,$f);if($ok){$c=&$GLOBALS['_WSJ_CACHE'];if(!is_array($c??null))$c=[];$c[$f]=$x;}return $ok;}finally{flock($l,LOCK_UN);fclose($l);}}"
          if old_j not in text or old_sj not in text:
              raise SystemExit('index.php storage functions changed; performance patch aborted safely')
          text=text.replace(old_j,new_j,1).replace(old_sj,new_sj,1)

          # Daily compaction of larger live JSON stores. This converts legacy
          # pretty-printed data to compact JSON without changing any records.
          old_tick="function systemTick(bool $force=false):array{if(!$force&&is_file(T)){ $last=(int)@file_get_contents(T); if($last>time()-300)return ['expired'=>0,'assigned'=>0]; }$x=recycleExpired();$a=fillQuotas();@file_put_contents(T,(string)time(),LOCK_EX);return ['expired'=>$x,'assigned'=>$a];}"
          new_tick="function compactStore():void{$stamp=D.'/last_compact.txt';$last=is_file($stamp)?(int)@file_get_contents($stamp):0;if($last>time()-86400)return;foreach([B,L,A,EV,R] as $f){clearstatcache(true,$f);if(is_file($f)&&(int)@filesize($f)>262144){$rows=j($f);sj($f,$rows);}}@file_put_contents($stamp,(string)time(),LOCK_EX);} function systemTick(bool $force=false):array{if(!$force&&is_file(T)){ $last=(int)@file_get_contents(T); if($last>time()-300)return ['expired'=>0,'assigned'=>0]; }compactStore();$x=recycleExpired();$a=fillQuotas();@file_put_contents(T,(string)time(),LOCK_EX);return ['expired'=>$x,'assigned'=>$a];}"
          if old_tick not in text:
              raise SystemExit('index.php systemTick changed; compaction patch aborted safely')
          text=text.replace(old_tick,new_tick,1)
          p.write_text(text,encoding='utf-8')

          # Apply the same request-local cache + compact writes to smart actions.
          p=root/'smart-actions.php'
          text=p.read_text(encoding='utf-8')
          old_jx="function jx(string $f):array{$x=json_decode((string)@file_get_contents($f),true);return is_array($x)?$x:[];}"
          new_jx="function jx(string $f):array{$c=&$GLOBALS['_WSJX_CACHE'];if(!is_array($c??null))$c=[];if(array_key_exists($f,$c))return $c[$f];$x=json_decode((string)@file_get_contents($f),true);return $c[$f]=is_array($x)?$x:[];}"
          old_sjx="function sjx(string $f,array $x):bool{$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);return rename($t,$f);}finally{flock($l,LOCK_UN);fclose($l);}}"
          new_sjx="function sjx(string $f,array $x):bool{$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);$ok=rename($t,$f);if($ok){$c=&$GLOBALS['_WSJX_CACHE'];if(!is_array($c??null))$c=[];$c[$f]=$x;}return $ok;}finally{flock($l,LOCK_UN);fclose($l);}}"
          if old_jx not in text or old_sjx not in text:
              raise SystemExit('smart-actions.php storage functions changed; performance patch aborted safely')
          text=text.replace(old_jx,new_jx,1).replace(old_sjx,new_sjx,1)
          p.write_text(text,encoding='utf-8')

          # Finance uses the same JSON backend; optimize it too.
          p=root/'finance.php'
          text=p.read_text(encoding='utf-8')
          old_fin="function j($f){$x=json_decode((string)@file_get_contents($f),true);return is_array($x)?$x:[];}function sj($f,$x){$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);return rename($t,$f);}finally{flock($l,LOCK_UN);fclose($l);}}"
          new_fin="function j($f){$c=&$GLOBALS['_WSF_CACHE'];if(!is_array($c??null))$c=[];if(array_key_exists($f,$c))return $c[$f];$x=json_decode((string)@file_get_contents($f),true);return $c[$f]=is_array($x)?$x:[];}function sj($f,$x){$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);$ok=rename($t,$f);if($ok){$c=&$GLOBALS['_WSF_CACHE'];if(!is_array($c??null))$c=[];$c[$f]=$x;}return $ok;}finally{flock($l,LOCK_UN);fclose($l);}}"
          if old_fin not in text:
              raise SystemExit('finance.php storage functions changed; performance patch aborted safely')
          text=text.replace(old_fin,new_fin,1)
          p.write_text(text,encoding='utf-8')
          PY

          if ! grep -Fq 'MOBILE_NAV_GRID_V2' WebSaza/namayandegi/style.css; then
            cat >> WebSaza/namayandegi/style.css <<'CSS'

          /* MOBILE_NAV_GRID_V2 */
          @media(max-width:980px){
            .layout{padding-bottom:150px}
            .mobile{display:grid;grid-auto-flow:row;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-columns:auto;gap:6px;width:100%;max-width:100vw;overflow:hidden;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
            .mobile a{grid-column:span 2;min-width:0;width:100%;min-height:48px;padding:6px 4px;border:1px solid #303844;border-radius:11px;background:#171c24;color:#d7dde5;font-size:10px;font-weight:900;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;overflow-wrap:anywhere}
            .mobile a.on{color:#11151c;background:var(--brand);border-color:var(--brand)}
            .mobile a:nth-child(5):nth-last-child(3){grid-column:2/span 2}.mobile a:nth-child(6):nth-last-child(2){grid-column:4/span 2}.mobile a:nth-child(7):last-child{grid-column:6/span 2}.mobile a:nth-child(5):nth-last-child(2){grid-column:3/span 2}.mobile a:nth-child(6):last-child{grid-column:5/span 2}
          }
          CSS
          fi

          printf '\n' >> WebSaza/namayandegi/style.css
          cat WebSaza/namayandegi/ux.css >> WebSaza/namayandegi/style.css
          printf '\n' >> WebSaza/namayandegi/style.css
          cat WebSaza/namayandegi/simple-v2.css >> WebSaza/namayandegi/style.css
          printf '\n' >> WebSaza/namayandegi/style.css
          cat WebSaza/namayandegi/polish-v6.css >> WebSaza/namayandegi/style.css
          printf '\n' >> WebSaza/namayandegi/style.css
          cat WebSaza/namayandegi/market-v8.css >> WebSaza/namayandegi/style.css
          printf '\n' >> WebSaza/namayandegi/app.js
          cat WebSaza/namayandegi/simple-v2.js >> WebSaza/namayandegi/app.js
          printf '\n' >> WebSaza/namayandegi/app.js
          cat WebSaza/namayandegi/polish-v6.js >> WebSaza/namayandegi/app.js
          printf '\n' >> WebSaza/namayandegi/app.js
          cat WebSaza/namayandegi/market-v8.js >> WebSaza/namayandegi/app.js
          printf '\n' >> WebSaza/namayandegi/app.js
          cat WebSaza/namayandegi/performance-v1.js >> WebSaza/namayandegi/app.js

      - name: Validate production build
        run: |
          php -l WebSaza/namayandegi/index.php
          php -l WebSaza/namayandegi/smart-actions.php
          php -l WebSaza/namayandegi/finance.php
          node --check WebSaza/namayandegi/app.js
          grep -F 'PERFORMANCE_V1' WebSaza/namayandegi/app.js >/dev/null

      - name: Ensure remote folder
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          response=$(curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=mkdir" \
            --data-urlencode "path=/home/vt6qdx8/public_html" \
            --data-urlencode "name=namayandegi" \
            --data-urlencode "permissions=0755" \
            "https://mch4444.dnsuserver.com:2083/json-api/cpanel")
          if [ "$(echo "$response" | jq -r '.cpanelresult.event.result // 0')" != "1" ]; then
            check=$(curl --fail-with-body --silent --show-error -H "$auth" "https://mch4444.dnsuserver.com:2083/execute/Fileman/list_files?dir=public_html&showdotfiles=1")
            echo "$check" | jq -e 'any(.data[]?; .file=="namayandegi" and .type=="dir")' >/dev/null
          fi

      - name: Upload portal files
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          upload_text(){
            src="$1"; name="$2"
            response=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
              --data-urlencode "dir=public_html/namayandegi" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$src" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$response" | jq -e '.status == 1' >/dev/null
          }
          upload_text WebSaza/namayandegi/index.php index.php
          upload_text WebSaza/namayandegi/style.css style.css
          upload_text WebSaza/namayandegi/app.js app.js
          upload_text WebSaza/namayandegi/smart-actions.php smart-actions.php
          upload_text WebSaza/namayandegi/finance.php finance.php
          upload_text WebSaza/namayandegi/.htaccess .htaccess

      - name: Verify live portal
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          v="${GITHUB_SHA::8}"
          curl -fsSI --max-time 30 https://websaza.ir/namayandegi/ | head -n 12
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/?verify=${v}" | grep -F "style.css?v=${v}" >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/style.css?v=${v}" | grep -F 'SIMPLE_DIVAR_V2' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/style.css?v=${v}" | grep -F 'POLISH_V6' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/style.css?v=${v}" | grep -F 'MARKET_V8' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'SIMPLE_DIVAR_V2' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'POLISH_V6' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'MARKET_V8' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'PERFORMANCE_V1' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'simple-more-btn' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'interested_transfer' >/dev/null
          curl -fsSI --max-time 30 https://websaza.ir/namayandegi/smart-actions.php | head -n 8
          curl -fsSI --max-time 30 https://websaza.ir/namayandegi/finance.php | head -n 8
          echo 'Compression headers:'
          curl -fsSI --max-time 30 -H 'Accept-Encoding: br,gzip' "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -Ei 'content-encoding|cache-control|expires|vary' || true
