name: Deploy Namayandegi Portal

"on":
  push:
    branches: [websaza-hosting]
    paths:
      - "WebSaza/namayandegi/**"
      - ".github/workflows/deploy-namayandegi.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: namayandegi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production portal
        shell: bash
        run: |
          set -euo pipefail
          export ASSET_VERSION="${GITHUB_SHA::8}"
          python3 WebSaza/namayandegi/build-v5.py

      - name: Validate and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile WebSaza/namayandegi/*.py
          for f in index.php _security.php platform-v3.php smart-actions.php finance.php admin-control.php lead-ingest.php health.php backup-worker.php restore-backup.php sms-worker.php ops-worker.php db-export-v5.php sms-canary.php backup-download.php; do
            php -l "WebSaza/namayandegi/$f"
          done
          node --check WebSaza/namayandegi/app.js
          php WebSaza/namayandegi/self-test-v3.php | tee /tmp/self-test.log
          grep -F 'SELF_TEST_V4_PASS' /tmp/self-test.log >/dev/null
          grep -F 'WEBSAZA_PLATFORM_V4' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'admin_audit' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'ws_ingest_commit' WebSaza/namayandegi/lead-ingest.php >/dev/null
          grep -F 'ws_sms_process_queue' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'finance_ledger' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'CRM اختصاصی این مشتری' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'mark_seen' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'SINGLE_ENGINE_V3' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'SEEN_V3' WebSaza/namayandegi/app.js >/dev/null
          grep -F 'WEBSAZA_SUBMIT_GUARD_V5' WebSaza/namayandegi/app.js >/dev/null
          grep -F 'رمز ورود ۶ رقمی' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'name="password_confirm"' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'name="terms"' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'terms_accepted_at' WebSaza/namayandegi/index.php >/dev/null
          grep -F "mode==='privacy'" WebSaza/namayandegi/index.php >/dev/null
          grep -F 'verify_expires_at' WebSaza/namayandegi/finance.php >/dev/null
          grep -F '5242880' WebSaza/namayandegi/finance.php >/dev/null
          grep -F 'latest-export.tar.gz' WebSaza/namayandegi/backup-worker.php >/dev/null
          grep -F 'rb_copy_tree' WebSaza/namayandegi/restore-backup.php >/dev/null
          grep -F 'WEBSAZA_DEPLOY_LOCK_V5' WebSaza/namayandegi/.htaccess >/dev/null
          grep -F 'ws_location_bonus' WebSaza/namayandegi/smart-actions.php >/dev/null
          grep -F 'تأیید دستگاه جدید' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'sms_payment_safety_pattern' WebSaza/namayandegi/admin-control.php >/dev/null
          grep -F 'sms_retention_pattern' WebSaza/namayandegi/admin-control.php >/dev/null
          grep -F "action']??'')==='status'" WebSaza/namayandegi/lead-ingest.php >/dev/null
          grep -F 'Content-Security-Policy-Report-Only' WebSaza/namayandegi/.htaccess >/dev/null
          ! grep -Fq 'system_tick' WebSaza/namayandegi/index.php
          ! grep -Fq '$ok=dispatchLead' WebSaza/namayandegi/index.php
          ! grep -Fq 'https://edge.ippanel.com/v1/api/send' WebSaza/namayandegi/smart-actions.php
          ! grep -Fq 'https://edge.ippanel.com/v1/api/send' WebSaza/namayandegi/finance.php
          ! grep -Fq "\$_GET['key']" WebSaza/namayandegi/lead-ingest.php

      - name: Stage release candidate
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          endpoint="https://mch4444.dnsuserver.com:2083/json-api/cpanel"
          v="${GITHUB_SHA::8}"
          rc="namayandegi-rc-${v}"
          curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=mkdir" \
            --data-urlencode "path=/home/vt6qdx8/public_html" \
            --data-urlencode "name=$rc" \
            --data-urlencode "permissions=0755" "$endpoint" >/dev/null
          upload_text(){
            local src="$1" name="$2" r
            r=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
              --data-urlencode "dir=public_html/$rc" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$src" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$r" | jq -e '.status == 1' >/dev/null
          }
          for f in index.php _security.php platform-v3.php style.css app.js smart-actions.php finance.php admin-control.php lead-ingest.php health.php .htaccess; do
            upload_text "WebSaza/namayandegi/$f" "$f"
          done
          sleep 4
          html=$(curl -fsS --max-time 30 "https://websaza.ir/${rc}/?verify=${v}")
          echo "$html" | grep -F "style.css?v=${v}" >/dev/null
          reg=$(curl -fsS --max-time 30 "https://websaza.ir/${rc}/?mode=register&verify=${v}")
          echo "$reg" | grep -F 'رمز ورود ۶ رقمی' >/dev/null
          echo "$reg" | grep -F 'حریم خصوصی' >/dev/null
          echo "$reg" | grep -F 'name="terms"' >/dev/null
          health=$(curl -fsS --max-time 30 "https://websaza.ir/${rc}/health.php?v=${v}")
          echo "$health" | jq -e '.ok==true and .version=="platform-v4"' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://websaza.ir/${rc}/_data/settings.json")" = "403"

      - name: Prepare rollback snapshot and maintenance lock
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          endpoint="https://mch4444.dnsuserver.com:2083/json-api/cpanel"
          v="${GITHUB_SHA::8}"
          mkdir_api(){
            curl --silent --show-error -H "$auth" --request POST \
              --data-urlencode 'cpanel_jsonapi_user=vt6qdx8' --data-urlencode 'cpanel_jsonapi_apiversion=2' \
              --data-urlencode 'cpanel_jsonapi_module=Fileman' --data-urlencode 'cpanel_jsonapi_func=mkdir' \
              --data-urlencode "path=$1" --data-urlencode "name=$2" --data-urlencode 'permissions=0700' "$endpoint" >/dev/null
          }
          mkdir_api '/home/vt6qdx8' 'websaza_deploy_rollback'
          mkdir_api '/home/vt6qdx8/websaza_deploy_rollback' "$v"
          for f in index.php _security.php platform-v3.php style.css app.js smart-actions.php finance.php admin-control.php lead-ingest.php health.php backup-worker.php restore-backup.php sms-worker.php ops-worker.php .htaccess; do
            r=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
              --data-urlencode 'cpanel_jsonapi_user=vt6qdx8' --data-urlencode 'cpanel_jsonapi_apiversion=2' \
              --data-urlencode 'cpanel_jsonapi_module=Fileman' --data-urlencode 'cpanel_jsonapi_func=fileop' \
              --data-urlencode 'op=copy' --data-urlencode "sourcefiles=public_html/namayandegi/$f" \
              --data-urlencode "destfiles=websaza_deploy_rollback/$v" --data-urlencode 'doubledecode=1' "$endpoint")
            echo "$r" | jq -e '(.cpanelresult.event.result // 0) == 1' >/dev/null
          done
          # Install the lock-aware htaccess before creating the lock marker.
          r=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode 'dir=public_html/namayandegi' --data-urlencode 'file=.htaccess' \
            --data-urlencode 'content@WebSaza/namayandegi/.htaccess' \
            'https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content')
          echo "$r" | jq -e '.status==1' >/dev/null
          printf 'deploy=%s\nstarted=%s\n' "$v" "$(date -u +%FT%TZ)" >/tmp/deploying
          r=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
            --data-urlencode 'dir=public_html/namayandegi' --data-urlencode 'file=.deploying' \
            --data-urlencode 'content@/tmp/deploying' \
            'https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content')
          echo "$r" | jq -e '.status==1' >/dev/null
          touch /tmp/deploy_prepared

      - name: Upload production files under maintenance lock
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          upload_text(){
            local src="$1" name="$2" response
            response=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
              --data-urlencode 'dir=public_html/namayandegi' --data-urlencode "file=$name" \
              --data-urlencode "content@$src" 'https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content')
            echo "$response" | jq -e '.status == 1' >/dev/null
          }
          for f in index.php _security.php platform-v3.php style.css app.js smart-actions.php finance.php admin-control.php lead-ingest.php health.php backup-worker.php restore-backup.php sms-worker.php ops-worker.php db-export-v5.php sms-canary.php backup-download.php; do
            upload_text "WebSaza/namayandegi/$f" "$f"
          done

      - name: Release maintenance lock
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode 'dir=public_html/namayandegi' --data-urlencode 'files=.deploying' \
            'https://mch4444.dnsuserver.com:2083/execute/Fileman/delete_files' >/dev/null

      - name: Remove obsolete live diagnostics
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          for f in bootstrap-sms.php sms-probe.php; do
            curl --silent --show-error -H "$auth" --request POST \
              --data-urlencode 'dir=public_html/namayandegi' --data-urlencode "files=$f" \
              'https://mch4444.dnsuserver.com:2083/execute/Fileman/delete_files' >/dev/null || true
          done

      - name: Verify live portal repeatedly
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_SHA::8}"
          for attempt in 1 2 3; do
            sleep 5
            html=$(curl -fsS --max-time 30 "https://websaza.ir/namayandegi/?verify=${v}&attempt=${attempt}")
            echo "$html" | grep -F "style.css?v=${v}" >/dev/null
            echo "$html" | grep -F 'مرا به خاطر بسپار' >/dev/null
            reg=$(curl -fsS --max-time 30 "https://websaza.ir/namayandegi/?mode=register&verify=${v}&attempt=${attempt}")
            echo "$reg" | grep -F 'رمز ورود ۶ رقمی' >/dev/null
            echo "$reg" | grep -F 'شرایط همکاری' >/dev/null
            echo "$reg" | grep -F 'name="terms"' >/dev/null
            curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'SEEN_V3' >/dev/null
            curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'WEBSAZA_SUBMIT_GUARD_V5' >/dev/null
            health=$(curl -fsS --max-time 30 "https://websaza.ir/namayandegi/health.php?v=${v}")
            echo "$health" | jq -e '.ok==true and .version=="platform-v4" and (has("php")|not) and (has("details")|not)' >/dev/null
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 'https://websaza.ir/namayandegi/lead-ingest.php')" = '401'
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 'https://websaza.ir/namayandegi/_security.php')" = '403'
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 'https://websaza.ir/namayandegi/_data/settings.json')" = '403'
            for f in backup-worker.php restore-backup.php sms-worker.php ops-worker.php db-export-v5.php sms-canary.php; do
              test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://websaza.ir/namayandegi/$f")" = '403'
            done
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 'https://websaza.ir/namayandegi/backup-download.php')" = '403'
          done

      - name: Roll back production automatically on failure
        if: failure()
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set +e
          [ -f /tmp/deploy_prepared ] || exit 0
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          endpoint="https://mch4444.dnsuserver.com:2083/json-api/cpanel"
          v="${GITHUB_SHA::8}"
          for f in index.php _security.php platform-v3.php style.css app.js smart-actions.php finance.php admin-control.php lead-ingest.php health.php backup-worker.php restore-backup.php sms-worker.php ops-worker.php .htaccess; do
            curl --silent --show-error -H "$auth" --request POST \
              --data-urlencode 'cpanel_jsonapi_user=vt6qdx8' --data-urlencode 'cpanel_jsonapi_apiversion=2' \
              --data-urlencode 'cpanel_jsonapi_module=Fileman' --data-urlencode 'cpanel_jsonapi_func=fileop' \
              --data-urlencode 'op=copy' --data-urlencode "sourcefiles=websaza_deploy_rollback/$v/$f" \
              --data-urlencode 'destfiles=public_html/namayandegi' --data-urlencode 'doubledecode=1' "$endpoint" >/dev/null
          done
          curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode 'dir=public_html/namayandegi' --data-urlencode 'files=.deploying' \
            'https://mch4444.dnsuserver.com:2083/execute/Fileman/delete_files' >/dev/null
          sleep 3
          curl -fsS --max-time 30 'https://websaza.ir/namayandegi/health.php?rollback=1' >/dev/null || true

      - name: Clean release candidate
        if: always()
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set +e
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          rc="namayandegi-rc-${GITHUB_SHA::8}"
          curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode 'dir=public_html' --data-urlencode "files=$rc" \
            'https://mch4444.dnsuserver.com:2083/execute/Fileman/delete_files' >/dev/null
