name: Deploy Namayandegi Portal

"on":
  push:
    branches: [websaza-hosting]
    paths:
      - "WebSaza/namayandegi/**"
      - ".github/workflows/deploy-namayandegi.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: namayandegi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production portal
        shell: bash
        run: |
          set -euo pipefail
          export ASSET_VERSION="${GITHUB_SHA::8}"
          python3 WebSaza/namayandegi/build-patch.py
          python3 WebSaza/namayandegi/security-v2.py
          python3 WebSaza/namayandegi/iranpayamak-api-v1.py
          python3 WebSaza/namayandegi/pin-remember-v1.py
          python3 WebSaza/namayandegi/customer-retention-v1.py
          python3 WebSaza/namayandegi/customer-lifecycle-v1.py
          python3 WebSaza/namayandegi/core-upgrade-v3.py
          python3 WebSaza/namayandegi/smart-upgrade-v3.py
          python3 WebSaza/namayandegi/finance-upgrade-v3.py
          python3 WebSaza/namayandegi/admin-upgrade-v3.py
          python3 WebSaza/namayandegi/lifecycle-sms-v3.py
          python3 WebSaza/namayandegi/security-upgrade-v3.py
          python3 WebSaza/namayandegi/single-engine-v3.py
          python3 WebSaza/namayandegi/transaction-upgrade-v4.py
          python3 WebSaza/namayandegi/queue-upgrade-v4.py
          printf '\n' >> WebSaza/namayandegi/style.css
          cat WebSaza/namayandegi/ux.css WebSaza/namayandegi/simple-v2.css WebSaza/namayandegi/polish-v6.css WebSaza/namayandegi/market-v8.css WebSaza/namayandegi/remember-fix-v1.css >> WebSaza/namayandegi/style.css
          printf '\n' >> WebSaza/namayandegi/app.js
          cat WebSaza/namayandegi/simple-v2.js WebSaza/namayandegi/polish-v6.js WebSaza/namayandegi/market-v8.js WebSaza/namayandegi/performance-v1.js WebSaza/namayandegi/seen-v3.js >> WebSaza/namayandegi/app.js

      - name: Validate and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile WebSaza/namayandegi/*.py
          for f in index.php _security.php platform-v3.php smart-actions.php finance.php admin-control.php lead-ingest.php health.php backup-worker.php restore-backup.php sms-worker.php ops-worker.php; do
            php -l "WebSaza/namayandegi/$f"
          done
          node --check WebSaza/namayandegi/app.js
          php WebSaza/namayandegi/self-test-v3.php | tee /tmp/self-test.log
          grep -F 'SELF_TEST_V4_PASS' /tmp/self-test.log >/dev/null
          grep -F 'WEBSAZA_PLATFORM_V4' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'ws_ingest_commit' WebSaza/namayandegi/lead-ingest.php >/dev/null
          grep -F 'ws_sms_process_queue' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'finance_ledger' WebSaza/namayandegi/platform-v3.php >/dev/null
          grep -F 'CRM اختصاصی این مشتری' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'mark_seen' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'SINGLE_ENGINE_V3' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'SEEN_V3' WebSaza/namayandegi/app.js >/dev/null
          grep -F 'ws_location_bonus' WebSaza/namayandegi/smart-actions.php >/dev/null
          grep -F 'تأیید دستگاه جدید' WebSaza/namayandegi/index.php >/dev/null
          grep -F 'sms_payment_safety_pattern' WebSaza/namayandegi/admin-control.php >/dev/null
          grep -F 'sms_retention_pattern' WebSaza/namayandegi/admin-control.php >/dev/null
          grep -F "action']??'')==='status'" WebSaza/namayandegi/lead-ingest.php >/dev/null
          grep -F 'Content-Security-Policy-Report-Only' WebSaza/namayandegi/.htaccess >/dev/null
          ! grep -Fq 'system_tick' WebSaza/namayandegi/index.php
          ! grep -Fq '$ok=dispatchLead' WebSaza/namayandegi/index.php
          ! grep -Fq 'https://edge.ippanel.com/v1/api/send' WebSaza/namayandegi/smart-actions.php
          ! grep -Fq 'https://edge.ippanel.com/v1/api/send' WebSaza/namayandegi/finance.php
          ! grep -Fq "\$_GET['key']" WebSaza/namayandegi/lead-ingest.php

      - name: Stage release candidate
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          endpoint="https://mch4444.dnsuserver.com:2083/json-api/cpanel"
          v="${GITHUB_SHA::8}"
          rc="namayandegi-rc-${v}"
          response=$(curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=mkdir" \
            --data-urlencode "path=/home/vt6qdx8/public_html" \
            --data-urlencode "name=$rc" \
            --data-urlencode "permissions=0755" "$endpoint")
          upload_text(){
            src="$1"; name="$2"
            r=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
              --data-urlencode "dir=public_html/$rc" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$src" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$r" | jq -e '.status == 1' >/dev/null
          }
          for pair in \
            "index.php:index.php" "_security.php:_security.php" "platform-v3.php:platform-v3.php" \
            "style.css:style.css" "app.js:app.js" "smart-actions.php:smart-actions.php" \
            "finance.php:finance.php" "admin-control.php:admin-control.php" "lead-ingest.php:lead-ingest.php" \
            "health.php:health.php" ".htaccess:.htaccess"; do
            src="${pair%%:*}"; dst="${pair##*:}"; upload_text "WebSaza/namayandegi/$src" "$dst"
          done
          sleep 4
          html=$(curl -fsS --max-time 30 "https://websaza.ir/${rc}/?verify=${v}")
          echo "$html" | grep -F "style.css?v=${v}" >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/${rc}/?mode=register&verify=${v}" | grep -F 'رمز ورود ۴ رقمی' >/dev/null
          health=$(curl -fsS --max-time 30 "https://websaza.ir/${rc}/health.php?v=${v}")
          echo "$health" | jq -e '.ok==true and .version=="platform-v4"' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://websaza.ir/${rc}/_data/settings.json")" = "403"

      - name: Ensure remote folder
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          endpoint="https://mch4444.dnsuserver.com:2083/json-api/cpanel"
          response=$(curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=mkdir" \
            --data-urlencode "path=/home/vt6qdx8/public_html" \
            --data-urlencode "name=namayandegi" \
            --data-urlencode "permissions=0755" "$endpoint")
          if [ "$(echo "$response" | jq -r '.cpanelresult.event.result // 0')" != "1" ]; then
            check=$(curl --fail-with-body --silent --show-error -H "$auth" "https://mch4444.dnsuserver.com:2083/execute/Fileman/list_files?dir=public_html&showdotfiles=1")
            echo "$check" | jq -e 'any(.data[]?; .file=="namayandegi" and .type=="dir")' >/dev/null
          fi

      - name: Upload production files
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          upload_text(){
            src="$1"; name="$2"
            response=$(curl --fail-with-body --silent --show-error -H "$auth" --request POST \
              --data-urlencode "dir=public_html/namayandegi" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$src" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$response" | jq -e '.status == 1' >/dev/null
          }
          for pair in \
            "index.php:index.php" "_security.php:_security.php" "platform-v3.php:platform-v3.php" \
            "style.css:style.css" "app.js:app.js" "smart-actions.php:smart-actions.php" \
            "finance.php:finance.php" "admin-control.php:admin-control.php" "lead-ingest.php:lead-ingest.php" \
            "health.php:health.php" "backup-worker.php:backup-worker.php" "restore-backup.php:restore-backup.php" \
            "sms-worker.php:sms-worker.php" "ops-worker.php:ops-worker.php" ".htaccess:.htaccess"; do
            src="${pair%%:*}"; dst="${pair##*:}"; upload_text "WebSaza/namayandegi/$src" "$dst"
          done

      - name: Remove obsolete live diagnostics
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          for f in bootstrap-sms.php sms-probe.php; do
            curl --silent --show-error -H "$auth" --request POST \
              --data-urlencode "dir=public_html/namayandegi" \
              --data-urlencode "files=$f" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/delete_files" >/dev/null || true
          done

      - name: Verify live portal repeatedly
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_SHA::8}"
          for attempt in 1 2 3; do
            sleep 5
            html=$(curl -fsS --max-time 30 "https://websaza.ir/namayandegi/?verify=${v}&attempt=${attempt}")
            echo "$html" | grep -F "style.css?v=${v}" >/dev/null
            echo "$html" | grep -F 'مرا به خاطر بسپار' >/dev/null
            curl -fsS --max-time 30 "https://websaza.ir/namayandegi/?mode=register&verify=${v}&attempt=${attempt}" | grep -F 'رمز ورود ۴ رقمی' >/dev/null
            curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${v}" | grep -F 'SEEN_V3' >/dev/null
            health=$(curl -fsS --max-time 30 "https://websaza.ir/namayandegi/health.php?v=${v}")
            echo "$health" | jq -e '.ok==true and .version=="platform-v4" and (has("php")|not) and (has("details")|not)' >/dev/null
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://websaza.ir/namayandegi/lead-ingest.php")" = "401"
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://websaza.ir/namayandegi/_security.php")" = "403"
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://websaza.ir/namayandegi/_data/settings.json")" = "403"
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://websaza.ir/namayandegi/backup-worker.php")" = "403"
          done

      - name: Clean release candidate
        if: always()
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set +e
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          rc="namayandegi-rc-${GITHUB_SHA::8}"
          curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode "dir=public_html" \
            --data-urlencode "files=$rc" \
            "https://mch4444.dnsuserver.com:2083/execute/Fileman/delete_files" >/dev/null
