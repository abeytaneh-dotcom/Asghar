          text=text.replace(old_admin,new_admin,1)

          recover_handlers="""
if(post('recover_request')){if(!okc())exit('درخواست نامعتبر');$m=sec_mobile((string)($_POST['mobile']??''));$rows=j(B);$found=null;foreach($rows as $r)if(sec_mobile((string)($r['mobile']??''))===$m&&!empty($r['active'])){$found=$r;break;}if($found&&sec_reset_allowed(D,'branch',(string)$found['id']))sec_issue_code(D,'branch',(string)$found['id'],$m,S);fl('اگر شماره در سیستم ثبت شده باشد، کد بازیابی ارسال می‌شود.');go('./?mode=reset');}
if(post('recover_finish')){if(!okc())exit('درخواست نامعتبر');$m=sec_mobile((string)($_POST['mobile']??''));$code=trim((string)($_POST['code']??''));$new=(string)($_POST['new_password']??'');$rows=j(B);$idx=null;foreach($rows as $i=>$r)if(sec_mobile((string)($r['mobile']??''))===$m&&!empty($r['active'])){$idx=$i;break;}if($idx===null||strlen($new)<10||!sec_verify_code(D,'branch',(string)$rows[$idx]['id'],$code)){fl('اطلاعات بازیابی معتبر نیست.','err');go('./?mode=reset');}$rows[$idx]['password_hash']=password_hash($new,PASSWORD_DEFAULT);$rows[$idx]['must_change_password']=false;sj(B,$rows);sec_unlock(D,'branch',(string)$rows[$idx]['id']);fl('رمز جدید ثبت شد.');go('./?mode=login');}
if(post('admin_recover_request')){if(!okc())exit('درخواست نامعتبر');$m=sec_mobile((string)($_POST['mobile']??''));$a=j(AD);$registered=sec_mobile((string)($a['mobile']??''));if($registered!==''&&hash_equals($registered,$m)&&sec_reset_allowed(D,'admin','root'))sec_issue_code(D,'admin','root',$m,S);fl('اگر شماره معتبر باشد، کد بازیابی ارسال می‌شود.');go('./?admin=1&recover=1&step=2');}
if(post('admin_recover_finish')){if(!okc())exit('درخواست نامعتبر');$m=sec_mobile((string)($_POST['mobile']??''));$code=trim((string)($_POST['code']??''));$new=(string)($_POST['new_password']??'');$a=j(AD);$registered=sec_mobile((string)($a['mobile']??''));if($registered===''||!hash_equals($registered,$m)||strlen($new)<12||!sec_verify_code(D,'admin','root',$code)){fl('اطلاعات بازیابی معتبر نیست.','err');go('./?admin=1&recover=1&step=2');}$a['password_hash']=password_hash($new,PASSWORD_DEFAULT);$a['must_change']=false;sj(AD,$a);sec_unlock(D,'admin','root');fl('رمز جدید ثبت شد.');go('./?admin=1');}
"""
          text=text.replace(new_login,recover_handlers+new_login,1)

          old_branch_pw="if(post('branch_password')&&($b=br())){if(!okc())exit('درخواست نامعتبر');$old=(string)($_POST['old']??'');$new=(string)($_POST['new']??'');if(!password_verify($old,(string)$b['password_hash'])||strlen($new)<8){fl('رمز فعلی اشتباه است یا رمز جدید کوتاه است.','err');go('./?view=profile');}$rows=j(B);foreach($rows as &$r)if(($r['id']??'')===$b['id']){$r['password_hash']=password_hash($new,PASSWORD_DEFAULT);break;}unset($r);sj(B,$rows);fl('رمز عبور تغییر کرد.');go('./?view=profile');}"
          new_branch_pw="if(post('branch_password')&&($b=br())){if(!okc())exit('درخواست نامعتبر');$old=(string)($_POST['old']??'');$new=(string)($_POST['new']??'');if(!password_verify($old,(string)$b['password_hash'])||strlen($new)<10){fl('رمز فعلی اشتباه است یا رمز جدید کوتاه است.','err');go('./?view=profile');}$rows=j(B);foreach($rows as &$r)if(($r['id']??'')===$b['id']){$r['password_hash']=password_hash($new,PASSWORD_DEFAULT);$r['must_change_password']=false;break;}unset($r);sj(B,$rows);sec_unlock(D,'branch',(string)$b['id']);fl('رمز عبور تغییر کرد.');go('./?view=profile');}"
          if old_branch_pw not in text:
              raise SystemExit('branch password handler missing')
          text=text.replace(old_branch_pw,new_branch_pw,1)

          old_admin_pw="if(post('admin_password')&&admin()){if(!okc())exit('درخواست نامعتبر');$p=(string)($_POST['password']??'');if(strlen($p)<10){fl('رمز مدیر حداقل ۱۰ کاراکتر باشد.','err');go('./?admin=1&view=settings');}$a=j(AD);$a['password_hash']=password_hash($p,PASSWORD_DEFAULT);$a['must_change']=false;sj(AD,$a);fl('رمز مدیر تغییر کرد.');go('./?admin=1&view=settings');}"
          new_admin_pw="if(post('admin_password')&&admin()){if(!okc())exit('درخواست نامعتبر');$p=(string)($_POST['password']??'');if(strlen($p)<12){fl('رمز جدید باید حداقل ۱۲ کاراکتر باشد.','err');go('./?admin=1&view=settings');}$a=j(AD);$a['password_hash']=password_hash($p,PASSWORD_DEFAULT);$a['must_change']=false;sj(AD,$a);sec_unlock(D,'admin','root');fl('رمز مدیر تغییر کرد.');go('./?admin=1&view=settings');}"
          if old_admin_pw not in text:
              raise SystemExit('admin password handler missing')
          text=text.replace(old_admin_pw,new_admin_pw,1)

          public_anchor="echo '<a class=\"adminlink\" href=\"?admin=1\">ورود مدیر سیستم</a></div></section></main></body></html>';"
          if public_anchor in text:text=text.replace(public_anchor,"echo '</div></section></main></body></html>';",1)
          text=text.replace("<button class=\"btn dark\">ورود به پنل</button></form>'","<button class=\"btn dark\">ورود به پنل</button></form><a class=\"adminlink\" href=\"?mode=recover\">بازیابی رمز عبور</a>'",1)

          recover_page="""
if(!$b&&!$isAdmin&&in_array($mode,['recover','reset'],true)){headx('بازیابی ورود');echo '<main class="auth"><section class="authbox"><div class="authcard">';flash($flash);if($mode==='recover')echo '<h2>بازیابی رمز عبور</h2><form method="post" class="form">'.cf().'<input type="hidden" name="action" value="recover_request"><label>شماره موبایل<input name="mobile" inputmode="numeric" required></label><button class="btn dark">ارسال کد بازیابی</button></form>';else echo '<h2>ثبت رمز جدید</h2><form method="post" class="form">'.cf().'<input type="hidden" name="action" value="recover_finish"><label>شماره موبایل<input name="mobile" inputmode="numeric" required></label><label>کد بازیابی<input name="code" inputmode="numeric" maxlength="6" required></label><label>رمز جدید<input type="password" name="new_password" minlength="10" required></label><button class="btn dark">ثبت رمز جدید</button></form>';echo '<a class="adminlink" href="./?mode=login">بازگشت</a></div></section></main></body></html>';exit;}
"""
          marker="if(!$b&&!$isAdmin){headx('ورود و ثبت‌نام نمایندگی');"
          if marker not in text: raise SystemExit('public login render marker missing')
          text=text.replace(marker,recover_page+marker,1)

          admin_recover="""
if($isAdmin&&!admin()&&($_GET['recover']??'')==='1'){headx('بازیابی دسترسی');echo '<main class="auth"><section class="authbox"><div class="authcard">';flash($flash);if(($_GET['step']??'')==='2')echo '<h2>ثبت رمز جدید</h2><form method="post" class="form">'.cf().'<input type="hidden" name="action" value="admin_recover_finish"><label>شماره موبایل<input name="mobile" inputmode="numeric" required></label><label>کد بازیابی<input name="code" inputmode="numeric" maxlength="6" required></label><label>رمز جدید<input type="password" name="new_password" minlength="12" required></label><button class="btn dark">ثبت رمز جدید</button></form>';else echo '<h2>بازیابی دسترسی</h2><form method="post" class="form">'.cf().'<input type="hidden" name="action" value="admin_recover_request"><label>شماره موبایل<input name="mobile" inputmode="numeric" required></label><button class="btn dark">ارسال کد بازیابی</button></form>';echo '<a class="adminlink" href="./?admin=1">بازگشت</a></div></section></main></body></html>';exit;}
"""
          admin_marker="if($isAdmin&&!admin()){headx('ورود مدیر');"
          if admin_marker not in text: raise SystemExit('admin render marker missing')
          text=text.replace(admin_marker,admin_recover+admin_marker,1)
          text=text.replace('مدیریت مرکزی<br>نمایندگی‌ها و توزیع هوشمند سفارش','ورود امن',1)
          text=text.replace("<button class=\"btn dark\">ورود</button></form><a class=\"adminlink\" href=\"./\">بازگشت</a>","<button class=\"btn dark\">ورود</button></form><a class=\"adminlink\" href=\"?admin=1&recover=1\">بازیابی دسترسی</a>",1)
          p.write_text(text,encoding='utf-8')

          p=root/'smart-actions.php'
          text=p.read_text(encoding='utf-8')
          old_jx="function jx(string $f):array{$x=json_decode((string)@file_get_contents($f),true);return is_array($x)?$x:[];}"
          new_jx="function jx(string $f):array{$c=&$GLOBALS['_WSJX_CACHE'];if(!is_array($c??null))$c=[];if(array_key_exists($f,$c))return $c[$f];$x=json_decode((string)@file_get_contents($f),true);return $c[$f]=is_array($x)?$x:[];}"
          old_sjx="function sjx(string $f,array $x):bool{$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);return rename($t,$f);}finally{flock($l,LOCK_UN);fclose($l);}}"
          new_sjx="function sjx(string $f,array $x):bool{$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);$ok=rename($t,$f);if($ok){$c=&$GLOBALS['_WSJX_CACHE'];if(!is_array($c??null))$c=[];$c[$f]=$x;}return $ok;}finally{flock($l,LOCK_UN);fclose($l);}}"
          if old_jx not in text or old_sjx not in text: raise SystemExit('smart-actions storage functions changed')
          text=text.replace(old_jx,new_jx,1).replace(old_sjx,new_sjx,1)
          p.write_text(text,encoding='utf-8')

          p=root/'finance.php'
          text=p.read_text(encoding='utf-8')
          old_fin="function j($f){$x=json_decode((string)@file_get_contents($f),true);return is_array($x)?$x:[];}function sj($f,$x){$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);return rename($t,$f);}finally{flock($l,LOCK_UN);fclose($l);}}"
          new_fin="function j($f){$c=&$GLOBALS['_WSF_CACHE'];if(!is_array($c??null))$c=[];if(array_key_exists($f,$c))return $c[$f];$x=json_decode((string)@file_get_contents($f),true);return $c[$f]=is_array($x)?$x:[];}function sj($f,$x){$l=fopen($f.'.lock','c');if(!$l||!flock($l,LOCK_EX))return false;try{$t=$f.'.tmp.'.bin2hex(random_bytes(3));$q=json_encode($x,JSON_UNESCAPED_UNICODE);if($q===false||file_put_contents($t,$q,LOCK_EX)===false)return false;@chmod($t,0640);$ok=rename($t,$f);if($ok){$c=&$GLOBALS['_WSF_CACHE'];if(!is_array($c??null))$c=[];$c[$f]=$x;}return $ok;}finally{flock($l,LOCK_UN);fclose($l);}}"
          if old_fin not in text: raise SystemExit('finance storage functions changed')
          text=text.replace(old_fin,new_fin,1)
