# smart-distribution-deploy-20261017
name: Deploy Namayandegi Portal

on:
  push:
    branches: [websaza-hosting]
    paths:
      - 'WebSaza/namayandegi/**'
      - '.github/workflows/deploy-namayandegi.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare mobile navigation and version assets
        shell: bash
        run: |
          set -euo pipefail
          export ASSET_VERSION="${GITHUB_SHA::8}"
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          path = Path('WebSaza/namayandegi/index.php')
          text = path.read_text(encoding='utf-8')
          version = os.environ['ASSET_VERSION']
          text = re.sub(r'style\.css\?v=[^"\']+', f'style.css?v={version}', text)
          text = re.sub(r'app\.js\?v=[^"\']+', f'app.js?v={version}', text)
          path.write_text(text, encoding='utf-8')
          PY

          if ! grep -Fq 'MOBILE_NAV_GRID_V2' WebSaza/namayandegi/style.css; then
            cat >> WebSaza/namayandegi/style.css <<'CSS'

          /* MOBILE_NAV_GRID_V2 */
          @media(max-width:980px){
            .layout{padding-bottom:150px}
            .mobile{
              display:grid;
              grid-auto-flow:row;
              grid-template-columns:repeat(8,minmax(0,1fr));
              grid-auto-columns:auto;
              gap:6px;
              width:100%;
              max-width:100vw;
              overflow:hidden;
              padding:7px 8px calc(7px + env(safe-area-inset-bottom));
            }
            .mobile a{
              grid-column:span 2;
              min-width:0;
              width:100%;
              min-height:48px;
              padding:6px 4px;
              border:1px solid #303844;
              border-radius:11px;
              background:#171c24;
              color:#d7dde5;
              font-size:10px;
              font-weight:900;
              line-height:1.25;
              display:flex;
              align-items:center;
              justify-content:center;
              text-align:center;
              white-space:normal;
              overflow-wrap:anywhere;
              box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
            }
            .mobile a.on{
              color:#11151c;
              background:var(--brand);
              border-color:var(--brand);
              box-shadow:0 5px 16px rgba(201,243,91,.22);
            }
            .mobile a:nth-child(5):nth-last-child(3){grid-column:2/span 2}
            .mobile a:nth-child(6):nth-last-child(2){grid-column:4/span 2}
            .mobile a:nth-child(7):last-child{grid-column:6/span 2}
            .mobile a:nth-child(5):nth-last-child(2){grid-column:3/span 2}
            .mobile a:nth-child(6):last-child{grid-column:5/span 2}
          }
          @media(max-width:420px){
            .layout{padding-bottom:142px}
            .mobile{gap:4px;padding:6px 5px calc(6px + env(safe-area-inset-bottom))}
            .mobile a{min-height:46px;font-size:9px;padding:5px 2px;border-radius:10px}
          }
          CSS
          fi

      - name: Validate PHP
        run: |
          php -l WebSaza/namayandegi/index.php
          php -l WebSaza/namayandegi/smart-actions.php
          php -l WebSaza/namayandegi/finance.php

      - name: Ensure remote folder
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          response=$(curl --silent --show-error -H "$auth" --request POST \
            --data-urlencode "cpanel_jsonapi_user=vt6qdx8" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=mkdir" \
            --data-urlencode "path=/home/vt6qdx8/public_html" \
            --data-urlencode "name=namayandegi" \
            --data-urlencode "permissions=0755" \
            "https://mch4444.dnsuserver.com:2083/json-api/cpanel")
          if [ "$(echo "$response" | jq -r '.cpanelresult.event.result // 0')" != "1" ]; then
            check=$(curl --fail-with-body --silent --show-error -H "$auth" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/list_files?dir=public_html&showdotfiles=1")
            echo "$check" | jq -e 'any(.data[]?; .file=="namayandegi" and .type=="dir")' >/dev/null
          fi

      - name: Upload portal files
        shell: bash
        env:
          CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: cpanel vt6qdx8:${CPANEL_TOKEN}"
          upload_text() {
            src="$1"; name="$2"
            response=$(curl --fail-with-body --silent --show-error \
              -H "$auth" \
              --request POST \
              --data-urlencode "dir=public_html/namayandegi" \
              --data-urlencode "file=$name" \
              --data-urlencode "content@$src" \
              "https://mch4444.dnsuserver.com:2083/execute/Fileman/save_file_content")
            echo "$response" | jq -e '.status == 1' >/dev/null
          }
          upload_text WebSaza/namayandegi/index.php index.php
          upload_text WebSaza/namayandegi/style.css style.css
          upload_text WebSaza/namayandegi/app.js app.js
          upload_text WebSaza/namayandegi/smart-actions.php smart-actions.php
          upload_text WebSaza/namayandegi/finance.php finance.php
          upload_text WebSaza/namayandegi/.htaccess .htaccess

      - name: Verify live portal
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          version="${GITHUB_SHA::8}"
          curl -fsSI --max-time 30 https://websaza.ir/namayandegi/ | head -n 12
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/?verify=${version}" | grep -F "style.css?v=${version}" >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/style.css?v=${version}" | grep -F 'MOBILE_NAV_GRID_V2' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/style.css?v=${version}" | grep -F 'grid-template-columns:repeat(8,minmax(0,1fr))' >/dev/null
          curl -fsS --max-time 30 https://websaza.ir/namayandegi/ | grep -F 'فرصت فروش متناسب با منطقه' >/dev/null
          curl -fsS --max-time 30 "https://websaza.ir/namayandegi/app.js?v=${version}" | grep -F 'interested_transfer' >/dev/null
          curl -fsSI --max-time 30 https://websaza.ir/namayandegi/smart-actions.php | head -n 8
          curl -fsS --max-time 30 https://websaza.ir/namayandegi/finance.php | grep -E 'حساب|تأیید|ورود|معتبر' >/dev/null
