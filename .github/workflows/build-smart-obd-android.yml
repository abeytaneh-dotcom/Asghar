name: Build Smart OBD Android APK
on:
  push:
    paths:
      - 'SmartOBDAndroid/**'
      - '.github/workflows/build-smart-obd-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: SmartOBDAndroid
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -f SmartOBDAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh SmartOBDAndroid/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KhanehRemap-SmartOBD-Android
          path: SmartOBDAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
