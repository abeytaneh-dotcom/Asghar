name: Build Keep Awake Android APK
on:
  push:
    paths:
      - 'keep-awake-app/**'
      - '.github/workflows/build-smart-obd-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: keep-awake-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f keep-awake-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh keep-awake-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-APK
          path: keep-awake-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
