name: Patch Tehran GPS Accuracy
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/patch-tehran-gps-accuracy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Improve geolocation accuracy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')
          old="""geoBtn.addEventListener('click',()=>{if(!navigator.geolocation){st.className='locstatus warn';st.textContent='مرورگر این گوشی لوکیشن را پشتیبانی نمی‌کند؛ روی نقشه دستی انتخاب کنید.';return;}geoBtn.disabled=true;geoBtn.textContent='در حال پیدا کردن…';st.className='locstatus';st.textContent='در حال دریافت موقعیت فعلی؛ اگر طول کشید می‌توانید همین حالا روی نقشه دستی انتخاب کنید.';navigator.geolocation.getCurrentPosition(pos=>{choose(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy,true);geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';},()=>{st.className='locstatus warn';st.textContent='موقعیت فعلی پیدا نشد؛ مشکلی نیست، روی نقشه محل تحویل را دستی انتخاب کنید.';geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';},{enableHighAccuracy:true,timeout:10000,maximumAge:30000});});setTimeout(()=>map.invalidateSize(),100);"""
          new="""let accuracyCircle=null,geoWatch=null,geoTimer=null,bestGeo=null;function showGeo(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.max(1,Math.round(pos.coords.accuracy||99999));if(!bestGeo||acc<bestGeo.acc){bestGeo={lat,lng,acc};choose(lat,lng,acc,true);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:1,fillColor:'#64b5f6',fillOpacity:.13}).addTo(map);const msg=acc<=40?'✅ موقعیت دقیق پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر':acc<=120?'موقعیت پیدا شد · دقت حدود '+acc.toLocaleString('fa-IR')+' متر؛ چند ثانیه برای دقت بهتر صبر کنید.':'⚠️ موقعیت فعلی تقریبی است · دقت حدود '+acc.toLocaleString('fa-IR')+' متر. اگر بهتر نشد، لوکیشن دقیق Chrome را فعال کنید یا دستی روی نقشه انتخاب کنید.';st.className='locstatus '+(acc<=120?'ok':'warn');st.textContent=msg;}if(bestGeo&&bestGeo.acc<=25)finishGeo();}function finishGeo(){if(geoWatch!==null){navigator.geolocation.clearWatch(geoWatch);geoWatch=null;}if(geoTimer){clearTimeout(geoTimer);geoTimer=null;}geoBtn.disabled=false;geoBtn.textContent='موقعیت فعلی من';if(bestGeo){pending={lat:bestGeo.lat,lng:bestGeo.lng,acc:bestGeo.acc};if(bestGeo.acc>150){st.className='locstatus warn';st.textContent='⚠️ بهترین دقت فعلی '+bestGeo.acc.toLocaleString('fa-IR')+' متر است؛ این موقعیت تقریبی است. برای تحویل دقیق، پین را دستی اصلاح کنید یا دسترسی «موقعیت دقیق» Chrome را فعال کنید.';}else{st.className='locstatus ok';st.textContent='✅ بهترین موقعیت پیدا شد · دقت حدود '+bestGeo.acc.toLocaleString('fa-IR')+' متر. اگر درست است «ثبت این نقطه» را بزنید.';}}}geoBtn.addEventListener('click',()=>{if(!navigator.geolocation){st.className='locstatus warn';st.textContent='مرورگر این گوشی لوکیشن را پشتیبانی نمی‌کند؛ روی نقشه دستی انتخاب کنید.';return;}if(geoWatch!==null){navigator.geolocation.clearWatch(geoWatch);geoWatch=null;}if(geoTimer){clearTimeout(geoTimer);geoTimer=null;}bestGeo=null;geoBtn.disabled=true;geoBtn.textContent='در حال دقیق‌کردن GPS…';st.className='locstatus';st.textContent='چند ثانیه صبر کنید؛ دقیق‌ترین موقعیت GPS را انتخاب می‌کنیم.';geoWatch=navigator.geolocation.watchPosition(showGeo,err=>{if(!bestGeo){st.className='locstatus warn';st.textContent=err.code===1?'اجازه لوکیشن دقیق داده نشده؛ در تنظیمات Chrome دسترسی Location را روی دقیق بگذارید یا دستی انتخاب کنید.':'GPS دقیق پیدا نشد؛ روی نقشه محل تحویل را دستی انتخاب کنید.';}finishGeo();},{enableHighAccuracy:true,timeout:18000,maximumAge:0});geoTimer=setTimeout(finishGeo,12000);});setTimeout(()=>map.invalidateSize(),100);"""
          if old not in s:
              raise SystemExit('Target geolocation block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/shop.php
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add TehranSupermarket/shop.php
          git commit -m "Improve checkout GPS accuracy and show accuracy radius" || exit 0
          git push
