name: Tehran DB Diagnostic Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/tehran-db-diagnostic-temp'
permissions:
  contents: read
jobs:
  exact-images:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - offset: 800
            size: 1500
          - offset: 2300
            size: 1500
          - offset: 3800
            size: 1500
          - offset: 5300
            size: 1500
          - offset: 6800
            size: 1500
          - offset: 8300
            size: 1507
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Find exact barcode images and compress
        shell: bash
        env:
          BATCH_OFFSET: ${{ matrix.offset }}
          BATCH_SIZE: ${{ matrix.size }}
        run: |
          set -Eeuo pipefail
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet pillow
          mkdir -p "$RUNNER_TEMP/imgs"
          php -r "define('TS_INTERNAL_SEED',true); echo require 'TehranSupermarket/pyramid_seed_1400_data.php';" | base64 -d | gzip -dc > "$RUNNER_TEMP/products.jsonl"
          python3 - "$RUNNER_TEMP/products.jsonl" "$RUNNER_TEMP/imgs" "$RUNNER_TEMP/manifest.jsonl" "$BATCH_OFFSET" "$BATCH_SIZE" <<'PY'
          import sys,json,re,urllib.parse,urllib.request,ssl,concurrent.futures,io,os
          from PIL import Image
          seed,imgdir,manifest,offset,size=sys.argv[1],sys.argv[2],sys.argv[3],int(sys.argv[4]),int(sys.argv[5])
          rows=[]
          with open(seed,encoding='utf-8') as f:
            for line in f:
              try:rows.append(json.loads(line))
              except:pass
          batch=rows[offset:offset+size]
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36'
          def find_exact(row):
            bar=re.sub(r'\D','',str(row.get('barcode') or ''))
            if len(bar)<8:return None
            name=str(row.get('name') or '').strip()
            if not name:return None
            q=urllib.parse.urlencode({'query':name,'latitude':'35.757453','longitude':'51.409882','page':0,'page_size':20,'size':20,'fetch_filters':1,'firstPage':'true','origin':'search'})
            u='https://svc.snapp.market/mobile/v3/search?'+q
            try:
              rq=urllib.request.Request(u,headers={'User-Agent':ua,'Accept':'application/json','Origin':'https://snapp.market','Referer':'https://snapp.market/'})
              with urllib.request.urlopen(rq,timeout=15,context=ctx) as r:d=json.loads(r.read(4_000_000))
              seen=set()
              for v in d.get('data',{}).get('vendor_product_variations',{}).get('items',[]) or []:
                for p in v.get('products',[]) or []:
                  for im in p.get('images') or []:
                    url=(im or {}).get('main') or (im or {}).get('thumb') or ''
                    if not isinstance(url,str) or not url.startswith('https://static.snapp.express/') or url in seen:continue
                    seen.add(url)
                    nums=re.findall(r'\d{8,16}',url)
                    if any(bar==n or bar.lstrip('0')==n.lstrip('0') for n in nums):
                      return row,p,url
            except Exception:return None
            return None
          found=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
            for i,x in enumerate(ex.map(find_exact,batch),1):
              if x:found.append(x)
              if i%250==0:print('LOOKUP',offset+i,'EXACT',len(found),flush=True)
          def convert(x):
            row,p,url=x
            try:
              rq=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':'https://snapp.market/'})
              with urllib.request.urlopen(rq,timeout=20,context=ctx) as r:raw=r.read(8_000_000)
              im=Image.open(io.BytesIO(raw));im.load()
              if im.width<80 or im.height<80:return None
              if im.mode not in ('RGB','RGBA'):im=im.convert('RGBA' if 'transparency' in im.info else 'RGB')
              im.thumbnail((720,720),Image.Resampling.LANCZOS)
              code=re.sub(r'[^A-Za-z0-9_-]','_',str(row.get('code2') or row.get('barcode') or 'product'))[:70]
              fn=f'auto_snp_{code}.webp';path=os.path.join(imgdir,fn)
              im.save(path,'WEBP',quality=80,method=6,optimize=True)
              if os.path.getsize(path)>140000:im.save(path,'WEBP',quality=72,method=6,optimize=True)
              if os.path.getsize(path)>180000:
                im.thumbnail((600,600),Image.Resampling.LANCZOS);im.save(path,'WEBP',quality=70,method=6,optimize=True)
              return {'code2':str(row.get('code2') or ''),'barcode':str(row.get('barcode') or ''),'path':'uploads/products/'+fn,'source':'snapp.market|'+url,'bytes':os.path.getsize(path),'title':str(p.get('title') or '')}
            except Exception:return None
          done=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            for x in ex.map(convert,found):
              if x:done.append(x)
          with open(manifest,'w',encoding='utf-8') as f:
            for x in done:f.write(json.dumps({k:x[k] for k in ('code2','barcode','path','source')},ensure_ascii=False)+'\n')
          report={'offset':offset,'batch':len(batch),'exact_found':len(found),'downloaded':len(done),'total_bytes':sum(x['bytes'] for x in done),'avg_bytes':round(sum(x['bytes'] for x in done)/max(1,len(done))),'max_bytes':max([x['bytes'] for x in done] or [0])}
          with open(os.path.join(imgdir,'report.json'),'w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False),flush=True)
          PY
      - name: Upload exact images and unique manifest
        shell: bash
        env:
          BATCH_OFFSET: ${{ matrix.offset }}
        run: |
          set -Eeuo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          mapfile -t files < <(find "$RUNNER_TEMP/imgs" -maxdepth 1 -type f -name '*.webp' | sort)
          echo "UPLOAD offset=${BATCH_OFFSET} count=${#files[@]}"
          for ((i=0;i<${#files[@]};i+=20)); do
            args=();n=1
            for f in "${files[@]:i:20}"; do args+=( -F "file-${n}=@${f};filename=$(basename "$f")" );n=$((n+1));done
            R="$RUNNER_TEMP/u.json"
            curl -sS --fail-with-body -H "$AUTH" "${args[@]}" -F "dir=${TARGET_DIR}/uploads/products" -F 'overwrite=1' "${BASE}/execute/Fileman/upload_files" -o "$R"
            test "$(jq -r '.result.status // .status // 0' "$R")" = 1
          done
          mf="product_image_manifest_snapp_exact_${BATCH_OFFSET}.jsonl"
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}/storage" --data-urlencode "file=${mf}" --data-urlencode "content@$RUNNER_TEMP/manifest.jsonl" "${BASE}/execute/Fileman/save_file_content" >/dev/null
          curl -sS -L --max-time 120 'https://websaza.ir/tehran/' >/dev/null
          sleep 1
          curl -sS -L --max-time 120 'https://websaza.ir/tehran/' >/dev/null
          cat "$RUNNER_TEMP/imgs/report.json"
