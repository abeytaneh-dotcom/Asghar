name: Tehran DB Diagnostic Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/tehran-db-diagnostic-temp'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe approved supermarket image sources
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          import sys,re,urllib.parse,urllib.request,ssl,pathlib
          out=pathlib.Path(sys.argv[1])
          q=urllib.parse.quote('کره بادام زمینی جیف')
          urls=[
              f'https://www.okala.com/search?query={q}',
              f'https://snapp.market/search?query={q}',
              f'https://www.digikalajet.com/search/?q={q}',
              f'https://www.modiseh.com/search?q={q}',
          ]
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36'
          summary=[]
          for i,u in enumerate(urls,1):
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':ua,'Accept-Language':'fa-IR,fa;q=0.9,en;q=0.5'})
                  with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                      raw=r.read(5_000_000); code=r.status; final=r.geturl(); ctype=r.headers.get('content-type','')
                  text=raw.decode('utf-8','replace')
                  (out/f'body_{i}.html').write_text(text,'utf-8')
                  m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                  title=re.sub(r'\s+',' ',m.group(1)).strip() if m else ''
                  vals=[]
                  for m in re.finditer(r'https?://[^\s"<>]+',text,re.I):
                      v=m.group(0).replace('\\u002F','/').replace('\\/','/')
                      if re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',v,re.I) or any(x in v.lower() for x in ['image','product','cdn']): vals.append(v)
                  (out/f'urls_{i}.txt').write_text('\n'.join(dict.fromkeys(vals[:200])),'utf-8')
                  summary.append(f'[{i}] code={code} bytes={len(raw)} type={ctype} title={title} final={final} source={u}')
              except Exception as e:
                  summary.append(f'[{i}] ERROR {type(e).__name__}: {e} source={u}')
          (out/'summary.txt').write_text('\n'.join(summary),'utf-8')
          print('\n'.join(summary))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: product-image-source-probe
          path: ${{ runner.temp }}/out
          retention-days: 1
