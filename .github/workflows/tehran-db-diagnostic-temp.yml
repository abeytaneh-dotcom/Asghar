name: Tehran DB Diagnostic Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/tehran-db-diagnostic-temp'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Recheck first batch with exact barcode evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          php -r "define('TS_INTERNAL_SEED',true); echo require 'TehranSupermarket/pyramid_seed_1400_data.php';" | base64 -d | gzip -dc > "$RUNNER_TEMP/products.jsonl"
          curl -sS --fail-with-body -H "$AUTH" -H 'Accept: application/json' --get --data-urlencode "dir=${TARGET_DIR}/storage" --data-urlencode 'file=product_image_manifest.jsonl' "${BASE}/execute/Fileman/get_file_content" -o "$RUNNER_TEMP/live.json"
          jq -r '.result.data.content // .data.content // empty' "$RUNNER_TEMP/live.json" > "$RUNNER_TEMP/old_manifest.jsonl"
          python3 - "$RUNNER_TEMP/products.jsonl" "$RUNNER_TEMP/old_manifest.jsonl" "$RUNNER_TEMP/cleanup.jsonl" <<'PY'
          import sys,json,re,urllib.parse,urllib.request,ssl,concurrent.futures
          seed,oldf,outf=sys.argv[1:4]
          rows=[]
          with open(seed,encoding='utf-8') as f:
            for i,line in enumerate(f):
              if i>=800:break
              try:rows.append(json.loads(line))
              except:pass
          old=[]
          with open(oldf,encoding='utf-8') as f:
            for line in f:
              try:old.append(json.loads(line))
              except:pass
          old_codes={str(x.get('code2') or '') for x in old if x.get('code2')}
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36'
          def exact(row):
            bar=re.sub(r'\D','',str(row.get('barcode') or ''))
            if len(bar)<8:return None
            q=urllib.parse.urlencode({'query':str(row.get('name') or ''),'latitude':'35.757453','longitude':'51.409882','page':0,'page_size':20,'size':20,'fetch_filters':1,'firstPage':'true','origin':'search'})
            u='https://svc.snapp.market/mobile/v3/search?'+q
            try:
              rq=urllib.request.Request(u,headers={'User-Agent':ua,'Accept':'application/json','Origin':'https://snapp.market','Referer':'https://snapp.market/'})
              with urllib.request.urlopen(rq,timeout=15,context=ctx) as r:d=json.loads(r.read(4_000_000))
              for v in d.get('data',{}).get('vendor_product_variations',{}).get('items',[]) or []:
                for p in v.get('products',[]) or []:
                  for im in p.get('images') or []:
                    url=(im or {}).get('main') or (im or {}).get('thumb') or ''
                    nums=re.findall(r'\d{8,16}',url)
                    if any(bar==n or bar.lstrip('0')==n.lstrip('0') for n in nums):return str(row.get('code2') or '')
            except Exception:pass
            return None
          safe=set()
          targets=[r for r in rows if str(r.get('code2') or '') in old_codes]
          with concurrent.futures.ThreadPoolExecutor(max_workers=14) as ex:
            for c in ex.map(exact,targets):
              if c:safe.add(c)
          cleanup=sorted(old_codes-safe)
          with open(outf,'w',encoding='utf-8') as f:
            for c in cleanup:f.write(json.dumps({'code2':c},ensure_ascii=False)+'\n')
          print(json.dumps({'old_manifest':len(old_codes),'exact_safe':len(safe),'cleanup':len(cleanup)},ensure_ascii=False))
          PY
      - name: Apply cleanup safely
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://${CPANEL_HOST}:2083"; AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          for f in product_image_seed.php index.php; do
            curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}" --data-urlencode "file=${f}" --data-urlencode "content@TehranSupermarket/${f}" "${BASE}/execute/Fileman/save_file_content" >/dev/null
          done
          curl -sS --fail-with-body -H "$AUTH" --request POST --data-urlencode "dir=${TARGET_DIR}/storage" --data-urlencode 'file=product_image_cleanup_0_800.jsonl' --data-urlencode "content@$RUNNER_TEMP/cleanup.jsonl" "${BASE}/execute/Fileman/save_file_content" >/dev/null
          curl -sS -L --max-time 120 'https://websaza.ir/tehran/' >/dev/null
          sleep 2
          curl -sS --fail-with-body -H "$AUTH" -H 'Accept: application/json' --get --data-urlencode "dir=${TARGET_DIR}/storage" --data-urlencode 'file=product_image_cleanup_status.json' "${BASE}/execute/Fileman/get_file_content" | jq -r '.result.data.content // .data.content // empty'
