name: Tehran DB Diagnostic Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/tehran-db-diagnostic-temp'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test product name lookup and image fields
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,ssl,concurrent.futures
          names=['جيف','شاني قوطي','آدامس فايو','روغن ذرت رويال','چايي دلفين معطر','مانستر سبز هپي','تريدنت توت فرنگي']
          ctx=ssl.create_default_context();ctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36'
          def one(name):
            qs=urllib.parse.urlencode({'query':name,'latitude':'35.757453','longitude':'51.409882','page':0,'page_size':20,'size':20,'fetch_filters':1,'firstPage':'true','origin':'search'})
            u='https://svc.snapp.market/mobile/v3/search?'+qs
            try:
              req=urllib.request.Request(u,headers={'User-Agent':ua,'Accept':'application/json','Origin':'https://snapp.market','Referer':'https://snapp.market/'})
              with urllib.request.urlopen(req,timeout=25,context=ctx) as r: d=json.loads(r.read(4_000_000))
              vp=d.get('data',{}).get('vendor_product_variations',{}).get('items',[])
              simplified=[]
              for x in vp[:8]:
                simplified.append({'keys':list(x.keys())[:30],'data':x})
              return name,{'count':len(vp),'items':simplified}
            except Exception as e:return name,{'error':f'{type(e).__name__}: {e}'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
            for n,res in ex.map(one,names):
              print('===',n,'===')
              print(json.dumps(res,ensure_ascii=False)[:9000])
          PY
