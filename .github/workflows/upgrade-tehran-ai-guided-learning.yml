name: Upgrade Tehran AI Guided Learning

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/upgrade-tehran-ai-guided-learning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
      - name: Patch guided AI flow and learning
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Order schema: explicitly store pickup vs delivery.
          p=Path('TehranSupermarket/schema.php')
          s=p.read_text(encoding='utf-8')
          needle="    if(!isset($orderCols['status_updated_at'])) $oa[]=\"ADD COLUMN status_updated_at DATETIME NULL\";\n"
          add=needle+"    if(!isset($orderCols['fulfillment_method'])) $oa[]=\"ADD COLUMN fulfillment_method VARCHAR(20) NOT NULL DEFAULT 'delivery' AFTER status\";\n"
          if "orderCols['fulfillment_method']" not in s:
              if needle not in s: raise SystemExit('schema insertion point missing')
              s=s.replace(needle,add,1)
          p.write_text(s,encoding='utf-8')

          # Adaptive fuzzy search: consume learned aliases and bounded product signals.
          p=Path('TehranSupermarket/ai_search_fuzzy.php')
          s=p.read_text(encoding='utf-8')
          old="    require_once __DIR__.'/schema.php';ensure_product_schema($pdo);\n"
          new=old+"    require_once __DIR__.'/ai_learning_lib.php';ts_ai_learning_schema($pdo);\n"
          if 'ts_ai_learning_schema($pdo)' not in s:
              if old not in s: raise SystemExit('fuzzy schema point missing')
              s=s.replace(old,new,1)
          rows='''$rows=$pdo->query("SELECT id,name,brand,quantity_label,category,image_path,price,stock FROM products WHERE active=1 AND price>0 ORDER BY id DESC LIMIT 12000")->fetchAll();\n'''
          if '$learnedAliases=ts_ai_alias_map($pdo);' not in s:
              if rows not in s: raise SystemExit('fuzzy rows point missing')
              s=s.replace(rows,rows+"$learnedAliases=ts_ai_alias_map($pdo);$learnedScores=ts_ai_score_map($pdo);\n",1)
          marker="$origTokens=fs_tokens($q);if(!$origTokens)$origTokens=[fs_norm($q)];"
          if 'foreach($learnedAliases as $k=>$v)' not in s:
              if marker not in s: raise SystemExit('fuzzy direct-map point missing')
              s=s.replace(marker,"foreach($learnedAliases as $k=>$v){if(!isset($direct[$k]))$direct[$k]=$v;}\n"+marker,1)
          score="$score=((int)$p['stock']>0?25:-150);$matched=0;"
          score2="$score=((int)$p['stock']>0?25:-150)+min(85.0,max(0.0,(float)($learnedScores[(int)$p['id']]??0)));$matched=0;"
          if score in s:s=s.replace(score,score2,1)
          final="fs_out(['ok'=>true,'query'=>$q,'corrected_query'=>$corrections?$correctedQuery:null,'corrections'=>$corrections,'suggestions'=>$sug,'items'=>$items,'count'=>count($items)]);"
          if "ts_ai_log_event($pdo,'search'" not in s:
              if final not in s: raise SystemExit('fuzzy final point missing')
              s=s.replace(final,"ts_ai_log_event($pdo,'search',$q,$corrections?$correctedQuery:null,null,0,null);\n"+final,1)
          p.write_text(s,encoding='utf-8')

          # Checkout backend: pickup is a real zero-delivery-fee path; delivery keeps address/location requirements.
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')
          old="$name=trim((string)($_POST['name']??''));$phone=trim((string)($_POST['phone']??''));$address=trim((string)($_POST['address']??''));$slot=trim((string)($_POST['slot']??'اولین زمان ممکن'));$zoneId=max(0,(int)($_POST['zone_id']??0));$couponCode=trim((string)($_POST['coupon_code']??''));"
          new="$name=trim((string)($_POST['name']??''));$phone=trim((string)($_POST['phone']??''));$address=trim((string)($_POST['address']??''));$slot=trim((string)($_POST['slot']??'اولین زمان ممکن'));$zoneId=max(0,(int)($_POST['zone_id']??0));$couponCode=trim((string)($_POST['coupon_code']??''));$fulfillment=in_array((string)($_POST['fulfillment_method']??'delivery'),['pickup','delivery'],true)?(string)$_POST['fulfillment_method']:'delivery';"
          if '$fulfillment=in_array' not in s:
              if old not in s: raise SystemExit('checkout fields point missing')
              s=s.replace(old,new,1)
          old="if(mb_strlen($name)<2||!preg_match('/^09\\d{9}$/',$phone)||mb_strlen($address)<5){$_SESSION['flash']=ts_error_text('REQ-101');header('Location:index.php#checkout');exit;}$cart=$_SESSION['cart']??[];"
          new="if(mb_strlen($name)<2||!preg_match('/^09\\d{9}$/',$phone)||($fulfillment==='delivery'&&mb_strlen($address)<5)){$_SESSION['flash']=ts_error_text('REQ-101');header('Location:index.php#checkout');exit;}if($fulfillment==='pickup'){$address='تحویل حضوری از فروشگاه';$deliveryLat=null;$deliveryLng=null;$deliveryAccuracy=null;$slot='تحویل حضوری';}$cart=$_SESSION['cart']??[];"
          if "($fulfillment==='delivery'&&mb_strlen($address)<5)" not in s:
              if old not in s: raise SystemExit('checkout validation point missing')
              s=s.replace(old,new,1)
          old="$zone=$dbZones?delivery_zone($pdo,$zoneId):($zoneId===0?$zones[0]:null);if(!$zone){$_SESSION['flash']=ts_error_text('SHOP-204');header('Location:index.php#checkout');exit;}"
          new="if($fulfillment==='pickup'){$zone=['id'=>null,'name'=>'تحویل حضوری','fee'=>0,'min_order'=>0,'eta'=>'تحویل از فروشگاه'];$zoneId=0;}else{$zone=$dbZones?delivery_zone($pdo,$zoneId):($zoneId===0?$zones[0]:null);if(!$zone){$_SESSION['flash']=ts_error_text('SHOP-204');header('Location:index.php#checkout');exit;}}"
          if "'name'=>'تحویل حضوری','fee'=>0" not in s:
              if old not in s: raise SystemExit('checkout zone point missing')
              s=s.replace(old,new,1)
          old="$st=$pdo->prepare('SELECT id FROM customers WHERE phone=? ORDER BY id DESC LIMIT 1');$st->execute([$phone]);$cid=(int)($st->fetchColumn()?:0);if($cid){$pdo->prepare('UPDATE customers SET name=?,address=? WHERE id=?')->execute([$name,$address,$cid]);}else{$pdo->prepare('INSERT INTO customers(name,phone,address,created_at) VALUES(?,?,?,NOW())')->execute([$name,$phone,$address]);$cid=(int)$pdo->lastInsertId();}"
          new="$st=$pdo->prepare('SELECT id FROM customers WHERE phone=? ORDER BY id DESC LIMIT 1');$st->execute([$phone]);$cid=(int)($st->fetchColumn()?:0);if($cid){if($fulfillment==='delivery'){$pdo->prepare('UPDATE customers SET name=?,address=? WHERE id=?')->execute([$name,$address,$cid]);}else{$pdo->prepare('UPDATE customers SET name=? WHERE id=?')->execute([$name,$cid]);}}else{$pdo->prepare('INSERT INTO customers(name,phone,address,created_at) VALUES(?,?,?,NOW())')->execute([$name,$phone,$address]);$cid=(int)$pdo->lastInsertId();}"
          if "if($fulfillment==='delivery'){$pdo->prepare('UPDATE customers" not in s:
              if old not in s: raise SystemExit('customer update point missing')
              s=s.replace(old,new,1)
          old="$pdo->prepare('INSERT INTO orders(customer_id,status,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,delivery_lat,delivery_lng,delivery_accuracy,public_token,coupon_code,discount_total,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new','cod','unpaid',$slot,$sub,$fee,$total,$zoneId?:null,$zone['name'],$zone['eta']?:null,$deliveryLat,$deliveryLng,$deliveryAccuracy,$publicToken,$coupon['code']?:null,$discount]);"
          new="$pdo->prepare('INSERT INTO orders(customer_id,status,fulfillment_method,payment_method,payment_status,delivery_slot,subtotal,delivery_fee,total,delivery_zone_id,delivery_zone_name,delivery_eta,delivery_lat,delivery_lng,delivery_accuracy,public_token,coupon_code,discount_total,created_at,status_updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,NOW(),NOW())')->execute([$cid,'new',$fulfillment,'cod','unpaid',$slot,$sub,$fee,$total,$fulfillment==='delivery'&&$zoneId?$zoneId:null,$zone['name'],$zone['eta']?:null,$deliveryLat,$deliveryLng,$deliveryAccuracy,$publicToken,$coupon['code']?:null,$discount]);"
          if 'status,fulfillment_method,payment_method' not in s:
              if old not in s: raise SystemExit('order insert point missing')
              s=s.replace(old,new,1)
          old="$pdo->commit();ts_sms_order_event($pdo,$oid,'created');"
          new="$pdo->commit();try{require_once __DIR__.'/ai_learning_lib.php';ts_ai_learning_schema($pdo);ts_ai_learn_order($pdo,$items,$fulfillment);}catch(Throwable $learnErr){}ts_sms_order_event($pdo,$oid,'created');"
          if 'ts_ai_learn_order($pdo,$items,$fulfillment)' not in s:
              if old not in s: raise SystemExit('order learn point missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Make fresh frontend assets load and auto-open AI once per session.
          p=Path('TehranSupermarket/assets/ai_assistant_autocommit.js')
          s=p.read_text(encoding='utf-8').replace('assets/ai_spell_helper.js?v=20261026-1','assets/ai_spell_helper.js?v=20261026-2')
          p.write_text(s,encoding='utf-8')

          p=Path('TehranSupermarket/index.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/ai_assistant_autocommit.js?v=20261026-2','assets/ai_assistant_autocommit.js?v=20261026-3')
          s=s.replace('assets/ai_location_checkout.js?v=20261026-1','assets/ai_location_checkout.js?v=20261026-2')
          if 'assets/ai_entry_flow.js' not in s:
              loader='''$aiEntry = '<script src="assets/ai_entry_flow.js?v=20261026-1"></script>';\n$html = str_replace('</body>', $aiEntry.'</body>', $html);\n\n$aiLearning = '<script src="assets/ai_learning.js?v=20261026-1"></script>';\n$html = str_replace('</body>', $aiLearning.'</body>', $html);\n\n'''
              if 'echo $html;' not in s: raise SystemExit('index loader point missing')
              s=s.replace('echo $html;',loader+'echo $html;',1)
          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/schema.php
          php -l TehranSupermarket/shop.php
          php -l TehranSupermarket/ai_search_fuzzy.php
          php -l TehranSupermarket/ai_learning_lib.php
          php -l TehranSupermarket/ai_learning.php
          php -l TehranSupermarket/index.php
          node --check TehranSupermarket/assets/ai_entry_flow.js
          node --check TehranSupermarket/assets/ai_learning.js
          node --check TehranSupermarket/assets/ai_location_checkout.js
          node --check TehranSupermarket/assets/ai_spell_helper.js
          node --check TehranSupermarket/assets/ai_assistant_autocommit.js
      - name: Commit upgraded AI flow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/schema.php TehranSupermarket/shop.php TehranSupermarket/ai_search_fuzzy.php TehranSupermarket/index.php TehranSupermarket/assets/ai_assistant_autocommit.js
          if ! git diff --cached --quiet; then
            git commit -m 'Enable AI entry flow pickup delivery and adaptive learning'
            git push origin HEAD:websaza-hosting
          fi
