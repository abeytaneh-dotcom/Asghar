name: Probe Product Image Sources Temp
on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/triggers/probe-product-image-sources-temp'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe public search pages
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          Q=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('کره بادام زمینی جیف'))
          PY
          )
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36'
          urls=(
            "https://www.okala.com/search?query=$Q"
            "https://okala.com/search?query=$Q"
            "https://snapp.market/search?query=$Q"
            "https://snapp.market/search?q=$Q"
            "https://www.digikalajet.com/search/?q=$Q"
            "https://www.digikalajet.com/search?q=$Q"
            "https://www.modiseh.com/search?q=$Q"
            "https://www.modiseh.com/search?query=$Q"
          )
          : > "$OUT/summary.txt"
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1)); body="$OUT/body_$i.html"; hdr="$OUT/hdr_$i.txt"
            code=$(curl -L -k -sS --compressed --connect-timeout 12 --max-time 35 -A "$UA" -D "$hdr" -o "$body" -w '%{http_code}' "$u" || true)
            bytes=$(wc -c < "$body" 2>/dev/null || echo 0)
            title=$(grep -oiE '<title[^>]*>[^<]+' "$body" | head -n1 | sed 's/<title[^>]*>//I' | tr '\n' ' ' || true)
            echo "[$i] code=$code bytes=$bytes title=$title url=$u" >> "$OUT/summary.txt"
            grep -Eo 'https?://[^"'"' <>]+' "$body" | grep -Ei '\.(jpg|jpeg|png|webp)(\?|$)|image|product|cdn' | head -n 40 > "$OUT/urls_$i.txt" || true
            grep -Eio '(/[^"'"' <>]*(search|product|api|graphql)[^"'"' <>]*)' "$body" | head -n 80 > "$OUT/paths_$i.txt" || true
          done
          cat "$OUT/summary.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: product-image-source-probe
          path: ${{ runner.temp }}/out
          retention-days: 1
