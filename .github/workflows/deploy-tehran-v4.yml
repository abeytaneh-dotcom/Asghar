name: Deploy Tehran Reference V4

on:
  push:
    branches: [websaza-hosting]
    paths:
      - '.github/workflows/deploy-tehran-v4.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPANEL_HOST: mch4444.dnsuserver.com
      CPANEL_USER: vt6qdx8
      CPANEL_TOKEN: ${{ secrets.WEBSAZA_CPANEL_TOKEN }}
      TARGET_DIR: public_html/tehran
      PUBLIC_URL: https://websaza.ir/tehran
    steps:
      - uses: actions/checkout@v4
        with:
          ref: websaza-hosting
          fetch-depth: 0

      - name: Make hero structural and remove legacy mobile hide
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TehranSupermarket/shop.php')
          s=p.read_text(encoding='utf-8')

          # Never hide the hero on mobile in the base template.
          s=s.replace('@media(max-width:800px){.hero{display:none}', '@media(max-width:800px){.hero{display:flex}')

          # Force current stylesheet versions.
          s=s.replace('assets/tehran-reference-v4.css?v=20261027-4','assets/tehran-reference-v4.css?v=20261027-6')
          s=s.replace('assets/tehran-reference-v4-mobilefix.css?v=20261027-1','assets/tehran-reference-v4-mobilefix.css?v=20261027-6')

          old='<section class="hero tmx-hero" id="smart-shopping"><div class="tmx-hero-copy">'
          new='''<section class="hero tmx-hero" id="smart-shopping" style="display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;overflow:hidden!important;background:#050608!important;isolation:isolate!important"><img class="tmx-hero-real-image-v6" src="assets/tehran-storefront-v2.svg?v=20261027-6" alt="فروشگاه شیشه‌ای طهران مارکت" style="position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:69% center!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:0!important;pointer-events:none!important"><span aria-hidden="true" style="position:absolute!important;inset:0!important;display:block!important;background:linear-gradient(0deg,rgba(5,6,8,.96) 0%,rgba(5,6,8,.76) 40%,rgba(5,6,8,.18) 78%,rgba(5,6,8,.08) 100%)!important;z-index:1!important"></span><div class="tmx-hero-copy" style="display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:2!important">'''
          if 'tmx-hero-real-image-v6' not in s:
              if old not in s:
                  raise SystemExit('hero anchor missing')
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          php -l TehranSupermarket/shop.php
          grep -Fq 'tmx-hero-real-image-v6' TehranSupermarket/shop.php
          grep -Fq 'display:flex!important;visibility:visible!important' TehranSupermarket/shop.php
          grep -Fq 'tehran-storefront-v2.svg?v=20261027-6' TehranSupermarket/shop.php
          ! grep -Fq '@media(max-width:800px){.hero{display:none}' TehranSupermarket/shop.php

      - name: Persist structural hero fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TehranSupermarket/shop.php
          if ! git diff --cached --quiet; then
            git commit -m 'Render Tehran hero directly in storefront HTML'
            git push origin HEAD:websaza-hosting
          fi

      - name: Upload structural storefront
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${CPANEL_HOST}:2083"
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          upload(){
            local src="$1" dir="$2" file="$3" out="$RUNNER_TEMP/save.json"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -H "$AUTH" --request POST \
              --data-urlencode "dir=${dir}" --data-urlencode "file=${file}" --data-urlencode "content@${src}" \
              "${BASE}/execute/Fileman/save_file_content" -o "$out"
            test "$(jq -r '.result.status // .status // 0' "$out")" = '1'
          }
          upload TehranSupermarket/shop.php "$TARGET_DIR" shop.php
          upload TehranSupermarket/assets/tehran-reference-v4.css "$TARGET_DIR/assets" tehran-reference-v4.css
          upload TehranSupermarket/assets/tehran-reference-v4-mobilefix.css "$TARGET_DIR/assets" tehran-reference-v4-mobilefix.css
          upload TehranSupermarket/assets/tehran-storefront-v2.svg "$TARGET_DIR/assets" tehran-storefront-v2.svg

      - name: Verify structural hero on live site
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/?reference=20261027-6" -o "$RUNNER_TEMP/home.html"
          curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' "${PUBLIC_URL}/assets/tehran-storefront-v2.svg?v=20261027-6" -o "$RUNNER_TEMP/store.svg"
          grep -Fq 'tmx-hero-real-image-v6' "$RUNNER_TEMP/home.html"
          grep -Fq 'display:flex!important;visibility:visible!important' "$RUNNER_TEMP/home.html"
          grep -Fq 'tehran-storefront-v2.svg?v=20261027-6' "$RUNNER_TEMP/home.html"
          ! grep -Fq '@media(max-width:800px){.hero{display:none}' "$RUNNER_TEMP/home.html"
          grep -Fq 'اولین فروشگاه' "$RUNNER_TEMP/home.html"
          grep -Fq 'نمای فروشگاه شیشه‌ای مدرن طهران مارکت' "$RUNNER_TEMP/store.svg"
          echo 'REFERENCE_V6_LIVE_OK structural_img=present hero=forced_visible legacy_mobile_hide=removed headline=present'
