name: Build Care AI M4 Eye Fix APK

on:
  push:
    branches:
      - care-ai-eye-m2
    paths:
      - 'care-ai/**'
      - '.github/workflows/build-care-ai.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle MediaPipe face model
        run: |
          mkdir -p care-ai/app/src/main/assets
          curl -L --fail --retry 3             -o care-ai/app/src/main/assets/face_landmarker.task             https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          test -s care-ai/app/src/main/assets/face_landmarker.task

      - name: Build APK
        run: |
          cd care-ai
          gradle :app:assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p dist
          cp care-ai/app/build/outputs/apk/debug/app-debug.apk dist/CareAI-M4-Eye-Fix-debug.apk

      - name: Publish APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/CareAI-M4-Eye-Fix-debug.apk
          git diff --cached --quiet || git commit -m "Build Care AI M4 Eye Fix APK"
          git push origin HEAD:care-ai-eye-m2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareAI-M4-Eye-Fix-debug
          path: care-ai/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
