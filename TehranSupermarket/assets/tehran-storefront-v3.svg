  <g fill="#a36d50"><rect x="1090" y="457" width="31" height="41" rx="5"/><rect x="1134" y="445" width="43" height="53" rx="7"/><rect x="1191" y="464" width="28" height="34" rx="5"/><rect x="1233" y="450" width="36" height="48" rx="6"/><rect x="1283" y="457" width="34" height="41" rx="6"/></g>
