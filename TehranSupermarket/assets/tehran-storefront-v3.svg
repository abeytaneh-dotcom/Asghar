<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="نمای بیرونی فروشگاه شیشه‌ای مشکی طهران مارکت در شب">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151a1e"/><stop offset=".55" stop-color="#07090b"/><stop offset="1" stop-color="#020304"/></linearGradient>
 <linearGradient id="facade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1f22"/><stop offset=".45" stop-color="#080a0c"/><stop offset="1" stop-color="#171a1d"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24343c" stop-opacity=".92"/><stop offset=".45" stop-color="#10191e" stop-opacity=".9"/><stop offset="1" stop-color="#060a0c" stop-opacity=".98"/></linearGradient>
 <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd86f" stop-opacity=".8"/><stop offset=".55" stop-color="#d9a62c" stop-opacity=".25"/><stop offset="1" stop-color="#7f5b0f" stop-opacity=".06"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b77c08"/><stop offset=".38" stop-color="#f6c945"/><stop offset=".72" stop-color="#ffe784"/><stop offset="1" stop-color="#bd8516"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101316"/><stop offset="1" stop-color="#020304"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".7"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1220" cy="105" r="170" fill="#f0c64a" opacity=".035" filter="url(#glow)"/>
<rect x="0" y="700" width="1600" height="200" fill="url(#road)"/>
<path d="M0 735H1600" stroke="#22282c" stroke-width="3"/>
<path d="M110 842h1380" stroke="#b88a28" stroke-width="3" stroke-dasharray="38 70" opacity=".18"/>

