[platformio]
src_dir = .
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  h2zero/NimBLE-Arduino@2.3.2
  bblanchon/ArduinoJson@7.4.2

; Compile coverage only. Do not flash until the actual PCB is verified.
[env:esp32-c3-verified-bench]
extends = env:esp32-c3
build_flags =
  ${env:esp32-c3.build_flags}
  -D KR_HARDWARE_VERIFIED=1
