plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.websaza.tehranmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.websaza.tehranmanager'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
